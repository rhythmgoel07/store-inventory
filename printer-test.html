<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Printer test</title>
<style>
body{font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:560px;margin:auto;color:#1c1c1c;background:#faf9f6}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px}
p{margin:6px 0;color:#555;font-size:14px}
button{font:inherit;padding:12px 14px;margin:4px 6px 4px 0;border:1px solid #1c1c1c;border-radius:8px;background:#fff}
button.go{background:#1c1c1c;color:#fff}button:disabled{opacity:.4}
#st{font-weight:600;margin:10px 0}
#log{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;min-height:80px;margin-top:8px}
label{font-size:14px;color:#555}
</style></head><body>
<h1>Printer test</h1>
<p>Seznik DEV. Open in Chrome. Each button sends one small job so we can see which commands the printer understands.</p>

<h2>1. Connect</h2>
<button class="go" id="c-ble">Bluetooth</button>
<button id="c-serial">Serial / COM port</button>
<button id="c-usb">USB</button>
<p><label><input type="checkbox" id="all"> Show every Bluetooth device, not only ones named "Seznik"</label></p>
<div id="st">Not connected</div>

<h2>2. Label roll loaded, printer in label mode</h2>
<button class="t" id="p-tspl" disabled>Label A (TSPL)</button>
<button class="t" id="p-cpcl" disabled>Label B (CPCL)</button>
<p>Label size <select id="size"><option>50x30</option><option>50x25</option><option>40x30</option><option>40x20</option></select></p>

<h2>3. Receipt roll loaded, printer in receipt mode</h2>
<button class="t" id="p-rcpt" disabled>Receipt (ESC/POS)</button>

<h2>Log</h2>
<div id="log"></div>
<script>
/* rawprint.js — raw label and receipt printing for the store-inventory PWA.
 *
 * Transports (all browser APIs, Chrome/Edge only, HTTPS, must start from a tap/click):
 *   RawPrint.connect("ble")    Android  — Web Bluetooth. BLE only: a printer that is
 *                                         Bluetooth-Classic-only will not appear.
 *   RawPrint.connect("serial") Windows  — Web Serial. A USB virtual COM port, or the
 *                                         COM port Windows makes when the printer is
 *                                         paired over Bluetooth.
 *   RawPrint.connect("usb")    Windows  — WebUSB, printer class. Windows blocks this
 *                                         while its own printer driver holds the device.
 * Encoders:
 *   RawPrint.label(item, opts)   -> bytes, TSPL (default) or CPCL
 *   RawPrint.receipt(doc, opts)  -> bytes, ESC/POS
 * Usage:
 *   const p = await RawPrint.connect("ble");
 *   await p.send(RawPrint.label({name, sku, barcode, mrp, price}, {w:50, h:30}));
 *   await p.close();
 */
const RawPrint = (() => {
  "use strict";
  const DPMM = 8;                       // 203 dpi
  const HEAD = 384;                     // 48 mm printable width, in dots

  /* ---------- bytes ---------- */
  // Printer fonts are single-byte: keep ASCII, turn the rupee sign into "Rs.".
  const ascii = s => String(s ?? "").replace(/₹\s*/g, "Rs.").normalize("NFKD")
    .replace(/[^\x20-\x7E]/g, "");
  const str = s => Uint8Array.from(ascii(s), c => c.charCodeAt(0));
  const cat = (...parts) => {
    const arrs = parts.flat(Infinity).map(p => typeof p === "string" ? str(p)
      : p instanceof Uint8Array ? p : Uint8Array.from([p]));
    const out = new Uint8Array(arrs.reduce((n, a) => n + a.length, 0));
    let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; }
    return out;
  };
  const money = v => v == null || v === "" ? "" : "Rs." + Number(v).toLocaleString("en-IN");
  const wrap = (s, n, max) => {          // word-wrap to n chars, at most max lines
    const out = []; let line = "";
    for (const w of ascii(s).split(/\s+/)) {
      if ((line + " " + w).trim().length <= n) line = (line + " " + w).trim();
      else { if (line) out.push(line); line = w.slice(0, n); }
    }
    if (line) out.push(line);
    return out.slice(0, max);
  };
  // Code 128 width in modules: start + data + check + stop. Digit-only codes of even
  // length pack two digits per symbol (set C).
  const c128modules = d => 11 * ((/^\d+$/.test(d) && d.length % 2 === 0 ? d.length / 2 : d.length) + 2) + 13;

  /* ---------- labels ---------- */
  function label(item, o = {}) {
    const lang = o.lang || "tspl", W = o.w || 50, H = o.h || 30, copies = o.copies || 1;
    const wd = Math.min(W * DPMM, HEAD), hd = H * DPMM;
    const x0 = Math.max(0, Math.round((W * DPMM - wd) / 2)) + 4;   // keep inside the head
    const cols = Math.floor((wd - 8) / 12);                        // 12-dot-wide font
    const name = wrap(item.name, cols, hd >= 200 ? 2 : 1);
    const code = ascii(item.barcode || item.sku);
    const narrow = c128modules(code) * 2 <= wd - 24 ? 2 : 1;
    const bw = c128modules(code) * narrow;
    const bx = x0 + Math.max(0, Math.round((wd - 8 - bw) / 2));
    const mrp = item.mrp != null && item.mrp !== "" ? "MRP " + money(item.mrp) : "";
    const price = money(item.price);
    let y = 6;
    const yName = name.map(() => { const v = y; y += 24; return v; });
    const ySku = y; y += 26;
    const yBottom = hd - 30;
    const bh = Math.max(32, yBottom - y - 30);                     // bars, then 24 for digits
    const q = s => ascii(s).replace(/"/g, "'");

    if (lang === "cpcl") {
      return cat(
        `! 0 200 200 ${hd} ${copies}\r\n`, `PAGE-WIDTH ${W * DPMM}\r\n`,
        name.map((l, i) => `TEXT 7 0 ${x0} ${yName[i]} ${l}\r\n`),
        item.sku ? `TEXT 7 0 ${x0} ${ySku} ${ascii(item.sku)}\r\n` : "",
        `BARCODE-TEXT 7 0 2\r\n`, `BARCODE 128 ${narrow - 1} 1 ${bh} ${bx} ${y} ${code}\r\n`, `BARCODE-TEXT OFF\r\n`,
        mrp ? `TEXT 7 0 ${x0} ${yBottom} ${mrp}\r\n` : "",
        price ? `TEXT 4 0 ${x0 + wd - 12 - price.length * 16} ${yBottom - 12} ${price}\r\n` : "",
        `FORM\r\n`, `PRINT\r\n`);
    }
    return cat(
      `SIZE ${W} mm,${H} mm\r\n`, `GAP ${o.gap ?? 2} mm,0 mm\r\n`, `DIRECTION ${o.direction ?? 1}\r\n`,
      `DENSITY ${o.density ?? 8}\r\n`, `CLS\r\n`,
      name.map((l, i) => `TEXT ${x0},${yName[i]},"2",0,1,1,"${q(l)}"\r\n`),
      item.sku ? `TEXT ${x0},${ySku},"2",0,1,1,"${q(item.sku)}"\r\n` : "",
      `BARCODE ${bx},${y},"128",${bh},2,0,${narrow},${narrow},"${q(code)}"\r\n`,
      mrp ? `TEXT ${x0},${yBottom + 4},"2",0,1,1,"${q(mrp)}"\r\n` : "",
      price ? `TEXT ${x0 + wd - 12 - price.length * 16},${yBottom},"3",0,1,1,"${q(price)}"\r\n` : "",
      `PRINT 1,${copies}\r\n`);
  }
  const labels = (items, o) => cat(items.map(i => label(i, o)));

  /* ---------- receipts (ESC/POS, 58 mm = 32 characters) ---------- */
  const ESC = 0x1b, GS = 0x1d, LF = 0x0a;
  function receipt(doc, o = {}) {
    const n = o.cols || 32;
    const lr = (l, r) => { l = ascii(l); r = ascii(r); return l.slice(0, n - r.length - 1).padEnd(n - r.length) + r; };
    const rule = "-".repeat(n);
    const align = a => [ESC, 0x61, a], bold = b => [ESC, 0x45, b ? 1 : 0], size = s => [GS, 0x21, s];
    const line = s => [s, LF];
    const out = [[ESC, 0x40]];                                     // initialise
    if (doc.title) out.push(align(1), bold(1), size(0x11), line(doc.title), size(0), bold(0));
    (doc.header || []).forEach(h => out.push(align(1), line(h)));
    out.push(align(0), line(rule));
    (doc.meta || []).forEach(([k, v]) => out.push(line(lr(k, v))));
    if ((doc.meta || []).length) out.push(line(rule));
    (doc.items || []).forEach(it => {
      wrap(it.name, n, 2).forEach(l => out.push(line(l)));
      out.push(line(lr(`  ${it.qty} x ${money(it.rate)}`, money(it.amount ?? it.qty * it.rate))));
    });
    out.push(line(rule));
    (doc.totals || []).forEach(([k, v, strong]) => out.push(bold(strong), line(lr(k, typeof v === "number" ? money(v) : v)), bold(0)));
    if (doc.barcode) {
      const d = ascii(doc.barcode), payload = cat("{B", d);
      out.push(align(1), [GS, 0x68, 60], [GS, 0x77, 2], [GS, 0x48, 2], [GS, 0x6b, 73, payload.length], payload, LF);
    }
    (doc.footer || []).forEach(f => out.push(align(1), line(f)));
    out.push(align(0), [ESC, 0x64, o.feed ?? 4]);                  // feed past the tear bar
    if (o.cut) out.push([GS, 0x56, 66, 0]);
    return cat(out);
  }

  /* ---------- transports ---------- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // Write services seen on small thermal printers. The first writable characteristic wins.
  const BLE_SERVICES = [0x18f0, 0xff00, 0xffe0, 0xae30, 0xfee7,
    "49535343-fe7d-4ae5-8fa9-9fafd205e455", "e7810a71-73ae-499d-8c15-faa9aef0c3f2"];

  async function ble(o = {}) {
    if (!navigator.bluetooth) throw new Error("This browser has no Web Bluetooth. Use Chrome on Android.");
    const dev = await navigator.bluetooth.requestDevice(o.namePrefix
      ? { filters: [{ namePrefix: o.namePrefix }], optionalServices: BLE_SERVICES }
      : { acceptAllDevices: true, optionalServices: BLE_SERVICES });
    const gatt = await dev.gatt.connect();
    let ch = null;
    for (const s of await gatt.getPrimaryServices()) {
      for (const c of await s.getCharacteristics())
        if (c.properties.writeWithoutResponse || c.properties.write) { ch = c; break; }
      if (ch) break;
    }
    if (!ch) { gatt.disconnect(); throw new Error("Connected, but found no writable channel on " + (dev.name || "the printer") + "."); }
    const fast = ch.properties.writeWithoutResponse, chunk = o.chunk || 100;
    return {
      kind: "ble", name: dev.name || "Bluetooth printer",
      async send(data) {
        for (let i = 0; i < data.length; i += chunk) {
          const part = data.subarray(i, i + chunk);
          if (fast) { await ch.writeValueWithoutResponse(part); await sleep(o.delay ?? 20); }
          else await ch.writeValueWithResponse(part);
        }
      },
      async close() { gatt.disconnect(); }
    };
  }

  async function serial(o = {}) {
    if (!navigator.serial) throw new Error("This browser has no Web Serial. Use Chrome or Edge on Windows.");
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: o.baudRate || 9600 });
    return {
      kind: "serial", name: "Serial printer",
      async send(data) { const w = port.writable.getWriter(); try { await w.write(data); } finally { w.releaseLock(); } },
      async close() { await port.close(); }
    };
  }

  async function usb() {
    if (!navigator.usb) throw new Error("This browser has no WebUSB. Use Chrome or Edge on Windows.");
    const dev = await navigator.usb.requestDevice({ filters: [{ classCode: 7 }] });   // printer class
    await dev.open();
    if (!dev.configuration) await dev.selectConfiguration(1);
    let found = null;
    for (const itf of dev.configuration.interfaces) for (const alt of itf.alternates) {
      const ep = alt.endpoints.find(e => e.direction === "out" && e.type === "bulk");
      if (alt.interfaceClass === 7 && ep && !found) found = { itf: itf.interfaceNumber, ep: ep.endpointNumber };
    }
    if (!found) throw new Error("No printer interface found on that USB device.");
    try { await dev.claimInterface(found.itf); }
    catch (e) { throw new Error("Windows is holding this printer with its own driver, so the browser cannot open it. Use the Serial or Bluetooth route instead."); }
    return {
      kind: "usb", name: dev.productName || "USB printer",
      async send(data) { for (let i = 0; i < data.length; i += 4096) await dev.transferOut(found.ep, data.subarray(i, i + 4096)); },
      async close() { await dev.close(); }
    };
  }

  const connect = (kind, o) => ({ ble, serial, usb })[kind](o);
  const supported = () => typeof navigator === "undefined" ? {} :
    ({ ble: !!navigator.bluetooth, serial: !!navigator.serial, usb: !!navigator.usb });

  return { connect, supported, label, labels, receipt, cat };
})();
if (typeof window !== "undefined") window.RawPrint = RawPrint;
if (typeof module !== "undefined") module.exports = RawPrint;
</script>
<script>
const $=i=>document.getElementById(i);let P=null;
const log=m=>{$("log").textContent+=new Date().toLocaleTimeString()+"  "+m+"\n"};
const st=m=>{$("st").textContent=m;log(m)};
const on=b=>document.querySelectorAll(".t").forEach(x=>x.disabled=!b);
const sup=RawPrint.supported();
if(!sup.ble)$("c-ble").disabled=true;if(!sup.serial)$("c-serial").disabled=true;if(!sup.usb)$("c-usb").disabled=true;
log("This browser: Bluetooth "+(sup.ble?"yes":"no")+", Serial "+(sup.serial?"yes":"no")+", USB "+(sup.usb?"yes":"no"));
async function conn(kind){
  try{ if(P){try{await P.close()}catch(e){} P=null;on(false)}
    P=await RawPrint.connect(kind,kind==="ble"&&!$("all").checked?{namePrefix:"Seznik"}:{});
    st("Connected: "+P.name+" ("+P.kind+")");on(true);
  }catch(e){st("Not connected");log("Connect failed: "+e.message)}
}
["ble","serial","usb"].forEach(k=>$("c-"+k).onclick=()=>conn(k));
const item={name:"Test Coffee Table Walnut",sku:"BH-TEST-001",barcode:"890123456789",mrp:24999,price:18999};
async function send(what,data){
  try{log("Sending "+what+" ("+data.length+" bytes)");await P.send(data);log("Sent "+what+". Did it print?")}
  catch(e){log("Send failed: "+e.message)}
}
const sz=()=>{const[w,h]=$("size").value.split("x").map(Number);return{w,h}};
$("p-tspl").onclick=()=>send("label A (TSPL)",RawPrint.label(item,sz()));
$("p-cpcl").onclick=()=>send("label B (CPCL)",RawPrint.label(item,{...sz(),lang:"cpcl"}));
$("p-rcpt").onclick=()=>send("receipt (ESC/POS)",RawPrint.receipt({title:"B-HOME",header:["Printer test"],
  meta:[["Bill","TEST-1"],["Date",new Date().toLocaleDateString("en-IN")]],
  items:[{name:item.name,qty:1,rate:18999}],totals:[["Total",18999,true]],barcode:"TEST-1",footer:["Thank you"]}));
</script></body></html>
