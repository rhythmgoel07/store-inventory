<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f3a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light dark;
 --bg:#f6f4ef;--card:#fff;--ink:#1d2421;--mute:#616b66;--line:#e3dfd6;--brand:#1f3a34;--brand2:#2f5a50;--accent:#c8873a;
 --bad:#b3392f;--ok:#2d7a4f;--warn:#8a5a12;--link:#1f5a4d;--tagbg:rgba(127,127,127,.14);--toast:#262e2b;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121816;--card:#1a221f;--ink:#e8ece9;--mute:#9fada7;--line:#2f3b37;--brand:#2a4f46;--brand2:#4a8f7e;--accent:#e0a458;
 --bad:#f08478;--ok:#5ec98e;--warn:#e8bc5c;--link:#7fd0b6;--tagbg:rgba(255,255,255,.10);--toast:#2b3531;--shadow:none}}
:root[data-theme="dark"]{
 --bg:#121816;--card:#1a221f;--ink:#e8ece9;--mute:#9fada7;--line:#2f3b37;--brand:#2a4f46;--brand2:#4a8f7e;--accent:#e0a458;
 --bad:#f08478;--ok:#5ec98e;--warn:#e8bc5c;--link:#7fd0b6;--tagbg:rgba(255,255,255,.10);--toast:#2b3531;--shadow:none}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
/* Links were never styled, so every browser used its own blue — unreadable on a dark phone,
   and purple once visited. One colour, from the palette, in both schemes. */
a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
a:visited{color:var(--link)}
a:hover{text-decoration-thickness:2px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
.hide{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--brand);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.side .logo{font-weight:700;font-size:17px;padding:4px 10px 14px;letter-spacing:.2px}
nav.side .logo small{display:block;font-weight:400;opacity:.7;font-size:12px}
nav.side button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.85;display:flex;gap:10px;align-items:center}
nav.side button:hover{background:rgba(255,255,255,.08)}
nav.side button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
nav.side .sp{flex:1}
nav.side .me{font-size:12px;opacity:.8;padding:8px 10px;border-top:1px solid rgba(255,255,255,.15)}
main{padding:22px;max-width:1200px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px}
.stat .s{font-size:12px;color:var(--mute)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:rgba(127,127,127,.08)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f .full{grid-column:1/-1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--tagbg);line-height:1.45}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.low{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tag.out{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:12px}
table td.c,table th.c{text-align:center}
.badge{background:var(--accent);color:#1d2421;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700;margin-left:auto}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg.top{z-index:60;align-items:center}
.cam-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cam-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:14px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;border:1px solid rgba(255,255,255,.16);padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--bad)}
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.scanrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.scanrow input{flex:1 1 240px}
.emptycart{text-align:center;padding:26px 14px;color:var(--mute)}
.items{display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.item:hover{border-color:var(--brand2)}
.item b{font-weight:600}
.warnbox{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);
  border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--ink)}
.cartbar{display:flex;gap:10px;align-items:center;padding:6px 0 10px;border-bottom:1px solid var(--line);font-size:14px}
.cartline{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cpick{display:flex;gap:7px;align-items:center;margin:0;color:var(--ink);font-size:14px}
.cartline .cpick{align-items:flex-start;padding-top:2px}
.cpick input{width:18px;height:18px;flex:none}
.cmain{min-width:0}
.cname{font-size:15px;line-height:1.3}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.camt{text-align:right;white-space:nowrap}
.camt .wasamt{text-decoration:line-through}
@media(max-width:620px){
  .crow{gap:8px}
  .cartline .qty input{width:42px}
  .cartline .qty button{width:26px;height:26px}
  .cartline .linedisc input{width:64px}
  .cartline .linedisc select{width:52px}
}
.cartline.off{opacity:.55}
.cartline.off .lineamt{text-decoration:line-through}
.linetick{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:13px}
.linetick input{width:auto}
.linedisc{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.linedisc input{width:80px;padding:5px}
.linedisc select{width:62px;padding:5px}
/* On a phone the two cart-line columns are too narrow for a tick, a box, a unit and an
   amount side by side, so each gets the full width and the discount row may wrap. */
@media(max-width:620px){
  .cartline .linetick,.cartline .linedisc{grid-column:1/-1}
  .linedisc{justify-content:flex-start;flex-wrap:wrap}
  .linedisc input{width:72px}
  .linedisc select{width:58px}
}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer}
.qty input{width:52px;text-align:center;padding:5px}
.tree details{margin:4px 0}
.tree summary{cursor:pointer;padding:6px 8px;border-radius:8px}
.tree summary:hover{background:rgba(127,127,127,.08)}
.tree .leaf{padding:5px 8px 5px 26px;display:flex;justify-content:space-between;cursor:pointer;border-radius:8px}
.tree .leaf:hover{background:rgba(127,127,127,.08)}
.tree .kids{margin-left:16px;border-left:1px solid var(--line);padding-left:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.auth{max-width:380px;margin:9vh auto;padding:0 16px}
.auth h1{font-size:26px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bottom{display:none}
@media(max-width:560px){
 /* reclaim the side gutters a phone cannot spare */
 main{padding:12px 10px 90px}
 .modal-bg{padding:10px 6px}
 .modal{padding:14px;border-radius:14px}
 .top h2{font-size:19px}
 .top .btn{padding:7px 11px;font-size:13.5px}
 .stats{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
 .stat .v{font-size:20px;overflow-wrap:break-word}
 .card{padding:13px}
 .grid{gap:10px}
 .f{grid-template-columns:1fr;gap:10px}
 .f.filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .f.filters select{padding:8px 9px;font-size:14px}
 .pgrid{gap:10px}
}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 nav.side{display:none}
 main{padding:14px 12px 90px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
 .bottom button{background:none;border:0;color:#fff;opacity:.75;padding:6px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
 .bottom button.on{opacity:1;font-weight:700}
 .bottom button span{font-size:18px}
 .pos{grid-template-columns:1fr}
 .items{max-height:40vh}
 table.resp thead{display:none}
 table.resp tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
 table.resp td{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:2px 10px;border:0;padding:3px 0;text-align:right}
 table.resp td::before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left;flex:0 0 auto}
 table.resp td>div{flex:1 0 100%;text-align:right}
 table.resp td>input:not([style*=width]),table.resp td>select{flex:1 0 100%;max-width:100%}
 table.resp td:empty,table.resp td::before:empty{display:none}
 table.resp tfoot tr{background:none;border:0;padding:0}
 table.resp tfoot th{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;text-align:right;text-transform:none;font-size:13px}
 table.resp tfoot th::before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left;font-weight:400}
 table.resp tfoot th[data-l=""]{display:none}
 table.resp tfoot tr{display:block;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.stat.clk{cursor:pointer;position:relative}.stat.clk:hover{border-color:var(--brand2)}
.stat.clk::after{content:"›";position:absolute;top:8px;right:12px;font-size:17px;line-height:1;opacity:.35}
.stat.clk:hover::after{opacity:.8}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pcard.adm{cursor:pointer}.pcard.adm:hover{border-color:var(--brand2)}
.pim{aspect-ratio:1;width:100%;object-fit:cover;background:var(--line);display:grid;place-items:center;color:var(--mute);font-size:34px}
.pcard .pb{padding:10px 12px 12px;display:grid;gap:3px;flex:1;align-content:start}
.pcard .pn{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard a.pn{color:var(--link)}
.pcard .dim{color:var(--accent);font-weight:600}
.pcard .locs{line-height:1.35}.pcard .locs b{color:var(--ink);font-weight:600}
.pcard .sku{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.me .bld{opacity:.55;font-size:10.5px;letter-spacing:.2px}
.pcard .pr{font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .mrp{font-size:11.5px;color:var(--mute)}
.pcard .cost{font-size:12px;color:var(--mute);font-weight:600}
.pgal{display:flex;flex-wrap:wrap;gap:8px}
.gthumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line);flex:none}
.gthumb.cover{border-color:var(--brand2);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand2) 35%,transparent)}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gthumb button.gbtn{position:absolute;width:22px;height:22px;padding:0;border-radius:999px;border:0;cursor:pointer;
  font-size:11px;line-height:1;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff}
.gthumb button.gbtn:hover{background:rgba(0,0,0,.85)}
.gthumb .gbtn.x{top:3px;right:3px}
.gthumb .gbtn.star{bottom:3px;left:3px}
.gthumb .glabel{position:absolute;left:0;right:0;bottom:0;background:var(--brand);color:#fff;font-size:10px;
  letter-spacing:.04em;text-align:center;padding:1px 0}
.gthumb.pick{cursor:pointer}
.gthumb.pick.on{border-color:var(--brand2);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand2) 35%,transparent)}
.pwrap{position:relative}
.pcard.sel{border-color:var(--brand2);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand2) 35%,transparent)}
.pcard.incart{border-color:var(--ok)}
.lgbox{height:84px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.lgbox img{max-width:100%;max-height:100%;object-fit:contain}
.lgrow{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lgrow>.row{grid-column:2;gap:6px}
.lgrow:last-of-type{border-bottom:0}
.lgthumb{flex:none;width:92px;height:46px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden}
.lgthumb img{max-width:100%;max-height:100%;object-fit:contain}

.qty.shopq{gap:2px}
.qty.shopq input{width:34px;pointer-events:none;background:transparent}
.qty.shopq button{width:26px;height:26px}
.pcheck{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:8px;border:1.5px solid #fff;
  background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1;z-index:1}
.pcard.sel .pcheck{background:var(--brand2);border-color:var(--brand2)}
.selbar{position:sticky;top:0;z-index:30;background:var(--card);border:1px solid var(--brand2);border-radius:12px;
  padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.selbar b{font-variant-numeric:tabular-nums}
.updbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:var(--card);border:1px solid var(--brand2);
  border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  max-width:520px;margin:0 auto;font-size:14px}
.updbar span{flex:1 1 auto}
@media(max-width:620px){.updbar{bottom:68px}}
.qcell{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
.qcell input{width:92px}
.pcount{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;
  font-size:11px;padding:1px 7px;letter-spacing:.02em}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.tb{margin-left:10px;display:inline-flex;gap:4px;vertical-align:middle}
.detail{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:16px}
.detail table td:first-child{color:var(--mute);width:38%}
@media(max-width:820px){.detail{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}}
@media print{body *{visibility:hidden}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,getDoc,getDocs,updateDoc,deleteDoc,query,orderBy,limit,runTransaction,serverTimestamp,writeBatch,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

  ${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:""}
  <div class="grid">
   <div><label>Email</label><input id="a-email" type="email" autocomplete="email"></div>
   <div><label>Password</label><input id="a-pass" type="password" autocomplete="current-password"></div>
   <button class="btn" id="a-go">Sign in</button>
   <div class="row" style="justify-content:flex-end"><a href="javascript:void(0)" id="a-fp">Forgot password</a></div>
   <p class="mute small">There is no sign-up. Ask the store admin to create your account.</p>
  </div></div>`;
  $("#a-fp").onclick=async e=>{e.preventDefault();const em=$("#a-email").value.trim();if(!em)return toast("Enter your email first",1);try{await sendPasswordResetEmail(auth,em);toast("If that email has an account, a reset link is on its way")}catch(x){toast(emsg(x),1)}};
  const go=async()=>{
    const email=$("#a-email").value.trim(),pass=$("#a-pass").value;
    try{await signInWithEmailAndPassword(auth,email,pass)}
    catch(x){const c=x.code||"";authScreen(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?"Wrong email or password":c.replace("auth/","").replace(/-/g," ")||x.message)}
  };
  $("#a-go").onclick=go;$("#a-pass").onkeydown=e=>{if(e.key==="Enter")go()};
}

function setupScreen(){
  $("#root").innerHTML=`<div class="auth" style="max-width:560px"><h1>One-time setup needed</h1>
  <p>Add your Firebase project keys to <code>firebase-config.js</code>, then reload. Step-by-step instructions are in <b>README.md</b>.</p></div>`;

async function ensureProfile(u){
  const s=await getDoc(doc(db,"users",u.uid));
  return s.exists()?s.data():null;   // profiles are created only by an admin (or by hand for the very first admin)
}

function stopListeners(){S.unsub.forEach(f=>f());S.unsub=[]}

  stopListeners();
  const on=(q,fn)=>S.unsub.push(onSnapshot(q,fn,e=>console.warn(e)));
  on(doc(db,"settings","store"),s=>{if(s.exists())S.settings={...S.settings,...s.data()};render()});
  on(doc(db,"settings","taxonomy"),s=>{let t=DEFAULT_TAX;if(s.exists()){try{t=JSON.parse(s.data().json)}catch(e){}}TAXONOMY=t;reindex();render(true)});
  on(doc(db,"settings","lists"),s=>{S.lists={...DEFAULT_LISTS,...(s.exists()?s.data():{})};render(true)});

  on(doc(db,"settings","perms"),s=>{const d=s.exists()?s.data():{};
    S.perms={manager:{...DEFAULT_PERMS.manager,...(d.manager||{})},sales:{...DEFAULT_PERMS.sales,...(d.sales||{})}};render(true)});
  on(collection(db,"products"),s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"sales"),orderBy("createdAt","desc"),limit(500)),s=>{S.sales=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});

  on(collection(db,"salesReturns"),s=>{S.salesReturns=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"purchases"),orderBy("createdAt","desc"),limit(1000)),s=>{S.purchases=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"vendorPayments"),orderBy("createdAt","desc"),limit(1000)),s=>{S.vpays=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"bookings"),orderBy("createdAt","desc"),limit(500)),s=>{S.bookings=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"enquiries"),orderBy("createdAt","desc"),limit(500)),s=>{S.enquiries=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"payments"),orderBy("createdAt","desc"),limit(1000)),s=>{S.payments=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"requests"),orderBy("createdAt","desc"),limit(300)),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"movements"),orderBy("createdAt","desc"),limit(200)),s=>{S.moves=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  if(isAdmin())on(collection(db,"users"),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});

const NAV=[["dashboard","Dashboard","▦"],["products","Products","▤"],["sell","Sell","₹",true],["enquiries","Enquiries","💬",true],["bookings","Bookings","🔖",true],["customers","Customers","👤",true],["stock","Stock","⇅"],["sales","Sales","☰",true],["returns","Returns","↩",true],["categories","Categories","⌗"],["vendors","Vendors","🏭",false,false,"vendorsTab"],["approvals","Approvals","✓"],["team","Staff","👥",false,true],["settings","Settings","⚙"]];
const SALES_VIEWS=["sell","sales","bookings","customers","newbooking","booking","customer","sale","enquiries","newenquiry","enquiry"];
function navItems(){return NAV.filter(n=>(!n[3]||fullMode())&&(!n[4]||isAdmin())&&(!n[5]||can(n[5])))}
const DETAIL={product:"products",customer:"customers",booking:"bookings",vendor:"vendors",sale:"sales",purchase:"vendors",enquiry:"enquiries",return:"returns"};
/* ---------- Back, including the phone's own Back button ---------- */
/* Installed on a phone, the app is handed Android's Back as a history pop. Screens used to
   change without leaving a history entry behind, so the very first press popped straight past
   the app and closed it — mid-bill, taking the cart with it. Every move forward now leaves an
   entry carrying a snapshot of the screen, Back restores it, and only the first screen's Back
   closes the app, which is how every other app on the phone behaves. */
const SNAPIDS=["detailId","detailCust","detailBk","detailSale","detailPur","detailEnq","detailVendor","detailRet"];
const histSnap=()=>({view:S.view,shop:S.shop||null,nav:S.nav.slice(-20),
  ids:Object.fromEntries(SNAPIDS.map(k=>[k,S[k]]))});
let histN=0;
/* A move forward is a new entry, stamped with where it landed. */
const histPush=url=>{histN++;try{history.pushState({inv:1,n:histN,snap:null},"",url===undefined?location.href:url)}catch(e){}};
const histStamp=()=>{try{history.replaceState({inv:1,n:histN,snap:histSnap()},"",location.href)}catch(e){}};
const modalOpen=()=>{const m=$("#modal");return !!(m&&m.innerHTML.trim())};
function applySnap(s){
  if(!s)return render();
  S.view=s.view;S.shop=s.shop||null;S.sel=null;S.nav=Array.isArray(s.nav)?s.nav:[];
  SNAPIDS.forEach(k=>{if(s.ids)S[k]=s.ids[k]});
  window.scrollTo(0,0);render();
}
window.addEventListener("popstate",e=>{
  if(!S.profile)return;
  /* Back closes whatever is open on top first — a stock sheet, a payment box — and puts the
     entry it spent straight back, so the next press still reaches the previous screen. */
  if(modalOpen()){closeModal();try{history.pushState({inv:1,n:histN,snap:histSnap()},"",location.href)}catch(err){}return}
  const st=e.state;
  if(st&&st.inv){histN=st.n||0;applySnap(st.snap)}
  else{histN=0;routeFromHash();render()}
});
/* Opening a detail page goes through here, so the entry carries a snapshot and the hash never
   navigates on its own. Every in-app link is caught below rather than at each of its 20 sites. */
window.openHash=h=>{
  const hash="#"+String(h).replace(/^#/,"");
  if(hash===location.hash)return;
  S.nav.push({view:S.view,hash:location.hash});if(S.nav.length>20)S.nav.shift();
  histPush(location.pathname+location.search+hash);
  routeFromHash();histStamp();window.scrollTo(0,0);render();
};
/* On the bubble, so that a handler on the link itself still has the last word. A link that
   stops the event before it gets here navigates by hash as before, and the hashchange below
   stamps that entry just the same. */
document.addEventListener("click",e=>{
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  const a=e.target.closest?e.target.closest('a[href^="#"]'):null;
  if(!a||a.target==="_blank"||a.hasAttribute("download"))return;
  const href=a.getAttribute("href")||"";
  if(href==="#")return;                 // a bare # is a button, not a destination
  e.preventDefault();openHash(href.slice(1));
});
function setView(v){
  if(v!=="products"){S.sel=null;S.shop=null}
  const same=v===S.view&&!location.hash;
  S.nav=[];S.view=v;
  if(!same)histPush(DETAIL[v]?undefined:location.pathname+location.search);
  histStamp();window.scrollTo(0,0);render();
}
const navOn=k=>S.view===k||DETAIL[S.view]===k||(S.view==="newbooking"&&k==="bookings")||(S.view==="newenquiry"&&k==="enquiries");
function routeFromHash(){
  const m=location.hash.match(/^#(product|customer|booking|vendor|sale|purchase|enquiry|return)\/(.+)$/);
  if(m&&S.profile){
    const id=decodeURIComponent(m[2]);
    S.view=m[1];
    if(m[1]==="product")S.detailId=id;else if(m[1]==="customer")S.detailCust=id;else if(m[1]==="vendor")S.detailVendor=id;
    else if(m[1]==="sale")S.detailSale=id;else if(m[1]==="purchase")S.detailPur=id;else if(m[1]==="enquiry")S.detailEnq=id;else if(m[1]==="return")S.detailRet=id;else S.detailBk=id;
  }
  else if(DETAIL[S.view])S.view=DETAIL[S.view];
}
window.addEventListener("hashchange",e=>{
  if(history.state&&history.state.inv)return;   // one of our own entries: popstate handles it
  let was="";try{was=new URL(e.oldURL).hash}catch(err){}
  const top=S.nav[S.nav.length-1];
  if(!(top&&top.view===S.view&&top.hash===was)){S.nav.push({view:S.view,hash:was});if(S.nav.length>20)S.nav.shift()}
  routeFromHash();histN++;histStamp();render();
});
/* `fallback` is where to go when nothing was opened from anywhere — a pasted link, or the
   first screen after a reload. */
window.goBack=fallback=>{
  if(modalOpen()){closeModal();return}
  if(histN>0)return history.back();
  setView(fallback||"dashboard");
};
window.go=setView;
function render(soft){
  if(!S.profile||!activeRole(S.profile.role))return;
  if(!fullMode()&&SALES_VIEWS.includes(S.view))S.view="dashboard";
  if(S.view==="team"&&!isAdmin())S.view="dashboard";
  if(["vendors","vendor","purchase"].includes(S.view)&&!(can("manageVendors")||can("vendorLedger")))S.view="dashboard";
  // don't clobber inputs while typing during snapshot updates
  if(soft&&document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&$("main")?.contains(document.activeElement))return;
  const items=navItems();
  $("#root").innerHTML=`<div class="app">
   <nav class="side"><div class="logo">${esc(S.settings.storeName)}<small>${fullMode()?"Inventory + Sales":"Inventory"}</small></div>
    ${items.map(n=>`<button class="${navOn(n[0])?"on":""}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}${n[0]==="approvals"&&pendingReqs().length?` <span class="badge">${pendingReqs().length}</span>`:""}</button>`).join("")}
    <div class="sp"></div><div class="me">${esc(S.profile.name)} · ${esc(ROLE_LABEL[ROLE()]||S.profile.role)}<br><a href="#" style="color:#fff" onclick="doSignOut();return false">Sign out</a><br><span class="bld" title="Which version of the app this device is running">build ${esc(BUILD)}</span></div></nav>
   <main id="main"></main></div>
   <div class="bottom">${items.slice(0,4).map(n=>`<button class="${navOn(n[0])?"on":""}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join("")}${items.length>4?`<button class="${items.slice(4).some(n=>navOn(n[0]))?"on":""}" onclick="openMore()"><span>⋯</span>More</button>`:""}</div>`;
  const v={dashboard:vDash,products:vProducts,product:vProduct,sell:vSell,stock:vStock,sales:vSales,returns:vReturns,return:vReturn,categories:vCats,settings:vSettings,
    customers:vCustomers,customer:vCustomer,bookings:vBookings,booking:vBooking,newbooking:vNewBooking,team:vTeam,approvals:vApprovals,
    vendors:vVendors,vendor:vVendor,sale:vSale,purchase:vPurchase,
    enquiries:vEnquiries,newenquiry:vNewEnquiry,enquiry:vEnquiry}[S.view]||vDash;
  v($("#main"));
  hydrateImages();
}
/* A dashboard tile opens the screen behind its number, set up to show the same thing. */
/* A figure on a tile is a question — "which ones?" — so each tile opens the list behind it,
   already filtered to exactly the rows it counted. */
window.bookTo=(what)=>{S.bf={q:"",status:"booked",due:what==="due"};setView("bookings")};
window.enqTo=(what)=>{S.ef={q:"",status:what==="won"?"won":"open",due:what==="due"};setView("enquiries")};
window.custTo=(what)=>{S.cf={...S.cf,q:"",bal:what||""};setView("customers")};
window.vendTo=(what)=>{
  if(what==="pay"){S.vf={...S.vf,q:"",pay:true};return setView("vendors")}
  if(what==="low"){S.pf={...S.pf,q:"",cat:"",sub:"",type:"",dim:"",loc:"",vendor:"",stock:"lowout",limit:100};return setView("products")}
  S.pf={...S.pf,q:"",cat:"",sub:"",type:"",dim:"",loc:"",vendor:"",stock:"all",limit:100};setView("products");
};
/* Tiles whose detail is further down the same page just take you to it. */
window.scrollToCard=title=>{
  const c=[...document.querySelectorAll("#main .card h3")].find(h=>h.textContent.trim().startsWith(title));
  if(c)c.scrollIntoView({behavior:"smooth",block:"start"});
};
window.dashTo=what=>{
  if(what==="products"){S.pf={...S.pf,q:"",cat:"",sub:"",type:"",dim:"",loc:"",vendor:"",stock:"all",limit:100};return setView("products")}
  if(what==="out"){S.pf={...S.pf,q:"",cat:"",sub:"",type:"",dim:"",loc:"",vendor:"",stock:"out",limit:100};return setView("products")}
  if(what==="bookings"){S.bf={q:"",status:"booked"};return setView("bookings")}
  if(what==="enquiries"){S.ef={q:"",status:"open"};return setView("enquiries")}
  if(what==="today"){S.salesRange="day";S.salesDay=dkey();return setView("sales")}
  if(what==="month"){S.salesRange="month";S.salesMonth=dkey().slice(0,7);return setView("sales")}
};
window.doSignOut=()=>signOut(auth);
window.openMore=()=>{
  $("#modal").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:380px"><h3>Menu</h3>
  <div class="grid">${navItems().slice(4).map(n=>`<button class="btn sec" style="text-align:left" onclick="closeModal();go('${n[0]}')">${n[2]} &nbsp;${n[1]}</button>`).join("")}</div>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Close</button></div></div></div>`;
};

/* ---------- Dashboard ---------- */
function vDash(el){
  const P=S.products,tk=dkey();
  const units=P.reduce((a,p)=>a+(+p.qty||0),0),cost=P.reduce((a,p)=>a+(+p.qty||0)*num(p.cost),0),retail=P.reduce((a,p)=>a+(+p.qty||0)*num(p.price),0);
  const today=S.sales.filter(s=>s.dateKey===tk&&s.status!=="void");
  const mk=tk.slice(0,7),month=S.sales.filter(s=>String(s.dateKey||"").startsWith(mk)&&s.status!=="void");
  const openBk=S.bookings.filter(b=>b.status==="booked"),due=openBk.filter(b=>b.deliveryDate&&b.deliveryDate<=tk);
  const byCat={};P.forEach(p=>{const k=p.categoryName||"Uncategorised";byCat[k]=(byCat[k]||0)+(+p.qty||0)*(can("seeCost")?num(p.cost||p.price):1)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mx=cats[0]?.[1]||1;
  el.innerHTML=`<div class="top"><h2>Dashboard</h2><div class="row"><button class="btn" onclick="openProduct()">+ Add product</button>${fullMode()?`<button class="btn sec" onclick="go('sell')">New sale</button>`:""}</div></div>
  <div class="grid stats">
   <div class="card stat clk" onclick="dashTo('products')"><div class="k">Products</div><div class="v">${P.length}</div><div class="s">${units} units in stock</div></div>
   ${can("seeCost")?`<div class="card stat clk" onclick="dashTo('products')"><div class="k">Stock value (cost)</div><div class="v">${inr(cost)}</div></div>`:""}
   ${fullMode()?`<div class="card stat clk" onclick="dashTo('bookings')"><div class="k">Open bookings</div><div class="v">${openBk.length}</div><div class="s">${inr(openBk.reduce((a,b)=>a+num(b.advance),0))} advance held${due.length?` · ${due.length} due`:""}</div></div>`:""}
  ${fullMode()?`<div class="card stat clk" onclick="dashTo('enquiries')"><div class="k">Open enquiries</div><div class="v">${S.enquiries.filter(e=>e.status==="open").length}</div><div class="s">${S.enquiries.filter(e=>e.status==="open"&&e.followUp&&e.followUp<=tk).length} to follow up</div></div>`:""}
  ${fullMode()?`<div class="card stat clk" onclick="dashTo('today')"><div class="k">Today's sales</div><div class="v">${inr(today.reduce((a,s)=>a+s.total,0))}</div><div class="s">${today.length} bill${today.length===1?"":"s"}</div></div>`:""}
  ${fullMode()?`<div class="card stat clk" onclick="dashTo('month')"><div class="k">This month's sales</div><div class="v">${inr(month.reduce((a,s)=>a+s.total,0))}</div><div class="s">${month.length} bill${month.length===1?"":"s"} since ${esc(mk)}-01</div></div>`:""}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px">
   <div class="card"><h3 style="margin-bottom:10px">${can("seeCost")?"Stock value by category":"Units in stock by category"}</h3>
    ${cats.map(([k,v])=>`<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><span class="mute small">${can("seeCost")?inr(v):v+" units"}</span></div><div class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join("")||`<p class="mute">Add products to see this.</p>`}</div>
   ${fullMode()&&openBk.length?`<div class="card"><h3 style="margin-bottom:10px">Upcoming deliveries</h3>
    ${openBk.slice().sort((a,b)=>String(a.deliveryDate||"9999").localeCompare(String(b.deliveryDate||"9999"))).slice(0,8).map(b=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span><a href="#booking/${b.id}">${esc(b.bookingNo)}</a> ${esc(b.customerName||"")}<br><span class="small mute">${b.items.length} item(s) · balance ${inr(num(b.total)-num(b.advance))}</span></span><span class="tag ${b.deliveryDate&&b.deliveryDate<=tk?"out":"ok"}">${esc(b.deliveryDate||"no date")}</span></div>`).join("")}</div>`:""}
   <div class="card"><h3 style="margin-bottom:10px">Recent stock activity</h3>
    ${S.moves.slice(0,8).map(m=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${plink(m.productId,m.productName)}<br><span class="small mute">${esc(m.type)} · ${esc(m.byName||"")} · ${fdt(tms(m.createdAt))}</span></span><b style="color:${m.delta>=0?"var(--ok)":"var(--bad)"}">${m.delta>0?"+":""}${m.delta}</b></div>`).join("")||`<p class="mute">No activity yet.</p>`}</div>
  </div>`;

/* ---------- Products ---------- */
function filteredProducts(){
  const f=S.pf,q=dimNorm(f.q).toLowerCase();
  let L=S.products.filter(p=>{
    if(q&&!(dimNorm(`${p.name} ${p.sku} ${p.barcode||""} ${vendQ(p)} ${locKeys(p).join(" ")} ${dimText(p)}`).toLowerCase().includes(q)))return false;
    if(f.loc&&!locKeys(p).some(k=>k.toLowerCase()===f.loc.toLowerCase()))return false;
    if(f.vendor&&norm(vend(p))!==norm(f.vendor))return false;
    if(f.dim&&dimText(p).toLowerCase()!==dimNorm(f.dim).toLowerCase())return false;
    if(f.cat&&p.categoryId!==f.cat)return false;if(f.sub&&p.subcategoryId!==f.sub)return false;if(f.type&&p.typeId!==f.type)return false;
    if(f.stock==="low"&&!lowStock(p))return false;if(f.stock==="out"&&!outStock(p))return false;if(f.stock==="in"&&outStock(p))return false;
    if(f.stock==="lowout"&&!(lowStock(p)||outStock(p)))return false;
    return true});
  const s={name:(a,b)=>a.name.localeCompare(b.name),qty:(a,b)=>a.qty-b.qty,price:(a,b)=>b.price-a.price,new:(a,b)=>tms(b.createdAt)-tms(a.createdAt)}[f.sort];
  return L.sort(s);
}

   label printer, whose head has no grey and no colour — every dot is black or white — so the app

function logoVersions(img,thr){
  const sw=img.naturalWidth||img.width||300,sh=img.naturalHeight||img.height||150;
  const k0=Math.min(1,600/Math.max(sw,sh)),aw=Math.max(1,Math.round(sw*k0)),ah=Math.max(1,Math.round(sh*k0));
  const a=document.createElement("canvas");a.width=aw;a.height=ah;
  const ax=a.getContext("2d",{willReadFrequently:true});ax.fillStyle="#fff";ax.fillRect(0,0,aw,ah);ax.drawImage(img,0,0,aw,ah);
  const px=ax.getImageData(0,0,aw,ah).data;let x0=aw,y0=ah,x1=-1,y1=-1;
  for(let y=0;y<ah;y++)for(let x=0;x<aw;x++){const i=(y*aw+x)*4;
    if(.299*px[i]+.587*px[i+1]+.114*px[i+2]<235){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)throw new Error("That image looks blank — is the logo white on a clear background?");
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.02);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(aw-1,x1+pad);y1=Math.min(ah-1,y1+pad);
  const sx=x0/k0,sy=y0/k0,sW=(x1-x0+1)/k0,sH=(y1-y0+1)/k0;
  let color="",cw=0,ch=0;
  for(const lim of [480,360,240]){                     // keep the record comfortably under Firestore's 1 MB
    const kc=Math.min(1,lim/sW,lim/2/sH),c=document.createElement("canvas");
    c.width=cw=Math.max(1,Math.round(sW*kc));c.height=ch=Math.max(1,Math.round(sH*kc));
    c.getContext("2d").drawImage(img,sx,sy,sW,sH,0,0,c.width,c.height);
    color=c.toDataURL("image/png");if(color.length<600000)break;
  }
  // The largest logo corner is 16 × 8 mm — 128 × 64 dots at 203 dpi; twice that keeps edges clean.
  const km=Math.min(256/sW,128/sH),m=document.createElement("canvas");
  m.width=Math.max(1,Math.round(sW*km));m.height=Math.max(1,Math.round(sH*km));

  mx.putImageData(d,0,0);
  return {color,mono:m.toDataURL("image/png"),w:cw,h:ch};
}

async function saveProduct(id){
  const v=i=>$(i).value.trim();
  const name=v("#p-name"),sku=v("#p-sku"),cid=v("#p-cat");
  if(!name||!sku||!cid)return toast("Name, SKU and category are required",1);
  if(S.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==id))return toast("SKU already exists",1);
  if(v("#p-price")==="")return toast("Selling price is required",1);
  const old=S.products.find(x=>x.id===id)||{};
  const cat=TAXONOMY.find(c=>c.id===cid),sub=cat.subcategories.find(s=>s.id===v("#p-sub")),type=sub?.subcategories.find(t=>t.id===v("#p-type"));
  const imageUrl=v("#p-imgurl");
  const photos=IMGSTATE.photos,touched=IMGSTATE.dirty;
  const hasImage=touched?photos.length>0:!!old.hasImage;
  const nPhotos=touched?photos.length:photoCount(old);
  if(touched&&photos.length>1){
    const bytes=photos.slice(1).reduce((a,s)=>a+s.length*3/4,0);
    if(bytes>GAL_BYTES)return toast("Those photos are too large together — remove one and save again",1);
  }
  const barcode=v("#p-bar")||old.barcode||"";
  if(barcode&&S.products.some(x=>x.barcode===barcode&&x.id!==id))return toast("That barcode is already used by another product",1);
  const vname=v("#p-vendor"),vrec=S.vendors.find(x=>norm(x.name)===norm(vname));
  const brec=S.brands.find(b=>b.id===v("#p-brand"));
  const d={name,sku,barcode,vendor:vname,vendorId:vrec?.id||"",brandId:brec?.id||"",brandName:brec?.name||"",
    categoryId:cat.id,categoryName:cat.name,categorySlug:cat.slug,
    subcategoryId:sub?.id||"",subcategoryName:sub?.name||"",subcategorySlug:sub?.slug||"",
    typeId:type?.id||"",typeName:type?.name||"",typeSlug:type?.slug||"",
    fullSlug:(type||sub||cat).slug,imageUrl,hasImage,photoCount:nPhotos,
    mrp:num(v("#p-mrp"))||num(v("#p-price")),price:num(v("#p-price")),cost:num(v("#p-cost")),gst:num(v("#p-gst")),
    dimension:dimNorm(v("#p-dim")),dimUnit:dimNorm(v("#p-dim"))?v("#p-dimunit"):"",
    reorder:$("#p-re")?num(v("#p-re")):num(old.reorder),unit:v("#p-unit"),location:v("#p-loc"),description:v("#p-desc"),active:true,
    updatedAt:serverTimestamp(),updatedBy:S.user.uid};
  let r;
  try{
    const b=writeBatch(db);
    r=id?doc(db,"products",id):doc(collection(db,"products"));
    if(id)b.update(r,d);
    else{const q=Math.max(0,Math.floor(num(v("#p-qty"))));
      b.set(r,{...d,qty:q,booked:0,locQty:q?{[d.location||UNLOC]:q}:{},createdAt:serverTimestamp()});
      if(q>0)b.set(doc(collection(db,"movements")),mv(r.id,name,sku,"opening",q,0,q,"Opening stock"))}
    if(touched){
      if(photos.length){
        b.set(doc(db,"productImages",r.id),{data:photos[0],updatedAt:serverTimestamp()});
        IMG.cache.set(r.id,photos[0]);
        const extra=photos.slice(1);
        if(extra.length)b.set(doc(db,"productGallery",r.id),{photos:extra,updatedAt:serverTimestamp()});
        else if(photoCount(old)>1)b.delete(doc(db,"productGallery",r.id));
        IMG.gal.set(r.id,extra);
      }else{
        if(old.hasImage)b.delete(doc(db,"productImages",r.id));
        if(photoCount(old)>1)b.delete(doc(db,"productGallery",r.id));
        IMG.cache.delete(r.id);IMG.gal.set(r.id,[]);
      }
    }
    await b.commit();
    if(BARHOLD&&barcode===BARHOLD)BARHOLD=null;
    closeModal();toast("Saved");
    const back=window.__afterProduct;window.__afterProduct=null;if(back)back(r.id);
  }catch(e){toast(emsg(e),1)}
}

window.openStock=function(id,only){
  if(!isManager())return toast("You don't have permission to change stock",1);
  const p=S.products.find(x=>x.id===id);if(!p)return;
  const TABS=[["in","Stock in","stockIn"],["transfer","Transfer","transfer"],["out","Stock out","stockOut"],["set","Set count","setCount"]]
    .filter(t=>can(t[2])).filter(t=>!only||t[0]===only);
  if(!TABS.length)return toast("You don't have permission to change stock",1);
  const R={in:["Purchase / received","Customer return","Found / correction"],out:["Damaged","Lost / missing","Supplier return","Sold (offline)"],
    set:["Stock count / audit"],transfer:["Moved to another rack","Sent to godown","Brought to floor","Sent for delivery"]};
  const locList=()=>[...new Set([...allLocations(),...Object.keys(locMapOf(p))])].filter(Boolean).sort(natcmp);
  const opts=(sel,list)=>list.map(x=>`<option ${String(sel)===String(x)?"selected":""}>${esc(x)}</option>`).join("");
  const here=k=>+locMapOf(p)[k]||0;
  let mode=TABS[0][0];
  const first=primaryLoc(locMapOf(p))||p.location||locList()[0]||UNLOC;
  // Stock in can land in several places at once — one row per place.
  let rows=[{loc:first,qty:""}];
  // A count opens with a row for every place the product actually sits.
  let crows=(locEntries(p).map(([k])=>({loc:k,qty:""})));
  if(!crows.length)crows=[{loc:first,qty:""}];
  const rowsFor=()=>mode==="set"?crows:rows;
  let K={qty:"",to:first,from:(locEntries(p)[0]||[])[0]||first,reason:"",note:""};
  const readRows=()=>{const R=rowsFor();document.querySelectorAll("#s-rows tr[data-ix]").forEach(tr=>{
    R[+tr.dataset.ix]={loc:tr.querySelector("select").value,qty:tr.querySelector("input").value}})};
  /* The places actually counted, duplicate rows for one place added together. */
  const countsNow=()=>{const out=[],at={};
    crows.forEach(r=>{if(String(r.qty).trim()==="")return;
      const q=Math.floor(num(r.qty));
      if(at[r.loc]!==undefined)out[at[r.loc]].qty+=q;else{at[r.loc]=out.length;out.push({loc:r.loc,qty:q})}});
    return out};
  const read=()=>{
    if((mode==="in"||mode==="set")&&$("#s-rows"))readRows();
    if($("#s-qty"))K.qty=$("#s-qty").value;
    if($("#s-to"))K.to=$("#s-to").value;
    if($("#s-from"))K.from=$("#s-from").value;
    if($("#s-reason"))K.reason=$("#s-reason").value;
    if($("#s-note"))K.note=$("#s-note").value;
  };
  const addedTotal=()=>rows.reduce((a,r)=>a+Math.max(0,Math.floor(num(r.qty))),0);
  const body=()=>{

      <div><label>Move to</label><select id="s-to">${opts(K.to,withCur(L,K.to))}</select></div>
      <div><label>Quantity to move</label><input id="s-qty" type="number" min="0" step="1" value="${esc(K.qty)}" autofocus></div></div>`}
    return `<div class="f">
      <div><label>Take out of</label><select id="s-to">${opts(K.to,withCur(L,K.to))}</select></div>
      <div><label>Quantity removed</label><input id="s-qty" type="number" min="0" step="1" value="${esc(K.qty)}" autofocus></div></div>`;
  };
  const hintText=()=>{
    const q=Math.floor(num($("#s-qty")?.value)),to=$("#s-to")?$("#s-to").value:"",from=$("#s-from")?$("#s-from").value:"";
    if(mode==="in"){const t=addedTotal();
      return t?`Adds ${esc(qtyText(t,p.unit))} — the total becomes <b>${esc(qtyText((+p.qty||0)+t,p.unit))}</b>.`
        :"Adds to the total and to the places you choose.";}
    if(mode==="set"){
      const cs=countsNow(),blank=crows.length-cs.length;
      const skipped=`${blank?` ${blank} ${blank===1?"box is":"boxes are"} empty, so stock there is left alone.`:""}`;
      if(!cs.length)return `Enter what you counted at each place. Leave a box empty and that place is left exactly as it is.`;
      let up=0,dn=0,same=0;
      cs.forEach(x=>{const d=x.qty-here(x.loc);if(d>0)up+=d;else if(d<0)dn-=d;else same++});
      const map={...locMapOf(p)};cs.forEach(x=>{map[x.loc]=x.qty});
      const total=Object.values(map).reduce((a,v)=>a+(+v||0),0);
      if(!up&&!dn)return `Everything you counted matches — nothing to change.${skipped}`;
      return `Total becomes <b>${esc(qtyText(total,p.unit))}</b> (now ${esc(qtyText(+p.qty||0,p.unit))}).`
        +`${up?` <b style="color:var(--ok)">${up} added</b>`:""}${up&&dn?" ·":""}${dn?` <b style="color:var(--bad)">${dn} written off</b>`:""}`
        +`${same?` · ${same} matched`:""}.${skipped}`;}
    if(mode==="transfer")return from===to?`<span style="color:var(--warn)">Pick two different places to move between.</span>`
      :`Moves ${q>0?esc(qtyText(q,p.unit)):"pieces"} from ${esc(from)} to ${esc(to)}. The total does not change.`;

  };
  const draw=()=>{
    $("#s-body").innerHTML=`${body()}
     <div class="f" style="margin-top:8px"><div><label>Reason</label><select id="s-reason">${opts(K.reason,R[mode])}</select></div>

      if(mode==="set")document.querySelectorAll("#s-rows tr[data-ix] select").forEach(s=>s.onchange=()=>{

  window.stRow=(op,ix)=>{
    readRows();
    const R=rowsFor();
    if(op==="add"){const used=R.map(r=>r.loc);const next=locList().find(x=>!used.includes(x))||locList()[0]||UNLOC;R.push({loc:next,qty:""})}
    else R.splice(ix,1);
    if(!R.length)R.push({loc:first,qty:""});

  };
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:520px"><h3>${esc(p.name)}</h3>
  <p class="mute">${esc(p.sku)} · Total stock: <b>${esc(qtyText(p.qty,p.unit))}</b>${bk(p)?` · <span style="color:var(--warn)">${bk(p)} booked, ${avail(p)} free</span>`:""}</p>
  ${locEntries(p).length?`<p class="small">Where it is: ${locEntries(p).map(([k,v])=>`<span class="tag">${esc(k)}: ${v}</span>`).join(" ")}</p>`:""}

  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="s-save">Save</button></div></div></div>`;
  document.querySelectorAll("#s-tabs button").forEach(b=>b.onclick=()=>{read();mode=b.dataset.t;K.reason="";draw()});
  draw();
  $("#s-save").onclick=async()=>{
    read();
    const reason=K.reason,note=K.note.trim(),tail=reason+(note?" — "+note:"");
    const q=Math.floor(num(K.qty)),to=K.to,from=K.from;
    let put=[],counts=[];
    if(mode==="set"){
      counts=countsNow();
      if(!counts.length)return toast("Enter what you counted at at least one place",1);
      if(counts.some(x=>!(x.qty>=0)))return toast("A counted quantity cannot be negative",1);
    }
    else if(mode==="in"){
      put=rows.map(r=>({loc:r.loc,qty:Math.floor(num(r.qty))})).filter(r=>r.qty>0);
      if(!put.length)return toast("Enter how many pieces came in",1);
      const seen={};put=put.filter(r=>{if(seen[r.loc]){seen[r.loc].qty+=r.qty;return false}seen[r.loc]=r;return true});
    }
    if(mode!=="set"&&mode!=="in"&&(K.qty===""||q<0))return toast("Enter a valid quantity",1);
    if(mode!=="set"&&mode!=="in"&&q<=0)return toast("Enter how many pieces",1);
    if(mode==="transfer"&&from===to)return toast("Pick two different places",1);
    const btn=$("#s-save");btn.disabled=true;btn.textContent="Saving…";
    try{
      await runTransaction(db,async tx=>{
        const r=doc(db,"products",id),s=await tx.get(r);
        if(!s.exists())throw new Error("That product no longer exists");
        const d=s.data(),cur=+d.qty||0;let map=locMapOf(d),after=cur;
        const logs=[];
        if(mode==="in"){
          let run=cur;
          put.forEach(x=>{map=addTo(map,x.loc,x.qty);logs.push({type:"in",delta:x.qty,before:run,after:run+x.qty,note:tail,toLoc:x.loc,fromLoc:""});run+=x.qty});
          after=run;
        }
        else if(mode==="out"){
          after=cur-q;
          if(after<0&&!S.settings.allowNegative)throw new Error("Not enough stock (only "+cur+")");
          const have=+map[to]||0;
          if(q>have&&!S.settings.allowNegative)throw new Error(`Only ${have} at ${to}`);
          map={...map,[to]:have-q};
          logs.push({type:"out",delta:-q,before:cur,after,note:tail,toLoc:to,fromLoc:""});
        }
        else if(mode==="set"){
          // only the places with a number typed in are counted; the rest are left exactly as they were
          let run=cur;
          counts.forEach(x=>{
            const have=+map[x.loc]||0;
            if(have===x.qty)return;
            map={...map,[x.loc]:x.qty};
            const nx=run+(x.qty-have);
            logs.push({type:"adjust",delta:x.qty-have,before:run,after:nx,
              note:`Counted ${x.qty} at ${x.loc} (app had ${have})`+(tail?" · "+tail:""),toLoc:x.loc,fromLoc:""});
            run=nx;});
          after=Object.values(map).reduce((a,v)=>a+(+v||0),0);
        }
        else{
          const have=+map[from]||0;
          if(q>have&&!S.settings.allowNegative)throw new Error(`Only ${have} at ${from}`);
          map=addTo({...map,[from]:have-q},to,q);
          after=cur;
          logs.push({type:"transfer",delta:0,before:cur,after,note:`${from} → ${to}`+(reason?" · "+reason:"")+(note?" — "+note:""),toLoc:to,fromLoc:from});
        }
        Object.keys(map).forEach(k=>{if(!map[k])delete map[k]});
        tx.update(r,{qty:after,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        logs.forEach(l=>tx.set(doc(collection(db,"movements")),
          {...mv(id,p.name,p.sku,l.type,l.delta,l.before,l.after,l.note),fromLoc:l.fromLoc,toLoc:l.toLoc}));
      });
      closeModal();
      toast(mode==="transfer"?`Moved ${q} to ${to}`
        :mode==="in"?`Added ${qtyText(put.reduce((a,x)=>a+x.qty,0),p.unit)}${put.length>1?` across ${put.length} places`:` to ${put[0].loc}`}`
        :mode==="set"?(counts.some(x=>(+locMapOf(p)[x.loc]||0)!==x.qty)
            ?`Count set at ${counts.length} ${counts.length===1?"place":"places"}`
            :"Count matches — nothing changed")
        :"Stock updated");
    }catch(e){toast(emsg(e),1);btn.disabled=false;btn.textContent="Save"}
  };
};

async function completeSale(){

    readPayRows("c-pays",S.pays);

    received=r2(receipts.reduce((a,r)=>a+r.amount,0));
    if(received>t.total){btn.disabled=false;btn.textContent="Complete sale";
      return toast(`That is ${inr(r2(received-t.total))} more than the bill`,1)}
    pay=receipts.length?payLine(receipts):"Nothing received";
  }else{
    pay=$("#c-pay").value;

  }
  const cart=onLines(S.cart).map(i=>({...i}));
  if(!cart.length){btn.disabled=false;btn.textContent="Complete sale";return toast("Tick at least one item to bill",1)}
  let dated;
  try{dated=datedAs($("#c-date")?$("#c-date").value:"")}
  catch(e){btn.disabled=false;btn.textContent="Complete sale";return toast(e.message,1)}
  try{
    let inv="",saleId="",customerId="";
    {
      const ex=findCustByPhone(cust.phone);

    }

      // Free stock, not total stock: pieces reserved against a booking belong to that customer.
      // Checking qty alone let a bill that was in the cart before the booking was taken sell the

      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(cart[ix].name+" no longer exists");
        const d=s.data(),free=(+d.qty||0)-Math.max(0,+d.booked||0);

      const n=(cs.exists()?cs.data().n:0)+1;inv=(S.settings.invoicePrefix||"INV")+"-"+String(n).padStart(5,"0");
      tx.set(cr,{n});
      const sr=doc(collection(db,"sales"));saleId=sr.id;
      snaps.forEach((s,ix)=>{const c=cart[ix],cur=s.data().qty,t=takeAt(locMapOf(s.data()),c.qty,c.loc);
        tx.update(refs[ix],{qty:cur-c.qty,locQty:t.map,location:primaryLoc(t.map)||s.data().location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(c.pid,c.name,c.sku,"sale",-c.qty,cur,cur-c.qty,inv+" · from "+t.used.map(u=>`${u[0]} (${u[1]})`).join(", ")),fromLoc:t.used.map(u=>u[0]).join(", "),toLoc:""})});
      tx.set(sr,{invoiceNo:inv,...(S.fromEnq?{enquiryId:S.fromEnq}:{}),items:cart.map(savedLine),
        subtotal:t.gross,itemDiscount:t.itemDisc,discount:t.disc,total:t.total,gstAmount:t.gst,taxable:t.taxable,customer:cust,customerId,
        payment:pay,receipts,received,balanceLeft:Math.max(0,r2(t.total-received)),status:"completed",
        soldBy:S.user.uid,soldByName:S.profile.name,...dated});
    });
    await closeEnquiryAsWon(inv);
    S.cart=[];S.cartDiscount=0;S.cust=null;S.posQ="";S.saleOn="";S.pays=null;
    toast(r2(t.total-received)>0?`Sale ${inv} saved · ${inr(r2(t.total-received))} pending`:"Sale "+inv+" saved");render();
    printReceipt({invoiceNo:inv,items:cart.map(savedLine),subtotal:t.gross,itemDiscount:t.itemDisc,discount:t.disc,total:t.total,gstAmount:t.gst,customer:cust,payment:pay,receipts,received,balanceLeft:Math.max(0,r2(t.total-received)),soldByName:S.profile.name,createdAt:{seconds:Date.now()/1000}});

async function saveSalesReturn(){
  const R=S.srx,s=S.sales.find(x=>x.id===R.sid),btn=$("#sr-go");if(!s)return;
  R.why=$("#sr-why").value.trim();R.mode=$("#sr-mode").value;
  const pick=R.lines.filter(l=>l.n>0);
  if(!pick.length)return toast("Choose what is coming back",1);
  if(!R.why)return toast("Say why the goods came back — it goes on the voucher",1);
  const items=pick.map(l=>({pid:l.i.pid,sku:l.i.sku,name:l.i.name,qty:l.n,price:num(l.i.price),gst:num(l.i.gst),unitValue:l.unit,value:srLineVal(l),line:l.ix}));
  const value=r2(items.reduce((a,i)=>a+i.value,0));
  const gst=r2(items.reduce((a,i)=>a+i.value-i.value/(1+num(i.gst)/100),0));
  const refund=r2(Math.min(value,Math.max(0,num(R.refund))));
  const want={};items.forEach(i=>want[i.pid]=(want[i.pid]||0)+i.qty);
  const pids=Object.keys(want);
  btn.disabled=true;btn.textContent="Saving…";
  let no="",rid="";
  try{
    await runTransaction(db,async tx=>{
      const sr=doc(db,"sales",s.id),sd=await tx.get(sr);
      if(!sd.exists()||sd.data().status!=="completed")throw new Error("This bill has just been voided or changed — open it again");
      const sold=qtyByPid(sd.data().items),back={...(sd.data().returned||{})};
      for(const pid of pids)if((back[pid]||0)+want[pid]>(sold[pid]||0)){
        const nm=items.find(i=>i.pid===pid).name;
        throw new Error(`Only ${Math.max(0,(sold[pid]||0)-(back[pid]||0))} of ${nm} left to take back on this bill`)}
      const cr=doc(db,"counters","salesReturn"),cs=await tx.get(cr);
      const refs=pids.map(pid=>doc(db,"products",pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      const n=(cs.exists()?cs.data().n:0)+1;no="SR-"+String(n).padStart(5,"0");tx.set(cr,{n});
      snaps.forEach((p,ix)=>{if(!p.exists())return;const pid=pids[ix],k=want[pid],d=p.data(),cur=+d.qty||0;
        const map=addTo(locMapOf(d),SR_LOC,k);
        tx.update(refs[ix],{qty:cur+k,locQty:map,location:d.location&&map[d.location]>0?d.location:primaryLoc(map),updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(pid,d.name,d.sku,"return",k,cur,cur+k,`Sales return ${no} · ${s.invoiceNo} · ${R.why}`),toLoc:SR_LOC});
        back[pid]=(back[pid]||0)+k});
      tx.update(sr,{returned:back,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      const vr=doc(collection(db,"salesReturns"));rid=vr.id;
      tx.set(vr,{returnNo:no,status:"active",saleId:s.id,invoiceNo:s.invoiceNo,saleDate:s.dateKey||"",
        bookingId:s.bookingId||"",bookingNo:s.bookingNo||"",customerId:s.customerId||"",customer:{name:s.customer?.name||"",phone:s.customer?.phone||""},
        items,value,gstAmount:gst,refundAmount:refund,refundMode:refund?R.mode:"",reason:R.why,location:SR_LOC,
        dateKey:dkey(),createdAt:serverTimestamp(),createdBy:S.user.uid,createdByName:S.profile.name});
    });
    closeModal();toast(`Return ${no} saved — goods are at ${SR_LOC}`);
    openHash("return/"+rid);
  }catch(e){toast(emsg(e),1);btn.disabled=false;btn.textContent=`Take back · ${inr(value)}`}
}
/* An admin can cancel a voucher made by mistake. The pieces come out of stock again — out of
   Sales Return first — and the bill is as it was. */
window.cancelReturn=async id=>{
  if(!isAdmin())return toast("Only an admin can cancel a return voucher",1);
  const r=S.salesReturns.find(x=>x.id===id);if(!r||r.status==="cancelled")return;
  const why=(prompt(`Cancel ${r.returnNo}? The ${r.items.reduce((a,i)=>a+i.qty,0)} piece(s) come out of stock again and ${r.invoiceNo} goes back to how it was.\n\nReason:`)||"").trim();
  if(!why)return;
  const want={};r.items.forEach(i=>want[i.pid]=(want[i.pid]||0)+num(i.qty));const pids=Object.keys(want);
  try{
    await runTransaction(db,async tx=>{
      const vr=doc(db,"salesReturns",id),vs=await tx.get(vr);
      if(!vs.exists()||vs.data().status==="cancelled")throw new Error("Already cancelled");
      const sr=doc(db,"sales",r.saleId),sd=await tx.get(sr);
      const refs=pids.map(pid=>doc(db,"products",pid)),snaps=[];for(const x of refs)snaps.push(await tx.get(x));
      snaps.forEach((p,ix)=>{if(!p.exists())return;const pid=pids[ix],k=want[pid],d=p.data(),cur=+d.qty||0,free=cur-Math.max(0,+d.booked||0);
        if(free<k&&!S.settings.allowNegative)throw new Error(`Only ${Math.max(0,free)} of ${d.name} still in stock — the returned pieces have been sold again`);
        const map=takeAt(locMapOf(d),k,SR_LOC).map;
        tx.update(refs[ix],{qty:cur-k,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(pid,d.name,d.sku,"return cancelled",-k,cur,cur-k,`${r.returnNo} cancelled · ${why}`),fromLoc:SR_LOC})});
      if(sd.exists()){const back={...(sd.data().returned||{})};pids.forEach(pid=>{back[pid]=Math.max(0,(back[pid]||0)-want[pid]);if(!back[pid])delete back[pid]});
        tx.update(sr,{returned:back,updatedAt:serverTimestamp(),updatedBy:S.user.uid})}
      tx.update(vr,{status:"cancelled",cancelledAt:serverTimestamp(),cancelledBy:S.profile.name,cancelReason:why});
    });
    toast(`${r.returnNo} cancelled`);
  }catch(e){toast(emsg(e),1)}
};

window.voidSale=async id=>{
  if(!can("voidSale"))return toast("You don't have permission to void a bill",1);
  const s=S.sales.find(x=>x.id===id);if(!s)return;
  if(srOf(id).length)return toast(`Some goods on this bill already came back (${srOf(id).map(r=>r.returnNo).join(", ")}). Take the rest back as a sales return, or cancel those vouchers before voiding.`,1);
  const bk0=s.bookingId?S.bookings.find(b=>b.id===s.bookingId):null;
  if(s.bookingId&&!isAdmin())return toast("Only an admin can void a bill made from a booking — use Request instead",1);
  const coll=bk0?r2(num(bk0.collectedOnDelivery)):0;
  const msg=bk0&&bk0.status==="delivered"&&bk0.saleId===id
    ?`Void ${s.invoiceNo}?\n\nThe goods go back into stock at ${SR_LOC}, reserved again for booking ${bk0.bookingNo}, and the booking reopens — so you can change it, deliver it again, or cancel it.`
      +(coll?`\n\nThe ${inr(coll).replace("₹","Rs ")} collected on delivery stays recorded as a payment against the booking.`:"")
    :`Void ${s.invoiceNo}?\n\nEverything on it goes back into stock at ${SR_LOC}.`;
  if(!confirm(msg))return;
  try{const re=await doVoidSale(id);toast(re?`Sale voided — booking ${re} is open again`:"Sale voided");render()}catch(e){toast(emsg(e),1)}
};
/* Quantities per product, however many lines a product appears on. */
const qtyByPid=items=>{const m={};(items||[]).forEach(i=>{m[i.pid]=(m[i.pid]||0)+Math.floor(num(i.qty))});return m};
/* The writes that turn a delivered booking back into an open one, inside the caller's
   transaction. What was collected at the door was really received, so it stays — as a payment
   against the booking, dated the day of the delivery — and the ledger still counts it. */
/* Money taken at the door was really received, so when its bill is voided it stays — as a
   payment against the booking, dated the day of the delivery. */
function keepDeliveryMoney(tx,br,bd,sale){
  const collected=r2(num(bd.collectedOnDelivery)),inv=sale?.invoiceNo||bd.invoiceNo||"";
  if(collected>0){
    const rc=sale?saleReceipts(sale):[];
    tx.set(doc(collection(db,"payments")),{customerId:bd.customerId||"",customerName:bd.customerName||"",customerPhone:bd.customerPhone||"",
      bookingId:br.id,bookingNo:bd.bookingNo||"",amount:collected,
      date:sale?(sale.dateKey||dkey(new Date(tms(sale.createdAt)))):dkey(),
      mode:(rc.length===1?rc[0].mode:rc.length?payLine(rc):sale?.payment)||"Collected on delivery",
      note:`Collected on delivery with ${inv}, since voided`,
      createdBy:S.user.uid,createdByName:S.profile.name,createdAt:serverTimestamp()});
  }
  return collected;
}
/* Cancels a booking stuck on a voided bill. Its stock is already back, so nothing on the shelf
   moves; the booking is closed and everything received is settled the way the admin chose. */
async function doCancelStuck(id,st){
  const b=S.bookings.find(x=>x.id===id);if(!b)throw new Error("That booking no longer exists");
  const sale=S.sales.find(x=>x.id===b.saleId)||null;
  await runTransaction(db,async tx=>{
    const br=doc(db,"bookings",id),bs=await tx.get(br);
    if(!bs.exists()||bs.data().status!=="delivered")throw new Error("This booking is no longer marked delivered");
    const bd=bs.data();
    if(bd.saleId){const ss=await tx.get(doc(db,"sales",bd.saleId));if(ss.exists()&&ss.data().status!=="void")throw new Error("Its invoice is live again");}
    const collected=keepDeliveryMoney(tx,br,bd,sale),inv=sale?.invoiceNo||bd.invoiceNo||"";
    tx.update(br,{status:"cancelled",cancelledAt:serverTimestamp(),cancelledBy:S.profile.name,
      settleMode:st.mode||"credit",settleAmount:r2(num(st.amount)),settleNote:st.note||"",
      collectedOnDelivery:0,saleId:"",invoiceNo:"",
      voidedInvoices:[...(bd.voidedInvoices||[]),{invoiceNo:inv,saleId:bd.saleId||"",collected,t:Date.now(),by:S.profile.name}],
      editLog:[...(bd.editLog||[]),{t:Date.now(),by:S.profile.name,
        what:`Invoice ${inv} voided — booking cancelled; ${inr(num(st.amount))} received ${SETTLE_LABEL[st.mode||"credit"]||""}`,why:st.note||""}],
      updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  });
}
function reopenWrites(tx,br,bd,sale){
  const collected=r2(num(bd.collectedOnDelivery)),inv=sale?.invoiceNo||bd.invoiceNo||"";
  tx.update(br,{status:"booked",saleId:"",invoiceNo:"",collectedOnDelivery:0,deliveredAt:null,deliveredBy:"",
    reopenedAt:serverTimestamp(),reopenedBy:S.profile.name,
    voidedInvoices:[...(bd.voidedInvoices||[]),{invoiceNo:inv,saleId:bd.saleId||"",collected,t:Date.now(),by:S.profile.name}],
    editLog:[...(bd.editLog||[]),{t:Date.now(),by:S.profile.name,
      what:`Invoice ${inv} voided — booking reopened`+(collected?`; ${inr(collected)} collected on delivery kept as a payment`:"")}],
    updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  keepDeliveryMoney(tx,br,bd,sale);
}
/* Voids a bill. Its pieces go back to the place they were taken from. A bill made from a
   booking reopens that booking and the pieces are reserved for it again, so nothing is left
   claiming to be delivered when it is not. Returns the booking number if one reopened. */
async function doVoidSale(id){
  const s=S.sales.find(x=>x.id===id);
  if(!s)throw new Error("That bill no longer exists");
  if(srOf(id).length)throw new Error("Some goods on this bill already came back on a return voucher — cancel it before voiding");
  // a voided bill's goods come back like any other return: to Sales Return, to be checked
  const want=qtyByPid(s.items),pids=Object.keys(want),locOf={};pids.forEach(pid=>locOf[pid]=SR_LOC);
  let reopened="";
  await runTransaction(db,async tx=>{
    const sr=doc(db,"sales",id),sd=await tx.get(sr);
    if(!sd.exists())throw new Error("That bill no longer exists");
    if(sd.data().status==="void")throw new Error("Already void");
    if(Object.values(sd.data().returned||{}).some(n=>n>0))throw new Error("Some goods on this bill already came back on a return voucher — cancel it before voiding");
    let br=null,bd=null;
    if(s.bookingId){br=doc(db,"bookings",s.bookingId);const bs=await tx.get(br);bd=bs.exists()?bs.data():null}
    const reopen=!!(bd&&bd.status==="delivered"&&bd.saleId===id);
    const refs=pids.map(pid=>doc(db,"products",pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
    snaps.forEach((p,ix)=>{if(!p.exists())return;
      const pid=pids[ix],n=want[pid],d=p.data(),cur=+d.qty||0,map=addTo(locMapOf(d),locOf[pid]||primaryLoc(locMapOf(d)),n);
      tx.update(refs[ix],{qty:cur+n,locQty:map,location:primaryLoc(map)||d.location||"",
        ...(reopen?{booked:Math.max(0,+d.booked||0)+n}:{}),updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      tx.set(doc(collection(db,"movements")),{...mv(pid,d.name,d.sku,"void",n,cur,cur+n,
        "Void "+s.invoiceNo+(reopen?` — reserved again for ${bd.bookingNo}`:"")),toLoc:locOf[pid]||primaryLoc(map)||""})});
    tx.update(sr,{status:"void",voidedBy:S.profile.name,voidedAt:serverTimestamp()});
    if(reopen){reopenWrites(tx,br,bd,sd.data());reopened=bd.bookingNo||""}
  });
  return reopened;
}
/* A booking left showing "delivered" by a bill voided before voiding reopened bookings. Its
   stock is already back on the shelf, so this only reserves it again and reopens the booking. */
window.reopenBooking=async id=>{
  if(!isAdmin())return toast("Only an admin can reopen a booking",1);
  const b=S.bookings.find(x=>x.id===id);if(!b||b.status!=="delivered")return;
  const sale=b.saleId?S.sales.find(x=>x.id===b.saleId):null;
  if(!bkStuck(b))return toast(sale?`Its invoice ${sale.invoiceNo} is still live — void that instead`:"Its invoice can't be found",1);
  const want=qtyByPid(b.items),pids=Object.keys(want);
  const short=pids.map(pid=>{const p=S.products.find(x=>x.id===pid);return p&&avail(p)<want[pid]?`${p.name}: needs ${want[pid]}, ${Math.max(0,avail(p))} free`:""}).filter(Boolean);
  const coll=r2(num(b.collectedOnDelivery));
  if(!confirm(`Reopen ${b.bookingNo}?\n\nIts goods are reserved for it again and it can be changed, delivered again or cancelled.`
    +(coll?`\n\nThe ${inr(coll).replace("₹","Rs ")} collected on delivery stays recorded as a payment against it.`:"")
    +(short.length?`\n\nNot enough free stock to reserve everything — it will show as short until stock comes in:\n${short.join("\n")}`:"")))return;
  try{
    await runTransaction(db,async tx=>{
      const br=doc(db,"bookings",id),bs=await tx.get(br);
      if(!bs.exists()||bs.data().status!=="delivered")throw new Error("This booking is no longer marked delivered");
      if(b.saleId){const ss=await tx.get(doc(db,"sales",b.saleId));if(ss.exists()&&ss.data().status!=="void")throw new Error("Its invoice is live again");}
      const refs=pids.map(pid=>doc(db,"products",pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((p,ix)=>{if(p.exists())tx.update(refs[ix],{booked:Math.max(0,+p.data().booked||0)+want[pids[ix]],updatedAt:serverTimestamp(),updatedBy:S.user.uid})});
      reopenWrites(tx,br,bs.data(),sale);
    });
    toast(`${b.bookingNo} is open again`);
  }catch(e){toast(emsg(e),1)}
};


/* ---------- One invoice, in full ----------
   Totals work exactly like the counter does: the discount is spread across the lines in
   proportion to their value, and GST is taken as already included in the price. */
const lineGross=i=>r2(num(i.price)*num(i.qty));
const lineDisc=i=>{const g=lineGross(i);
  return r2(i.dt==="pct"?g*Math.min(100,Math.max(0,num(i.disc)))/100:Math.min(g,Math.max(0,num(i.disc))))};
const lineNet=i=>r2(lineGross(i)-lineDisc(i));
const onLines=items=>(items||[]).filter(i=>!i.off);           // an unticked line is not on the bill
const netOf=items=>r2(onLines(items).reduce((a,i)=>a+lineNet(i),0));
function sumItems(items,disc){
  const L=onLines(items);
  const gross=r2(L.reduce((a,i)=>a+lineGross(i),0));
  const itemDisc=r2(L.reduce((a,i)=>a+lineDisc(i),0));
  const net=r2(gross-itemDisc);
  const d=Math.min(net,Math.max(0,r2(disc)));
  const total=r2(net-d);
  let gst=0;L.forEach(i=>{const n=lineNet(i);const share=net?n/net:0;const line=n-d*share;gst+=line-line/(1+num(i.gst)/100)});
  gst=r2(gst);
  return{gross,itemDisc,net,disc:d,total,gst,taxable:r2(total-gst)};
}

async function saveSaleEdit(){
  const E=S.es,s=S.sales.find(x=>x.id===E.id),btn=$("#es-go");
  if(!s)return toast("That bill no longer exists",1);
  const why=($("#es-why")?.value||"").trim();
  const wasDay=s.dateKey||dkey(new Date(tms(s.createdAt)));
  let redate;
  try{redate=redatedAs($("#es-date")?$("#es-date").value:"",wasDay)}catch(e){return toast(e.message,1)}
  const dateNote=redate.dateKey?`dated ${wasDay} → ${redate.dateKey}`:"";
  const stamp=w=>[...(s.editLog||[]),{t:Date.now(),by:S.profile.name,
    what:[w,dateNote].filter(Boolean).join(" · ")||"Corrected",why}];
  btn.disabled=true;btn.textContent="Saving…";
  const fail=e=>{toast(emsg(e),1);btn.disabled=false;btn.textContent="Save changes"};
  try{
    if(E.linked){
      const collect=r2(num($("#es-collect").value)),adv=num(s.advance);
      if(collect<0)throw new Error("That can't be a negative amount");
      if(r2(adv+collect)>num(s.total))throw new Error(`That is more than the order value — at most ${inr(r2(num(s.total)-adv))} is still due`);
      const b=writeBatch(db);
      b.update(doc(db,"sales",E.id),{payment:$("#es-pay").value,balancePaid:collect,...redate,
        editLog:stamp(`Collected on delivery changed from ${inr(num(s.balancePaid??0))} to ${inr(collect)}`),
        editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid});
      if(s.bookingId)b.update(doc(db,"bookings",s.bookingId),{collectedOnDelivery:collect,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      await b.commit();
      closeModal();toast("Invoice corrected");render();return;
    }
    const items=E.items.filter(i=>Math.floor(num(i.qty))>0).map(i=>{
      const row={...i,qty:Math.floor(num(i.qty)),price:r2(num(i.price)),disc:r2(num(i.disc))};
      if(row.disc>r2(row.price*row.qty))throw new Error(`The discount on ${row.name} is more than the line is worth`);
      if(!row.disc)delete row.disc;
      return{...row,lineTotal:lineNet(row)}});
    if(!items.length)throw new Error("A bill needs at least one item — void it instead of emptying it");
    const t=sumItems(items,num($("#es-disc").value));
    if(t.total<=0)throw new Error("The bill total has to be more than zero");
    const was={},now={},locOf={};
    s.items.forEach(i=>{was[i.pid]=(was[i.pid]||0)+Math.floor(num(i.qty));locOf[i.pid]=i.takenFrom||locOf[i.pid]||""});
    items.forEach(i=>{now[i.pid]=(now[i.pid]||0)+i.qty;locOf[i.pid]=i.takenFrom||locOf[i.pid]||""});
    const delta=[...new Set([...Object.keys(was),...Object.keys(now)])]
      .map(pid=>({pid,d:(now[pid]||0)-(was[pid]||0),loc:locOf[pid]||""})).filter(x=>x.d!==0);
    await runTransaction(db,async tx=>{
      const sr=doc(db,"sales",E.id),sd=await tx.get(sr);
      if(!sd.exists())throw new Error("That bill no longer exists");
      if(sd.data().status==="void")throw new Error("This bill has just been voided by someone else");
      const refs=delta.map(x=>doc(db,"products",x.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((p,ix)=>{const x=delta[ix];
        if(!p.exists())throw new Error("A product on this bill no longer exists");
        const d=p.data(),cur=+d.qty||0,held=Math.max(0,+d.booked||0),free=cur-held;
        // pieces reserved for someone's booking are not there to be added to this bill
        if(x.d>0&&free<x.d&&!S.settings.allowNegative)throw new Error(`Only ${Math.max(0,free)} of ${d.name} free${held?` (${held} reserved for bookings)`:""}`);
        const map=x.d>0?takeAt(locMapOf(d),x.d,x.loc).map:addTo(locMapOf(d),x.loc||primaryLoc(locMapOf(d)),-x.d);
        tx.update(refs[ix],{qty:cur-x.d,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(x.pid,d.name,d.sku,x.d>0?"sale":"return",-x.d,cur,cur-x.d,
          `${s.invoiceNo} corrected by ${S.profile.name}${why?" · "+why:""}`),fromLoc:x.d>0?(x.loc||""):"",toLoc:x.d<0?(x.loc||""):""})});
      tx.update(sr,{items,subtotal:t.gross,itemDiscount:t.itemDisc,discount:t.disc,total:t.total,gstAmount:t.gst,taxable:t.taxable,payment:$("#es-pay").value,...redate,
        editLog:stamp(r2(num(s.total))===r2(t.total)?(dateNote?"":"Bill corrected"):`Bill changed from ${inr(num(s.total))} to ${inr(t.total)}`),
        editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid});
    });
    closeModal();toast("Invoice corrected");render();
  }catch(e){fail(e)}
}

function estimateFrom(src,id){

    cust:{name:($("#c-name")?.value||"").trim(),phone:($("#c-ph")?.value||"").trim()}};
  if(src==="bcart")return{items:onLines(S.bcart),t:bkTotals(S.bcart,S.bdisc,S.bdiscType),ref:"",held:false,
    cust:{name:($("#bk-name")?.value||"").trim(),phone:($("#bk-ph")?.value||"").trim()}};
  if(src==="ecart")return{items:onLines(S.ecart),t:enqTotals(S.ecart),ref:"",held:false,
    cust:{name:($("#en-name")?.value||"").trim(),phone:($("#en-ph")?.value||"").trim()}};
  if(src==="enquiry"){const e=S.enquiries.find(x=>x.id===id);if(!e)return null;

      cust:{name:e.customerName||"",phone:e.customerPhone||""},when:tms(e.createdAt)}}

}

/* A customer statement. Charges are what the shop has billed, Paid is what it has received.

function custLedger(c){
  const st=custStats(c),ev=[];

      ev.push({ms:tms(vs?.createdAt||b.deliveredAt||b.createdAt)+1,kind:"payment",ref:b.bookingNo,link:`#booking/${b.id}`,
        what:`Collected on delivery · ${b.bookingNo}`,
        detail:[vs?payLine(saleReceipts(vs))||vs.payment:"",`with ${b.invoiceNo||vs?.invoiceNo||"the bill"}, since voided — held against the booking`].filter(Boolean).join(" · "),

        what:`Booking ${b.bookingNo} cancelled`,
        detail:["order reversed",sa?SETTLE_LABEL[sm]||"":"",b.settleNote||"",b.cancelledBy?`by ${b.cancelledBy}`:""].filter(Boolean).join(" · "),
        charge:-num(b.total),paid:0});
      // the money already taken: a refund is a negative receipt, a cancellation charge is a charge
      if(sa>0&&sm==="refund")ev.push({ms:tms(b.cancelledAt||b.createdAt)+2,kind:"refund",ref:b.bookingNo,link:`#booking/${b.id}`,
        what:`Refund paid · ${b.bookingNo}`,detail:["booking amount returned to the customer",b.settleNote||""].filter(Boolean).join(" · "),charge:0,paid:-sa});
      if(sa>0&&sm==="forfeit")ev.push({ms:tms(b.cancelledAt||b.createdAt)+2,kind:"forfeit",ref:b.bookingNo,link:`#booking/${b.id}`,
        what:`Cancellation charge · ${b.bookingNo}`,detail:["booking amount kept by the shop",b.settleNote||""].filter(Boolean).join(" · "),charge:sa,paid:0});
    }
  });
  st.allSales.forEach(s=>{
    const dead=s.status==="void",linked=!!s.bookingId,adv=num(s.advance);
    const items=s.items.map(i=>`${i.name} ×${i.qty}`).join(", ");
    ev.push({ms:tms(s.createdAt),kind:dead?"void":"sale",ref:s.invoiceNo,sale:s.id,link:`#sale/${s.id}`,
      what:linked?`Invoice ${s.invoiceNo} · ${s.bookingNo} delivered`:`Invoice ${s.invoiceNo}`,
      detail:items+` · ${s.payment}`+(dead?" · voided, no effect on the balance"
        :linked?` · charged on the booking, ${inr(r2(s.balancePaid??(num(s.total)-adv)))} collected on delivery`
        :salePending(s)>0?` · ${inr(saleReceived(s))} received, ${inr(salePending(s))} still pending`:""),
      charge:dead?0:(linked?0:num(s.total)),
      paid:dead?0:saleReceived(s)});
  });
  S.salesReturns.filter(r=>r.status!=="cancelled"&&(r.customerId===c.id||(custKey(c.phone)&&custKey(r.customer?.phone)===custKey(c.phone)))).forEach(r=>{
    const rf=num(r.refundAmount);
    ev.push({ms:tms(r.createdAt),kind:"return",ref:r.returnNo,link:`#return/${r.id}`,
      what:`Sales return ${r.returnNo} · ${r.invoiceNo}`,
      detail:[(r.items||[]).map(i=>`${i.name} ×${i.qty}`).join(", "),r.reason||"",rf?`${inr(rf)} refunded · ${r.refundMode||""}`:"credited to the account"].filter(Boolean).join(" · "),
      charge:-num(r.value),paid:-rf});
  });
  S.payments.filter(p=>p.customerId===c.id||(custKey(c.phone)&&custKey(p.customerPhone)===custKey(c.phone))).forEach(p=>{
    const adj=p.kind==="adjustment",chg=adj&&p.adjust==="charge",amt=num(p.amount);

      what:adj?`Adjustment · ${chg?"charged to":"credited to"} the customer`:`Payment received${p.bookingNo?` · ${p.bookingNo}`:""}`,
      detail:[adj?"":p.mode,p.note,adj?"":(p.bookingNo?`against ${p.bookingNo}`:"on account"),
        p.createdByName?`${adj?"adjusted":"entered"} by ${p.createdByName}`:"",p.correctedBy?`corrected by ${p.correctedBy}`:""].filter(Boolean).join(" · "),
      charge:chg?amt:0,paid:chg?0:amt});
  });
  ev.sort((a,b)=>a.ms-b.ms);
