<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f3a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2421;--mute:#6b7570;--line:#e3dfd6;--brand:#1f3a34;--brand2:#2f5a50;--accent:#c8873a;--bad:#b3392f;--ok:#2d7a4f;--warn:#b7791f;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a221f;--ink:#e8ece9;--mute:#9aa7a1;--line:#2a3532;--brand:#3d7a6b;--brand2:#4a8f7e;--accent:#e0a458;--bad:#e5685d;--ok:#4cb37e;--warn:#e0b04a;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
.hide{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--brand);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.side .logo{font-weight:700;font-size:17px;padding:4px 10px 14px;letter-spacing:.2px}
nav.side .logo small{display:block;font-weight:400;opacity:.7;font-size:12px}
nav.side button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.85;display:flex;gap:10px;align-items:center}
nav.side button:hover{background:rgba(255,255,255,.08)}
nav.side button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
nav.side .sp{flex:1}
nav.side .me{font-size:12px;opacity:.8;padding:8px 10px;border-top:1px solid rgba(255,255,255,.15)}
main{padding:22px;max-width:1200px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px}
.stat .s{font-size:12px;color:var(--mute)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:rgba(127,127,127,.08)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f .full{grid-column:1/-1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:rgba(127,127,127,.14)}
.tag.ok{background:rgba(45,122,79,.15);color:var(--ok)}.tag.low{background:rgba(183,121,31,.18);color:var(--warn)}.tag.out{background:rgba(179,57,47,.15);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:12px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:14px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--bad)}
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.items{display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.item:hover{border-color:var(--brand2)}
.item b{font-weight:600}
.cartline{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer}
.qty input{width:52px;text-align:center;padding:5px}
.tree details{margin:4px 0}
.tree summary{cursor:pointer;padding:6px 8px;border-radius:8px}
.tree summary:hover{background:rgba(127,127,127,.08)}
.tree .leaf{padding:5px 8px 5px 26px;display:flex;justify-content:space-between;cursor:pointer;border-radius:8px}
.tree .leaf:hover{background:rgba(127,127,127,.08)}
.tree .kids{margin-left:16px;border-left:1px solid var(--line);padding-left:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.auth{max-width:380px;margin:9vh auto;padding:0 16px}
.auth h1{font-size:26px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bottom{display:none}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 nav.side{display:none}
 main{padding:14px 12px 90px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
 .bottom button{background:none;border:0;color:#fff;opacity:.75;padding:6px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
 .bottom button.on{opacity:1;font-weight:700}
 .bottom button span{font-size:18px}
 .pos{grid-template-columns:1fr}
 .items{max-height:40vh}
 table.resp thead{display:none}
 table.resp tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
 table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;text-align:right}
 table.resp td::before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left}
}
@media print{body *{visibility:hidden}}
</style>
</head>

function dl(name,text,type="text/csv"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x!==""))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==""))rows.push(r);return rows}

function thumb(p,size=48){
  const st=`width:${size}px;height:${size}px;border-radius:8px;object-fit:cover;background:var(--line);flex:none`;
  if(p.imageUrl)return `<img src="${esc(p.imageUrl)}" loading="lazy" style="${st}" onerror="this.style.visibility='hidden'">`;
  if(p.hasImage){const c=IMG.cache.get(p.id);return `<img data-pid="${p.id}" ${c?`src="${c}"`:""} style="${st}">`}
  return `<div style="${st};display:grid;place-items:center;color:var(--mute);font-size:${Math.round(size/2.4)}px">▣</div>`;
}

function compressImage(file,max=480,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>rej(new Error("Not a valid image"));im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- Auth & boot ---------- */
function authScreen(mode="in",msg=""){
  $("#root").innerHTML=`<div class="auth"><h1>Store Inventory</h1><p class="mute">${mode==="in"?"Sign in to continue":"Create your staff account"}</p>
  ${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:""}
  <div class="grid">
   ${mode==="up"?`<div><label>Your name</label><input id="a-name" autocomplete="name"></div>`:""}
   <div><label>Email</label><input id="a-email" type="email" autocomplete="email"></div>
   <div><label>Password</label><input id="a-pass" type="password" autocomplete="${mode==="in"?"current-password":"new-password"}"></div>
   <button class="btn" id="a-go">${mode==="in"?"Sign in":"Create account"}</button>
   <div class="row" style="justify-content:space-between"><a href="#" id="a-sw">${mode==="in"?"New staff? Create account":"Have an account? Sign in"}</a>${mode==="in"?`<a href="#" id="a-fp">Forgot password</a>`:""}</div>
  </div></div>`;
  $("#a-sw").onclick=e=>{e.preventDefault();authScreen(mode==="in"?"up":"in")};
  $("#a-fp")&&($("#a-fp").onclick=async e=>{e.preventDefault();const em=$("#a-email").value.trim();if(!em)return toast("Enter your email first",1);try{await sendPasswordResetEmail(auth,em);toast("Reset email sent")}catch(x){toast(x.message,1)}});
  const go=async()=>{
    const email=$("#a-email").value.trim(),pass=$("#a-pass").value;
    try{
      if(mode==="in")await signInWithEmailAndPassword(auth,email,pass);
      else{const name=$("#a-name").value.trim()||email.split("@")[0];
        S.pendingName=name;const cr=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(cr.user,{displayName:name});}
    }catch(x){authScreen(mode,x.code?.replace("auth/","").replace(/-/g," ")||x.message)}
  };
  $("#a-go").onclick=go;$("#a-pass").onkeydown=e=>{if(e.key==="Enter")go()};
}

function setupScreen(){
  $("#root").innerHTML=`<div class="auth" style="max-width:560px"><h1>One-time setup needed</h1>
  <p>Add your Firebase project keys to <code>firebase-config.js</code>, then reload. Step-by-step instructions are in <b>README.md</b>.</p></div>`;
}

async function ensureProfile(u){
  const r=doc(db,"users",u.uid);let s=await getDoc(r);
  if(!s.exists()){
    const name=u.displayName||S.pendingName||u.email.split("@")[0];
    const boot=await getDoc(doc(db,"settings","bootstrap")).catch(()=>null);
    const first=!(boot&&boot.exists());
    const b=writeBatch(db);
    b.set(r,{name,email:u.email,role:first?"admin":"pending",createdAt:serverTimestamp()});
    if(first)b.set(doc(db,"settings","bootstrap"),{by:u.uid,at:serverTimestamp()});
    await b.commit();
    s=await getDoc(r);
  }
  return s.data();
}

function stopListeners(){S.unsub.forEach(f=>f());S.unsub=[]}
function startListeners(){
  stopListeners();
  const on=(q,fn)=>S.unsub.push(onSnapshot(q,fn,e=>console.warn(e)));
  on(doc(db,"settings","store"),s=>{if(s.exists())S.settings={...S.settings,...s.data()};render()});
  on(collection(db,"products"),s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"sales"),orderBy("createdAt","desc"),limit(500)),s=>{S.sales=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  on(query(collection(db,"movements"),orderBy("createdAt","desc"),limit(200)),s=>{S.moves=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
  if(isAdmin())on(collection(db,"users"),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));render(true)});
}

if(!configured){setupScreen()}
else onAuthStateChanged(auth,async u=>{
  S.user=u;
  if(!u){stopListeners();S.profile=null;authScreen("in");return}
  try{S.profile=await ensureProfile(u)}catch(e){$("#root").innerHTML=`<div class="auth"><h1>Couldn't load profile</h1><p>${esc(e.message)}</p><p>Check that Firestore rules from README.md are published.</p><button class="btn" id="so">Sign out</button></div>`;$("#so").onclick=()=>signOut(auth);return}
  if(S.profile.role==="pending"){
    stopListeners();
    $("#root").innerHTML=`<div class="auth"><h1>Waiting for approval</h1><p class="mute">Your account (${esc(u.email)}) is created. Ask the store admin to approve it, then reload.</p><div class="row"><button class="btn" id="rl">Reload</button><button class="btn sec" id="so">Sign out</button></div></div>`;
    $("#rl").onclick=()=>location.reload();$("#so").onclick=()=>signOut(auth);return}
  startListeners();render();
});

function filteredProducts(){
  const f=S.pf,q=f.q.toLowerCase();
  let L=S.products.filter(p=>{
    if(q&&!(`${p.name} ${p.sku} ${p.barcode||""} ${p.brand||""}`.toLowerCase().includes(q)))return false;
    if(f.cat&&p.categoryId!==f.cat)return false;if(f.sub&&p.subcategoryId!==f.sub)return false;
    if(f.stock==="low"&&!lowStock(p))return false;if(f.stock==="out"&&!outStock(p))return false;if(f.stock==="in"&&outStock(p))return false;

}

async function saveProduct(id){
  const v=i=>$(i).value.trim();
  const name=v("#p-name"),sku=v("#p-sku"),cid=v("#p-cat");
  if(!name||!sku||!cid)return toast("Name, SKU and category are required",1);
  if(S.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==id))return toast("SKU already exists",1);
  if(v("#p-price")==="")return toast("Selling price is required",1);
  const old=S.products.find(x=>x.id===id)||{};
  const cat=TAXONOMY.find(c=>c.id===cid),sub=cat.subcategories.find(s=>s.id===v("#p-sub")),type=sub?.subcategories.find(t=>t.id===v("#p-type"));
  const imageUrl=v("#p-imgurl");
  const hasImage=IMGSTATE.newImg?true:IMGSTATE.rm?false:!!old.hasImage;
  const d={name,sku,barcode:v("#p-bar"),brand:v("#p-brand"),
    categoryId:cat.id,categoryName:cat.name,categorySlug:cat.slug,
    subcategoryId:sub?.id||"",subcategoryName:sub?.name||"",subcategorySlug:sub?.slug||"",
    typeId:type?.id||"",typeName:type?.name||"",typeSlug:type?.slug||"",
    fullSlug:(type||sub||cat).slug,imageUrl,hasImage,
    mrp:num(v("#p-mrp"))||num(v("#p-price")),price:num(v("#p-price")),cost:num(v("#p-cost")),gst:num(v("#p-gst")),
    reorder:num(v("#p-re")),unit:v("#p-unit"),location:v("#p-loc"),description:v("#p-desc"),active:true,
    updatedAt:serverTimestamp(),updatedBy:S.user.uid};
  try{
    const b=writeBatch(db);
    const r=id?doc(db,"products",id):doc(collection(db,"products"));
    if(id)b.update(r,d);
    else{const q=Math.max(0,Math.floor(num(v("#p-qty"))));
      b.set(r,{...d,qty:q,createdAt:serverTimestamp()});
      if(q>0)b.set(doc(collection(db,"movements")),mv(r.id,name,sku,"opening",q,0,q,"Opening stock"))}
    if(IMGSTATE.newImg){b.set(doc(db,"productImages",r.id),{data:IMGSTATE.newImg,updatedAt:serverTimestamp()});IMG.cache.set(r.id,IMGSTATE.newImg)}
    else if(IMGSTATE.rm&&old.hasImage){b.delete(doc(db,"productImages",r.id));IMG.cache.delete(r.id)}
    await b.commit();
    closeModal();toast("Saved");
  }catch(e){toast(e.message,1)}
}

window.openStock=function(id){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:460px"><h3>${esc(p.name)}</h3>
  <p class="mute">${esc(p.sku)} · Current stock: <b>${p.qty} ${esc(p.unit||"pcs")}</b></p>
  <div class="tabs" id="s-tabs">${[["in","Stock in"],["out","Stock out"],["set","Set count"]].map((t,i)=>`<button class="btn sm ${i?"sec":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div class="grid"><div><label id="s-lab">Quantity received</label><input id="s-qty" type="number" min="0" step="1" autofocus></div>
  <div><label>Reason</label><select id="s-reason"></select></div><div><label>Note (optional)</label><input id="s-note" placeholder="Supplier / bill no. / remark"></div></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="s-save">Update stock</button></div></div></div>`;
  let mode="in";
  const R={in:["Purchase / received","Customer return","Transfer in","Found / correction"],out:["Damaged","Transfer out","Sold (offline)","Lost / missing","Supplier return"],set:["Stock count / audit"]};
  const upd=()=>{$("#s-reason").innerHTML=R[mode].map(r=>`<option>${r}</option>`).join("");$("#s-lab").textContent={in:"Quantity received",out:"Quantity removed",set:"Counted quantity"}[mode];
    document.querySelectorAll("#s-tabs button").forEach(b=>b.classList.toggle("sec",b.dataset.t!==mode))};
  document.querySelectorAll("#s-tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.t;upd()});upd();
  $("#s-save").onclick=async()=>{
    const q=Math.floor(num($("#s-qty").value));if($("#s-qty").value===""||q<0)return toast("Enter a valid quantity",1);
    const reason=$("#s-reason").value,note=$("#s-note").value.trim();
    try{
      await runTransaction(db,async tx=>{
        const r=doc(db,"products",id),s=await tx.get(r);const cur=s.data().qty;
        const after=mode==="in"?cur+q:mode==="out"?cur-q:q;
        if(after<0&&!S.settings.allowNegative)throw new Error("Not enough stock (only "+cur+")");
        tx.update(r,{qty:after,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),mv(id,p.name,p.sku,mode==="in"?"in":mode==="out"?"out":"adjust",after-cur,cur,after,reason+(note?" — "+note:"")));
      });
      closeModal();toast("Stock updated");
    }catch(e){toast(e.message,1)}
  };
};

/* ---------- POS ---------- */
function cartTotals(){
  const gross=S.cart.reduce((a,i)=>a+i.price*i.qty,0);
  let disc=S.cartDiscType==="pct"?gross*Math.min(100,S.cartDiscount)/100:Math.min(gross,S.cartDiscount);
  disc=Math.round(disc*100)/100;const total=Math.round((gross-disc)*100)/100;
  let gst=0;S.cart.forEach(i=>{const share=gross?i.price*i.qty/gross:0;const line=i.price*i.qty-disc*share;gst+=line-line/(1+i.gst/100)});
  gst=Math.round(gst*100)/100;
  return{gross,disc,total,gst,taxable:Math.round((total-gst)*100)/100};
}

async function completeSale(){

    let inv="",saleId="";

      const cr=doc(db,"counters","invoice"),cs=await tx.get(cr);
      const refs=cart.map(i=>doc(db,"products",i.pid));const snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(cart[ix].name+" no longer exists");if(s.data().qty<cart[ix].qty&&!S.settings.allowNegative)throw new Error("Not enough stock for "+cart[ix].name+" (only "+s.data().qty+")")});
      const n=(cs.exists()?cs.data().n:0)+1;inv=(S.settings.invoicePrefix||"INV")+"-"+String(n).padStart(5,"0");
      tx.set(cr,{n});

      snaps.forEach((s,ix)=>{const c=cart[ix],cur=s.data().qty;
        tx.update(refs[ix],{qty:cur-c.qty,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),mv(c.pid,c.name,c.sku,"sale",-c.qty,cur,cur-c.qty,inv))});
      tx.set(sr,{invoiceNo:inv,items:cart.map(i=>({pid:i.pid,sku:i.sku,name:i.name,price:i.price,qty:i.qty,gst:i.gst,cost:i.cost,lineTotal:Math.round(i.price*i.qty*100)/100})),

        soldBy:S.user.uid,soldByName:S.profile.name,dateKey:dkey(),createdAt:serverTimestamp()});

}

const norm=s=>String(s??"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
function resolveCategory(r){
  const cn=norm(r.category),sn=norm(r.subcategory),tn=norm(r.type);
  if(cn||sn||tn){
    if(!cn)return{err:"Category is blank"};
    const c=TAXONOMY.find(x=>norm(x.name)===cn);
    if(!c)return{err:`Unknown category "${r.category}"`};
    if(!sn)return{cat:c};
    const s=c.subcategories.find(x=>norm(x.name)===sn);
    if(!s)return{err:`"${r.subcategory}" is not a sub-category of ${c.name}`};
    if(!tn)return{cat:c,sub:s};
    const t=s.subcategories.find(x=>norm(x.name)===tn);
    if(!t)return{err:`"${r.type}" is not a type under ${s.name}`};
    return{cat:c,sub:s,type:t};
  }
  const m=bySlug[String(r.categorySlug||"").trim()];
  return m?{cat:m.cat,sub:m.sub,type:m.type}:{err:"Category is blank"};
}
const HMAP={sku:"sku",name:"name",productname:"name",brand:"brand",barcode:"barcode",category:"category",subcategory:"subcategory",subcat:"subcategory",type:"type",categoryslug:"categorySlug",imageurl:"imageUrl",image:"imageUrl",mrp:"mrp",price:"price",sellingprice:"price",cost:"cost",costprice:"cost",gst:"gst",qty:"qty",stock:"qty",reorder:"reorder",unit:"unit",location:"location",description:"description",notes:"description"};
function toObjs(all){
  const hi=all.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==="sku"));
  if(hi<0)throw new Error('Could not find a header row with a "sku" column');
  const keys=all[hi].map(c=>HMAP[String(c).toLowerCase().replace(/[^a-z]/g,"")]||null);
  const out=[];
  all.slice(hi+1).forEach((r,i)=>{const o={_row:hi+i+2};let any=false;keys.forEach((k,j)=>{if(!k)return;const v=r[j]===undefined||r[j]===null?"":String(r[j]).trim();if(v!=="")any=true;o[k]=v});if(any)out.push(o)});
  return out;
}
async function loadXLSX(){
  if(window.XLSX)return window.XLSX;
  await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("Couldn't load the Excel reader — check your internet"));document.head.appendChild(s)});
  return window.XLSX;
}
async function readFileRows(file){
  if(/\.csv$/i.test(file.name))return toObjs(parseCSV(await file.text()));
  const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});
  const hasSku=n=>((X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""})[0])||[]).some(c=>String(c).trim().toLowerCase()==="sku");
  const name=wb.SheetNames.find(n=>n.toLowerCase()==="products"&&hasSku(n))||wb.SheetNames.find(hasSku);
  if(!name)throw new Error('No sheet with a "sku" column found');
  return toObjs(X.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""}));
}
window.exportProducts=()=>{
  const rows=[["sku","name","brand","barcode","category","subcategory","type","categorySlug","imageUrl","mrp","price","cost","gst","qty","reorder","unit","location","description"]];
  filteredProducts().forEach(p=>rows.push([p.sku,p.name,p.brand,p.barcode,p.categoryName,p.subcategoryName,p.typeName,p.fullSlug,p.imageUrl,p.mrp,p.price,p.cost,p.gst,p.qty,p.reorder,p.unit,p.location,p.description]));
  dl("products-"+dkey()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"));
};
window.exportSales=()=>{
  const rows=[["invoice","date","customer","phone","payment","status","items","subtotal","discount","gst_included","total","sold_by"]];
  S.sales.forEach(s=>rows.push([s.invoiceNo,s.dateKey,s.customer?.name,s.customer?.phone,s.payment,s.status,s.items.map(i=>i.name+" x"+i.qty).join("; "),s.subtotal,s.discount,s.gstAmount,s.total,s.soldByName]));
  dl("sales-"+dkey()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"));
};
window.exportMoves=()=>{
  const rows=[["date","product","sku","type","change","before","after","note","by"]];
  S.moves.forEach(m=>rows.push([new Date(tms(m.createdAt)).toISOString(),m.productName,m.sku,m.type,m.delta,m.before,m.after,m.note,m.byName]));
  dl("stock-log-"+dkey()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"));
};
window.openImport=()=>{
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal"><h3>Import products from Excel</h3>
  <p class="mute small">Upload the filled <b>Inventory Import Template (.xlsx)</b>. Category, sub-category and type are matched by name and the category slug is saved automatically. Existing SKUs are updated (stock is left unchanged); new SKUs are created with the given qty.</p>
  <input type="file" id="imp-f" accept=".xlsx,.xls,.csv"><div id="imp-r" class="small" style="margin-top:10px"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Close</button><button class="btn" id="imp-go" disabled>Import</button></div></div></div>`;
  let good=[];
  $("#imp-f").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;$("#imp-r").textContent="Reading…";good=[];$("#imp-go").disabled=true;
    try{
      const rows=await readFileRows(f);const bad=[];let skipped=0;
      rows.forEach(r=>{
        if(/^example\b/i.test(r.name||"")){skipped++;return}
        if(!r.sku||!r.name)return bad.push(`Row ${r._row}: sku and name are required`);
        if(r.price===undefined||r.price==="")return bad.push(`Row ${r._row} (${r.sku}): price is missing`);
        const m=resolveCategory(r);if(m.err)return bad.push(`Row ${r._row} (${r.sku}): ${m.err}`);
        good.push({r,m});
      });
      $("#imp-r").innerHTML=`${rows.length} rows read · <b>${good.length} ready</b>${skipped?` · ${skipped} example row skipped`:""}${bad.length?` · <span style="color:var(--bad)">${bad.length} with problems (will be skipped)</span><div style="margin-top:6px;max-height:140px;overflow:auto;color:var(--bad)">${bad.slice(0,30).map(esc).join("<br>")}${bad.length>30?"<br>…":""}</div>`:""}`;
      $("#imp-go").disabled=!good.length;
    }catch(x){$("#imp-r").innerHTML=`<span style="color:var(--bad)">${esc(x.message)}</span>`}
  };
  $("#imp-go").onclick=async()=>{
    $("#imp-go").disabled=true;$("#imp-go").textContent="Importing…";
    const bySku=Object.fromEntries(S.products.map(p=>[p.sku.toLowerCase(),p]));let n=0,u=0;const seen={};
    try{
      for(let i=0;i<good.length;i+=150){const b=writeBatch(db);
        good.slice(i,i+150).forEach(({r,m})=>{const c=m.cat,s=m.sub,t=m.type;const key=r.sku.toLowerCase();
          const d={sku:r.sku,name:r.name,brand:r.brand||"",barcode:r.barcode||"",categoryId:c.id,categoryName:c.name,categorySlug:c.slug,
            subcategoryId:s?.id||"",subcategoryName:s?.name||"",subcategorySlug:s?.slug||"",typeId:t?.id||"",typeName:t?.name||"",typeSlug:t?.slug||"",fullSlug:(t||s||c).slug,
            mrp:num(r.mrp)||num(r.price),price:num(r.price),cost:num(r.cost),gst:r.gst===undefined||r.gst===""?18:num(r.gst),reorder:r.reorder===undefined||r.reorder===""?2:num(r.reorder),unit:r.unit||"pcs",location:r.location||"",description:r.description||"",active:true,updatedAt:serverTimestamp(),updatedBy:S.user.uid};
          if(r.imageUrl)d.imageUrl=r.imageUrl;
          const ex=bySku[key]||seen[key];
          if(ex){b.update(doc(db,"products",ex.id),d);u++}
          else{const ref=doc(collection(db,"products")),q=Math.max(0,Math.floor(num(r.qty)));seen[key]={id:ref.id};
            b.set(ref,{...d,imageUrl:r.imageUrl||"",hasImage:false,qty:q,createdAt:serverTimestamp()});
            if(q>0)b.set(doc(collection(db,"movements")),mv(ref.id,r.name,r.sku,"opening",q,0,q,"Excel import"));n++}});
        await b.commit()}
      closeModal();toast(`Imported: ${n} new, ${u} updated`);
    }catch(e){toast(e.message,1);$("#imp-go").disabled=false;$("#imp-go").textContent="Import"}
  };
};
window.dl=dl;

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
