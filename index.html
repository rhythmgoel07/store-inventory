<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f3a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2421;--mute:#6b7570;--line:#e3dfd6;--brand:#1f3a34;--brand2:#2f5a50;--accent:#c8873a;--bad:#b3392f;--ok:#2d7a4f;--warn:#b7791f;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a221f;--ink:#e8ece9;--mute:#9aa7a1;--line:#2a3532;--brand:#3d7a6b;--brand2:#4a8f7e;--accent:#e0a458;--bad:#e5685d;--ok:#4cb37e;--warn:#e0b04a;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
.hide{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--brand);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.side .logo{font-weight:700;font-size:17px;padding:4px 10px 14px;letter-spacing:.2px}
nav.side .logo small{display:block;font-weight:400;opacity:.7;font-size:12px}
nav.side button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.85;display:flex;gap:10px;align-items:center}
nav.side button:hover{background:rgba(255,255,255,.08)}
nav.side button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
nav.side .sp{flex:1}
nav.side .me{font-size:12px;opacity:.8;padding:8px 10px;border-top:1px solid rgba(255,255,255,.15)}
main{padding:22px;max-width:1200px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h2{font-size:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px}
.stat .s{font-size:12px;color:var(--mute)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:rgba(127,127,127,.08)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f .full{grid-column:1/-1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:rgba(127,127,127,.14)}
.tag.ok{background:rgba(45,122,79,.15);color:var(--ok)}.tag.low{background:rgba(183,121,31,.18);color:var(--warn)}.tag.out{background:rgba(179,57,47,.15);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:12px}
table td.c,table th.c{text-align:center}
.badge{background:var(--accent);color:#1d2421;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700;margin-left:auto}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg.top{z-index:60;align-items:center}
.cam-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.cam-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:14px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--bad)}
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.items{display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.item:hover{border-color:var(--brand2)}
.item b{font-weight:600}
.cartline{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer}
.qty input{width:52px;text-align:center;padding:5px}
.tree details{margin:4px 0}
.tree summary{cursor:pointer;padding:6px 8px;border-radius:8px}
.tree summary:hover{background:rgba(127,127,127,.08)}
.tree .leaf{padding:5px 8px 5px 26px;display:flex;justify-content:space-between;cursor:pointer;border-radius:8px}
.tree .leaf:hover{background:rgba(127,127,127,.08)}
.tree .kids{margin-left:16px;border-left:1px solid var(--line);padding-left:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.auth{max-width:380px;margin:9vh auto;padding:0 16px}
.auth h1{font-size:26px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bottom{display:none}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 nav.side{display:none}
 main{padding:14px 12px 90px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
 .bottom button{background:none;border:0;color:#fff;opacity:.75;padding:6px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
 .bottom button.on{opacity:1;font-weight:700}
 .bottom button span{font-size:18px}
 .pos{grid-template-columns:1fr}
 .items{max-height:40vh}
 table.resp thead{display:none}
 table.resp tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
 table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;text-align:right}
 table.resp td::before{content:attr(data-l);color:var(--mute);font-size:12px;text-align:left}
}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pcard.adm{cursor:pointer}.pcard.adm:hover{border-color:var(--brand2)}
.pim{aspect-ratio:1;width:100%;object-fit:cover;background:var(--line);display:grid;place-items:center;color:var(--mute);font-size:34px}
.pcard .pb{padding:10px 12px 12px;display:grid;gap:3px;flex:1;align-content:start}
.pcard .pn{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard a.pn{color:var(--brand2);text-decoration:underline}
.pcard .dim{color:var(--accent);font-weight:600}
.pcard .locs{line-height:1.35}.pcard .locs b{color:var(--ink);font-weight:600}
.pcard .sku{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.pcard .pr{font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .mrp{font-size:11.5px;color:var(--mute)}
.pcard .cost{font-size:12px;color:var(--mute);font-weight:600}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.tb{margin-left:10px;display:inline-flex;gap:4px;vertical-align:middle}
.detail{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:16px}
.detail table td:first-child{color:var(--mute);width:38%}
@media(max-width:820px){.detail{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,1fr)}}
@media print{body *{visibility:hidden}}
</style>
</head>

/* Firebase errors are terse; say what to actually do about them. */
function emsg(e){
  const s=((e&&(e.code||""))+" "+((e&&e.message)||"")).toLowerCase();
  if(s.includes("permission-denied")||s.includes("insufficient permissions"))
    return "The database refused this. Usually the security rules published in Firebase are older than this app — an admin should paste firestore.rules into Firestore \u2192 Rules and press Publish. If they are current, your role does not allow this action.";
  if(s.includes("unavailable")||s.includes("failed to get")||s.includes("network")||s.includes("offline"))
    return "Can't reach the database right now — check the internet connection and try again.";
  if(s.includes("not-found"))return "That record no longer exists — reload and try again.";
  return (e&&e.message)||"Something went wrong";
}

function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x!==""))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==""))rows.push(r);return rows}

const ROLES=["admin","manager","sales"];
const ROLE = ()=>{const r=S.profile?.role;return r==="staff"?"sales":r};          // "staff" is the old name for "sales"
const ROLE_LABEL={admin:"admin",manager:"manager",sales:"sales executive"};
const isAdmin = ()=>ROLE()==="admin";
/* What a manager or sales executive may do is set by the admin on the Staff screen and kept in
   settings/perms. An admin always may do everything. */
const can = k=>isAdmin()||(k==="vendorsTab"?(can("manageVendors")||can("vendorLedger")):!!(S.perms?.[ROLE()]||{})[k]);
const isManager = ()=>isAdmin()||can("stockIn")||can("transfer")||can("stockOut")||can("setCount");
const activeRole = r=>["admin","manager","sales","staff"].includes(r);
const fullMode = ()=>S.settings.mode==="full";
const vend = p=>p.vendor??p.brand??"";
// A product's size is kept as the measurement in one field and its unit in another,
// so "16x16" + "inch" stay separate for filtering, exports and labels.
const dimNorm = s=>String(s??"").trim().replace(/(\d)\s*[x×X*]\s*(?=\d)/g,"$1x").replace(/\s+/g," ");
const dimOf = p=>dimNorm(p?.dimension);
const dimUnitOf = p=>String(p?.dimUnit||"").trim();
// "1 pc", "2 pcs", "1 set" — a unit the app doesn't know is printed as typed.
const UNIT_FORMS={pcs:["pc","pcs"],pc:["pc","pcs"],piece:["piece","pieces"],pieces:["pc","pcs"],
  set:["set","sets"],sets:["set","sets"],pair:["pair","pairs"],pairs:["pair","pairs"],box:["box","boxes"],boxes:["box","boxes"]};
const qtyText=(n,unit)=>{
  const u=String(unit||"pcs").trim(),f=UNIT_FORMS[u.toLowerCase()];
  const label=f?(Math.abs(+n||0)===1?f[0]:f[1]):u;
  return `${+n||0}${label?" "+label:""}`;
};
const catLine = p=>[p.categoryName,p.subcategoryName,p.typeName].filter(Boolean).slice(-2).join(", ");
const dimText = p=>{const d=dimOf(p);return d?(d+(dimUnitOf(p)?" "+dimUnitOf(p):"")):""};
/* Stock can sit in more than one place. locQty is a {location: quantity} map and qty stays the
   total. Products saved before this existed have no map, so their whole stock is read as sitting
   at their single location. */
// Reorder levels are switched off for now. Flip this to true to bring the field back in the
// product form; the data behind it is untouched, so nothing is lost while it is off.
const SHOW_REORDER=false;
// Billing method and credit period are off. Flip this to true to bring them back in the vendor
// form, on the vendor page and list, on a purchase, in the statement and in the export.
// Values already saved on a vendor are kept either way.
const SHOW_BILLING=false;
const CHARGE_HEADS=["Freight","GST","Loading","Packing","Transport","Insurance","Discount"];
const UNLOC="Unassigned";
const locMapOf=d=>{
  if(d&&d.locQty&&typeof d.locQty==="object")return{...d.locQty};
  const q=+(d?.qty)||0,k=String(d?.location||"").trim()||UNLOC;
  return q?{[k]:q}:{};
};
const locEntries=p=>Object.entries(locMapOf(p)).filter(([,v])=>+v>0).sort((a,b)=>b[1]-a[1]);
const locText=p=>locEntries(p).map(([k,v])=>`${k}: ${v}`).join(" · ");
// take n pieces, starting at `first` if given, then from wherever has the most
const takeAt=(m,n,first)=>{
  const o={...m};let left=n;const used=[];
  const order=[...(first&&o[first]!==undefined?[first]:[]),...Object.keys(o).filter(k=>k!==first).sort((a,b)=>(o[b]||0)-(o[a]||0))];
  for(const k of order){if(left<=0)break;const t=Math.min(Math.max(0,+o[k]||0),left);if(t>0){o[k]=(+o[k]||0)-t;left-=t;used.push([k,t])}}
  if(left>0){const k=first||order[0]||UNLOC;o[k]=(+o[k]||0)-left;used.push([k,left]);left=0}
  Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});
  return{map:o,used};
};
const takeFrom=(m,n)=>{const o={...m};let left=n;
  const ks=Object.keys(o).sort((a,b)=>(o[b]||0)-(o[a]||0));
  for(const k of ks){if(left<=0)break;const t=Math.min(+o[k]||0,left);o[k]=(+o[k]||0)-t;left-=t}
  if(left>0){const k=ks[0]||UNLOC;o[k]=(+o[k]||0)-left}
  return o};
const addTo=(m,loc,n)=>{const o={...m},k=String(loc||"").trim()||UNLOC;o[k]=(+o[k]||0)+n;return o};
const primaryLoc=m=>{const e=Object.entries(m).filter(([,v])=>+v>0).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:""};
const bk = p=>Math.max(0,+p.booked||0);
const avail = p=>(+p.qty||0)-bk(p);
const lowStock = p=>SHOW_REORDER&&p.qty>0&&p.qty<=num(p.reorder);   // no amber while reorder levels are off
const outStock = p=>p.qty<=0;

/* ---------- Products ---------- */
function filteredProducts(){
  const f=S.pf,q=dimNorm(f.q).toLowerCase();
  let L=S.products.filter(p=>{
    if(q&&!(dimNorm(`${p.name} ${p.sku} ${p.barcode||""} ${vendQ(p)} ${locKeys(p).join(" ")} ${dimText(p)}`).toLowerCase().includes(q)))return false;
    if(f.loc&&!locKeys(p).some(k=>k.toLowerCase()===f.loc.toLowerCase()))return false;
    if(f.vendor&&norm(vend(p))!==norm(f.vendor))return false;
    if(f.dim&&dimText(p).toLowerCase()!==dimNorm(f.dim).toLowerCase())return false;
    if(f.cat&&p.categoryId!==f.cat)return false;if(f.sub&&p.subcategoryId!==f.sub)return false;

async function saveProduct(id){
  const v=i=>$(i).value.trim();
  const name=v("#p-name"),sku=v("#p-sku"),cid=v("#p-cat");
  if(!name||!sku||!cid)return toast("Name, SKU and category are required",1);
  if(S.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==id))return toast("SKU already exists",1);
  if(v("#p-price")==="")return toast("Selling price is required",1);
  const old=S.products.find(x=>x.id===id)||{};
  const cat=TAXONOMY.find(c=>c.id===cid),sub=cat.subcategories.find(s=>s.id===v("#p-sub")),type=sub?.subcategories.find(t=>t.id===v("#p-type"));
  const imageUrl=v("#p-imgurl");
  const hasImage=IMGSTATE.newImg?true:IMGSTATE.rm?false:!!old.hasImage;
  const barcode=v("#p-bar")||old.barcode||"";
  if(barcode&&S.products.some(x=>x.barcode===barcode&&x.id!==id))return toast("That barcode is already used by another product",1);
  const vname=v("#p-vendor"),vrec=S.vendors.find(x=>norm(x.name)===norm(vname));
  const d={name,sku,barcode,vendor:vname,vendorId:vrec?.id||"",
    categoryId:cat.id,categoryName:cat.name,categorySlug:cat.slug,
    subcategoryId:sub?.id||"",subcategoryName:sub?.name||"",subcategorySlug:sub?.slug||"",
    typeId:type?.id||"",typeName:type?.name||"",typeSlug:type?.slug||"",
    fullSlug:(type||sub||cat).slug,imageUrl,hasImage,
    mrp:num(v("#p-mrp"))||num(v("#p-price")),price:num(v("#p-price")),cost:num(v("#p-cost")),gst:num(v("#p-gst")),
    dimension:dimNorm(v("#p-dim")),dimUnit:dimNorm(v("#p-dim"))?v("#p-dimunit"):"",
    reorder:$("#p-re")?num(v("#p-re")):num(old.reorder),unit:v("#p-unit"),location:v("#p-loc"),description:v("#p-desc"),active:true,
    updatedAt:serverTimestamp(),updatedBy:S.user.uid};
  let r;
  try{
    const b=writeBatch(db);
    r=id?doc(db,"products",id):doc(collection(db,"products"));
    if(id)b.update(r,d);
    else{const q=Math.max(0,Math.floor(num(v("#p-qty"))));
      b.set(r,{...d,qty:q,booked:0,locQty:q?{[d.location||UNLOC]:q}:{},createdAt:serverTimestamp()});
      if(q>0)b.set(doc(collection(db,"movements")),mv(r.id,name,sku,"opening",q,0,q,"Opening stock"))}
    if(IMGSTATE.newImg){b.set(doc(db,"productImages",r.id),{data:IMGSTATE.newImg,updatedAt:serverTimestamp()});IMG.cache.set(r.id,IMGSTATE.newImg)}
    else if(IMGSTATE.rm&&old.hasImage){b.delete(doc(db,"productImages",r.id));IMG.cache.delete(r.id)}
    await b.commit();
    closeModal();toast("Saved");
    const back=window.__afterProduct;window.__afterProduct=null;if(back)back(r.id);
  }catch(e){toast(emsg(e),1)}
}

/* ---------- Stock ---------- */
window.openStock=function(id,only){
  if(!isManager())return toast("You don't have permission to change stock",1);
  const p=S.products.find(x=>x.id===id);if(!p)return;
  const TABS=[["in","Stock in","stockIn"],["transfer","Transfer","transfer"],["out","Stock out","stockOut"],["set","Set count","setCount"]]
    .filter(t=>can(t[2])).filter(t=>!only||t[0]===only);
  if(!TABS.length)return toast("You don't have permission to change stock",1);
  const R={in:["Purchase / received","Customer return","Found / correction"],out:["Damaged","Lost / missing","Supplier return","Sold (offline)"],
    set:["Stock count / audit"],transfer:["Moved to another rack","Sent to godown","Brought to floor","Sent for delivery"]};
  const locList=()=>[...new Set([...allLocations(),...Object.keys(locMapOf(p))])].filter(Boolean).sort(natcmp);
  const opts=(sel,list)=>list.map(x=>`<option ${String(sel)===String(x)?"selected":""}>${esc(x)}</option>`).join("");
  const here=k=>+locMapOf(p)[k]||0;
  let mode=TABS[0][0];
  const first=primaryLoc(locMapOf(p))||p.location||locList()[0]||UNLOC;
  // Stock in can land in several places at once — one row per place.
  let rows=[{loc:first,qty:""}];
  let K={qty:"",to:first,from:(locEntries(p)[0]||[])[0]||first,reason:"",note:""};
  const readRows=()=>document.querySelectorAll("#s-rows tr[data-ix]").forEach(tr=>{
    rows[+tr.dataset.ix]={loc:tr.querySelector("select").value,qty:tr.querySelector("input").value}});
  const read=()=>{
    if(mode==="in"&&$("#s-rows"))readRows();
    if($("#s-qty"))K.qty=$("#s-qty").value;
    if($("#s-to"))K.to=$("#s-to").value;
    if($("#s-from"))K.from=$("#s-from").value;
    if($("#s-reason"))K.reason=$("#s-reason").value;
    if($("#s-note"))K.note=$("#s-note").value;
  };
  const addedTotal=()=>rows.reduce((a,r)=>a+Math.max(0,Math.floor(num(r.qty))),0);
  const body=()=>{
    const L=locList(),ent=locEntries(p);
    if(mode==="in")return `<label>Receive into</label>
     <table id="s-rows"><thead><tr><th>Location / rack</th><th class="n">Quantity</th><th></th></tr></thead><tbody>
     ${rows.map((r,ix)=>`<tr data-ix="${ix}">
      <td><select>${opts(r.loc,withCur(L,r.loc))}</select></td>
      <td class="n"><input type="number" min="0" step="1" value="${esc(r.qty)}" style="width:92px" placeholder="0"></td>
      <td>${rows.length>1?`<button class="btn sm sec" type="button" onclick="stRow('del',${ix})">✕</button>`:""}</td></tr>`).join("")}
     </tbody></table>
     <div class="row" style="margin-top:6px"><button class="btn sec sm" type="button" onclick="stRow('add')">+ Another location</button>
      <span class="small mute">One bill can go into several racks — add a row for each.</span></div>`;
    if(mode==="set")return `<div class="f">
      <div><label>Counted at</label><select id="s-to">${opts(K.to,withCur(L,K.to))}</select></div>
      <div><label>Counted quantity there</label><input id="s-qty" type="number" min="0" step="1" value="${esc(K.qty)}" autofocus></div></div>`;
    if(mode==="transfer"){
      if(K.to===K.from)K.to=L.find(x=>x!==K.from)||K.to;
      return `<div class="f">
      <div><label>Move from</label><select id="s-from">${ent.length?ent.map(([k,v])=>`<option value="${esc(k)}" ${K.from===k?"selected":""}>${esc(k)} (${v} in stock)</option>`).join(""):opts(K.from,withCur(L,K.from))}</select></div>
      <div><label>Move to</label><select id="s-to">${opts(K.to,withCur(L,K.to))}</select></div>
      <div><label>Quantity to move</label><input id="s-qty" type="number" min="0" step="1" value="${esc(K.qty)}" autofocus></div></div>`}
    return `<div class="f">
      <div><label>Take out of</label><select id="s-to">${opts(K.to,withCur(L,K.to))}</select></div>
      <div><label>Quantity removed</label><input id="s-qty" type="number" min="0" step="1" value="${esc(K.qty)}" autofocus></div></div>`;
  };
  const hintText=()=>{
    const q=Math.floor(num($("#s-qty")?.value)),to=$("#s-to")?$("#s-to").value:"",from=$("#s-from")?$("#s-from").value:"";
    if(mode==="in"){const t=addedTotal();
      return t?`Adds ${esc(qtyText(t,p.unit))} — the total becomes <b>${esc(qtyText((+p.qty||0)+t,p.unit))}</b>.`
        :"Adds to the total and to the places you choose.";}
    if(mode==="set"){const have=here(to),d=q-have;
      return `The app shows <b>${have}</b> at ${esc(to)}. ${$("#s-qty")?.value===""?"Enter what you counted there."
        :d===0?"That matches — nothing to change."
        :`Counted ${q}, so ${d>0?`<b style="color:var(--ok)">${d} more</b> will be added`:`<b style="color:var(--bad)">${-d} fewer</b> will be written off`} at this place. Stock in other places is left alone.`}`;}
    if(mode==="transfer")return from===to?`<span style="color:var(--warn)">Pick two different places to move between.</span>`
      :`Moves ${q>0?esc(qtyText(q,p.unit)):"pieces"} from ${esc(from)} to ${esc(to)}. The total does not change.`;
    return `Removes ${q>0?esc(qtyText(q,p.unit)):"stock"} from ${esc(to)} and from the total.`;
  };
  const draw=()=>{
    $("#s-body").innerHTML=`${body()}
     <div class="f" style="margin-top:8px"><div><label>Reason</label><select id="s-reason">${opts(K.reason,R[mode])}</select></div>
      <div><label>Note (optional)</label><input id="s-note" value="${esc(K.note)}" placeholder="Supplier / bill no. / remark"></div></div>
     <p class="small mute" id="s-hint" style="margin-top:8px"></p>`;
    document.querySelectorAll("#s-tabs button").forEach(b=>b.classList.toggle("sec",b.dataset.t!==mode));
    const hint=()=>{const e=$("#s-hint");if(e)e.innerHTML=hintText()};
    if($("#s-qty"))$("#s-qty").oninput=hint;
    if($("#s-to"))$("#s-to").onchange=()=>{read();hint()};
    if($("#s-from"))$("#s-from").onchange=()=>{read();hint()};
    if($("#s-rows"))document.querySelectorAll("#s-rows tr[data-ix] input").forEach(i=>i.oninput=()=>{readRows();hint()});
    hint();
  };
  window.stRow=(op,ix)=>{
    readRows();
    if(op==="add"){const used=rows.map(r=>r.loc);const next=locList().find(x=>!used.includes(x))||locList()[0]||UNLOC;rows.push({loc:next,qty:""})}
    else rows.splice(ix,1);
    if(!rows.length)rows=[{loc:first,qty:""}];
    draw();
  };
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:520px"><h3>${esc(p.name)}</h3>
  <p class="mute">${esc(p.sku)} · Total stock: <b>${esc(qtyText(p.qty,p.unit))}</b>${bk(p)?` · <span style="color:var(--warn)">${bk(p)} booked, ${avail(p)} free</span>`:""}</p>
  ${locEntries(p).length?`<p class="small">Where it is: ${locEntries(p).map(([k,v])=>`<span class="tag">${esc(k)}: ${v}</span>`).join(" ")}</p>`:""}
  <div class="tabs" id="s-tabs">${TABS.map((t,i)=>`<button class="btn sm ${i?"sec":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div id="s-body"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="s-save">Save</button></div></div></div>`;
  document.querySelectorAll("#s-tabs button").forEach(b=>b.onclick=()=>{read();mode=b.dataset.t;K.reason="";draw()});
  draw();
  $("#s-save").onclick=async()=>{
    read();
    const reason=K.reason,note=K.note.trim(),tail=reason+(note?" — "+note:"");
    const q=Math.floor(num(K.qty)),to=K.to,from=K.from;
    let put=[];
    if(mode==="in"){
      put=rows.map(r=>({loc:r.loc,qty:Math.floor(num(r.qty))})).filter(r=>r.qty>0);
      if(!put.length)return toast("Enter how many pieces came in",1);
      const seen={};put=put.filter(r=>{if(seen[r.loc]){seen[r.loc].qty+=r.qty;return false}seen[r.loc]=r;return true});
    }
    else if(K.qty===""||q<0)return toast("Enter a valid quantity",1);
    else if(mode!=="set"&&q<=0)return toast("Enter how many pieces",1);
    if(mode==="transfer"&&from===to)return toast("Pick two different places",1);
    const btn=$("#s-save");btn.disabled=true;btn.textContent="Saving…";
    try{
      await runTransaction(db,async tx=>{
        const r=doc(db,"products",id),s=await tx.get(r);
        if(!s.exists())throw new Error("That product no longer exists");
        const d=s.data(),cur=+d.qty||0;let map=locMapOf(d),after=cur;
        const logs=[];
        if(mode==="in"){
          let run=cur;
          put.forEach(x=>{map=addTo(map,x.loc,x.qty);logs.push({type:"in",delta:x.qty,before:run,after:run+x.qty,note:tail,toLoc:x.loc,fromLoc:""});run+=x.qty});
          after=run;
        }
        else if(mode==="out"){
          after=cur-q;
          if(after<0&&!S.settings.allowNegative)throw new Error("Not enough stock (only "+cur+")");
          const have=+map[to]||0;
          if(q>have&&!S.settings.allowNegative)throw new Error(`Only ${have} at ${to}`);
          map={...map,[to]:have-q};
          logs.push({type:"out",delta:-q,before:cur,after,note:tail,toLoc:to,fromLoc:""});
        }
        else if(mode==="set"){
          // one place is counted; everywhere else is left exactly as it was
          const have=+map[to]||0;
          map={...map,[to]:q};
          after=Object.values(map).reduce((a,v)=>a+(+v||0),0);
          logs.push({type:"adjust",delta:q-have,before:cur,after,note:`Counted ${q} at ${to} (app had ${have})`+(tail?" · "+tail:""),toLoc:to,fromLoc:""});
        }
        else{
          const have=+map[from]||0;
          if(q>have&&!S.settings.allowNegative)throw new Error(`Only ${have} at ${from}`);
          map=addTo({...map,[from]:have-q},to,q);
          after=cur;
          logs.push({type:"transfer",delta:0,before:cur,after,note:`${from} → ${to}`+(reason?" · "+reason:"")+(note?" — "+note:""),toLoc:to,fromLoc:from});
        }
        Object.keys(map).forEach(k=>{if(!map[k])delete map[k]});
        tx.update(r,{qty:after,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        logs.forEach(l=>tx.set(doc(collection(db,"movements")),
          {...mv(id,p.name,p.sku,l.type,l.delta,l.before,l.after,l.note),fromLoc:l.fromLoc,toLoc:l.toLoc}));
      });
      closeModal();
      toast(mode==="transfer"?`Moved ${q} to ${to}`
        :mode==="in"?`Added ${qtyText(put.reduce((a,x)=>a+x.qty,0),p.unit)}${put.length>1?` across ${put.length} places`:` to ${put[0].loc}`}`
        :mode==="set"?`Count set at ${to}`:"Stock updated");
    }catch(e){toast(emsg(e),1);btn.disabled=false;btn.textContent="Save"}
  };
};
function vStock(el){
  const low=S.products.filter(p=>outStock(p)||lowStock(p)).sort((a,b)=>a.qty-b.qty);
  const adm=isManager();const canCount=can("setCount");
  const byLoc={};S.products.forEach(p=>locEntries(p).forEach(([k,v])=>{byLoc[k]=byLoc[k]||{units:0,items:0};byLoc[k].units+=v;byLoc[k].items++}));
  const locRows=Object.entries(byLoc).sort((a,b)=>b[1].units-a[1].units);
  el.innerHTML=`<div class="top"><h2>Stock</h2><div class="row">${adm?"":`<span class="mute small">View only — ask a manager or admin to change a count</span>`}<button class="btn sec" onclick="exportMoves()">Export Excel</button></div></div>
  ${adm?`<div class="card" style="margin-bottom:12px"><div class="row"><input id="st-q" placeholder="Find a product to update stock — name, SKU or barcode" style="flex:1"></div><div id="st-res" style="margin-top:8px"></div></div>`:""}
  ${locRows.length?`<div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Stock by location</h3>
   <div class="pill-row">${locRows.map(([k,v])=>`<span class="tag">${esc(k)} — <b>${v.units}</b> units · ${v.items} item(s)</span>`).join("")}</div></div>`:""}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
   <div class="card"><h3 style="margin-bottom:8px">Low &amp; out of stock (${low.length})</h3>${low.slice(0,40).map(p=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${plink(p.id,p.name)}<br><span class="small mute">${esc(p.sku)}${SHOW_REORDER?` · reorder at ${p.reorder}`:""}${locEntries(p).length>1?" · "+esc(locText(p)):""}</span></span><span class="row"><span class="tag ${outStock(p)?"out":"low"}">${p.qty}</span>${adm?`<button class="btn sm sec" onclick="openStock('${p.id}','in')">+</button>`:""}${!can("setCount")?rqBtn("stock.set",p.id,`${p.name} (${p.sku})`,{qty:p.qty}):""}</span></div>`).join("")||`<p class="mute">Nothing low right now.</p>`}</div>
   <div class="card"><h3 style="margin-bottom:8px">Movement log</h3>${S.moves.slice(0,60).map(m=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${plink(m.productId,m.productName)}<br><span class="small mute">${esc(m.type)} · ${esc(m.note||"")} · ${esc(m.byName||"")} · ${fdt(tms(m.createdAt))}</span></span><span style="text-align:right"><b style="color:${m.type==="transfer"?"var(--mute)":m.delta>=0?"var(--ok)":"var(--bad)"}">${m.type==="transfer"?"moved":(m.delta>0?"+":"")+m.delta}</b><br><span class="small mute">→ ${m.after}</span></span></div>`).join("")||`<p class="mute">No movements yet.</p>`}</div></div>`;
  const q=$("#st-q");if(!q)return;q.oninput=()=>{const t=q.value.toLowerCase().trim();$("#st-res").innerHTML=t?S.products.filter(p=>`${p.name} ${p.sku} ${p.barcode||""}`.toLowerCase().includes(t)).slice(0,8).map(p=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${plink(p.id,p.name)} <span class="small mute">${esc(p.sku)}</span></span><span class="row"><span class="tag">${p.qty}</span>${adm?`<button class="btn sm" onclick="openStock('${p.id}')">Update</button>`:""}</span></div>`).join(""):""};
  q.onkeydown=e=>{if(e.key==="Enter"){const t=q.value.trim().toLowerCase();const p=S.products.find(x=>x.barcode&&x.barcode.toLowerCase()===t||x.sku.toLowerCase()===t);if(p){q.value="";openStock(p.id)}}};
}

/* ---------- POS ---------- */
function cartTotals(){
  const gross=S.cart.reduce((a,i)=>a+i.price*i.qty,0);
  let disc=S.cartDiscType==="pct"?gross*Math.min(100,S.cartDiscount)/100:Math.min(gross,S.cartDiscount);
  disc=Math.round(disc*100)/100;const total=Math.round((gross-disc)*100)/100;
  let gst=0;S.cart.forEach(i=>{const share=gross?i.price*i.qty/gross:0;const line=i.price*i.qty-disc*share;gst+=line-line/(1+i.gst/100)});
  gst=Math.round(gst*100)/100;
  return{gross,disc,total,gst,taxable:Math.round((total-gst)*100)/100};
}
const sellSum=t=>`<div class="row" style="justify-content:space-between"><span class="mute">Subtotal</span><span>${inr(t.gross)}</span></div>
  ${t.disc?`<div class="row" style="justify-content:space-between"><span class="mute">Discount</span><span>− ${inr(t.disc)}</span></div>`:""}
  <div class="row" style="justify-content:space-between"><span class="mute">incl. GST</span><span>${inr(t.gst)}</span></div>
  <div class="row" style="justify-content:space-between;font-size:20px;font-weight:700;margin-top:4px"><span>Total</span><span>${inr(t.total)}</span></div>`;
function vSell(el){
  const q=S.posQ.toLowerCase();
  const L=S.products.filter(p=>!q||`${p.name} ${p.sku} ${p.barcode||""} ${vendQ(p)} ${locKeys(p).join(" ")}`.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,60);
  const t=cartTotals();
  el.innerHTML=`<div class="top"><h2>New sale</h2><button class="btn sec" onclick="S.cart=[];S.cartDiscount=0;render()">Clear</button></div>
  <div class="pos"><div><input id="pos-q" placeholder="Scan barcode or search…" value="${esc(S.posQ)}" style="margin-bottom:10px">
   <div class="items">${L.map(p=>`<button class="item" onclick="addCart('${p.id}')"><span class="row" style="flex-wrap:nowrap">${thumb(p,38)}<b>${esc(p.name)}</b></span><b>${inr(p.price)}</b><span class="small mute">${esc(p.sku)}${dimText(p)?" · 📐 "+esc(dimText(p)):""}${catLine(p)?" · "+esc(catLine(p)):""}</span><span class="small ${avail(p)<=0?"":"mute"}" style="${avail(p)<=0?"color:var(--bad)":""}">${avail(p)} available${bk(p)?` · ${bk(p)} booked`:""}</span></button>`).join("")||`<p class="mute">No matches.</p>`}</div></div>
  <div class="card"><h3 style="margin-bottom:6px">Cart (${S.cart.length} item${S.cart.length===1?"":"s"})</h3>
   ${S.cart.map((i,ix)=>{const p=S.products.find(x=>x.id===i.pid),ent=p?locEntries(p):[],at=ent.find(([k])=>k===i.loc),short=at?Math.max(0,i.qty-at[1]):i.qty;
    return `<div class="cartline"><div><b>${esc(i.name)}</b><br><span class="small mute">${inr(i.price)} each</span></div><div style="text-align:right"><b>${inr(i.price*i.qty)}</b></div>
    <div class="qty"><button onclick="cartQty(${ix},-1)">−</button><input type="number" value="${i.qty}" min="1" onchange="cartSet(${ix},this.value)"><button onclick="cartQty(${ix},1)">+</button></div><div style="text-align:right"><button class="btn sm sec" onclick="S.cart.splice(${ix},1);render()">Remove</button></div>
    <div style="grid-column:1/-1"><label style="margin:0">Take from</label>
     <select onchange="cartLoc(${ix},this.value)">${(ent.length?ent:[[i.loc||UNLOC,0]]).map(([k,v])=>`<option value="${esc(k)}" ${i.loc===k?"selected":""}>${esc(k)} — ${v} in stock</option>`).join("")}</select>
     ${short>0&&ent.length?`<span class="small" style="color:var(--warn)">only ${at?at[1]:0} here — the other ${short} will come from the next place with stock</span>`:""}</div></div>`}).join("")||`<p class="mute">Tap a product to add it.</p>`}
   ${S.cart.length?`<p class="small mute" style="margin-top:6px">Keep searching on the left to put more products on the same bill.</p>`:""}
   <div class="f" style="margin-top:10px"><div><label>Discount</label><div class="row" style="flex-wrap:nowrap"><input id="c-disc" type="number" min="0" value="${S.cartDiscount||""}"><select id="c-dt" style="width:80px"><option value="amt" ${S.cartDiscType==="amt"?"selected":""}>₹</option><option value="pct" ${S.cartDiscType==="pct"?"selected":""}>%</option></select></div></div>
    <div><label>Payment</label><select id="c-pay">${S.lists.payModes.map(x=>`<option>${x}</option>`).join("")}</select></div>
    <div><label>Customer phone</label><input id="c-ph" inputmode="tel" list="c-phl" placeholder="Search saved customers"><datalist id="c-phl">${S.customers.slice(0,400).map(c=>`<option value="${esc(c.phone)}">${esc(c.name)}</option>`).join("")}</datalist></div>
    <div><label>Customer name</label><input id="c-name"></div><div class="full small" id="c-cinfo"></div></div>
   <div id="c-sum" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">${sellSum(t)}</div>
   <button class="btn" style="width:100%;margin-top:12px;padding:12px" id="c-done" ${S.cart.length?"":"disabled"}>Complete sale</button></div></div>`;
  const q2=$("#pos-q");q2.oninput=()=>{S.posQ=q2.value;clearTimeout(vSell.t);vSell.t=setTimeout(()=>{render();const n=$("#pos-q");n.focus();n.setSelectionRange(n.value.length,n.value.length)},150)};
  q2.onkeydown=e=>{if(e.key==="Enter"){const v=q2.value.trim().toLowerCase();const p=S.products.find(x=>(x.barcode&&x.barcode.toLowerCase()===v)||x.sku.toLowerCase()===v);if(p){addCart(p.id);S.posQ="";render();$("#pos-q").focus()}}};
  const sum=()=>{const el=$("#c-sum");if(el)el.innerHTML=sellSum(cartTotals())};
  $("#c-disc").oninput=$("#c-disc").onchange=e=>{S.cartDiscount=num(e.target.value);keepCust();sum()};
  $("#c-dt").onchange=e=>{S.cartDiscType=e.target.value;keepCust();sum()};
  const keepCust=()=>{S.cust={name:$("#c-name").value,ph:$("#c-ph").value,pay:$("#c-pay").value}};
  if(S.cust){$("#c-name").value=S.cust.name||"";$("#c-ph").value=S.cust.ph||"";$("#c-pay").value=S.cust.pay||"Cash"}
  const custInfo=()=>{const ph=$("#c-ph").value.trim(),ex=findCustByPhone(ph);const box=$("#c-cinfo");
    if(!ex){box.innerHTML=ph&&custKey(ph).length>=6?`<span class="mute">New customer — saved automatically with this sale</span>`:"";return}
    if(!$("#c-name").value.trim())$("#c-name").value=ex.name||"";
    const st=custStats(ex),led=custLedger(ex);
    box.innerHTML=`<span class="tag ok">Saved customer</span> ${esc(ex.name)} · ${st.sales.length} past ${st.sales.length===1?"bill":"bills"} · ${inr(st.spend)} spent${st.open.length?` · ${st.open.length} open booking(s)`:""} ${led.balance?balTag(led.balance):""} <a href="#customer/${ex.id}">ledger</a>`};
  $("#c-ph").oninput=()=>{keepCust();custInfo()};custInfo();
  ["#c-name","#c-ph","#c-pay"].forEach(i=>$(i).onchange=keepCust);
  $("#c-done").onclick=completeSale;
}
window.addCart=id=>{const p=S.products.find(x=>x.id===id);if(!p)return;
  const e=S.cart.find(i=>i.pid===id);const have=e?e.qty:0;
  if(!e)S.lastLoc=undefined;

async function completeSale(){
  const btn=$("#c-done");btn.disabled=true;btn.textContent="Saving…";
  const t=cartTotals(),cust={name:$("#c-name").value.trim(),phone:$("#c-ph").value.trim()},pay=$("#c-pay").value;
  const cart=S.cart.map(i=>({...i}));
  try{
    let inv="",saleId="",customerId="";
    if(cust.phone&&custKey(cust.phone).length>=6){
      const ex=findCustByPhone(cust.phone);
      if(ex){customerId=ex.id;if(isAdmin()&&cust.name&&cust.name!==ex.name)await updateDoc(doc(db,"customers",ex.id),{name:cust.name,updatedAt:serverTimestamp()}).catch(()=>{})}
      else{const r=doc(collection(db,"customers"));await setDoc(r,{name:cust.name||"Walk-in",phone:cust.phone,email:"",address:"",notes:"",createdAt:serverTimestamp(),createdBy:S.user.uid});customerId=r.id}
    }
    await runTransaction(db,async tx=>{
      const cr=doc(db,"counters","invoice"),cs=await tx.get(cr);
      const refs=cart.map(i=>doc(db,"products",i.pid));const snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(cart[ix].name+" no longer exists");if(s.data().qty<cart[ix].qty&&!S.settings.allowNegative)throw new Error("Not enough stock for "+cart[ix].name+" (only "+s.data().qty+")")});
      const n=(cs.exists()?cs.data().n:0)+1;inv=(S.settings.invoicePrefix||"INV")+"-"+String(n).padStart(5,"0");
      tx.set(cr,{n});
      const sr=doc(collection(db,"sales"));saleId=sr.id;
      snaps.forEach((s,ix)=>{const c=cart[ix],cur=s.data().qty,t=takeAt(locMapOf(s.data()),c.qty,c.loc);
        tx.update(refs[ix],{qty:cur-c.qty,locQty:t.map,location:primaryLoc(t.map)||s.data().location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(c.pid,c.name,c.sku,"sale",-c.qty,cur,cur-c.qty,inv+" · from "+t.used.map(u=>`${u[0]} (${u[1]})`).join(", ")),fromLoc:t.used.map(u=>u[0]).join(", "),toLoc:""})});
      tx.set(sr,{invoiceNo:inv,items:cart.map(i=>({pid:i.pid,sku:i.sku,name:i.name,price:i.price,qty:i.qty,gst:i.gst,cost:i.cost,takenFrom:i.loc||"",lineTotal:Math.round(i.price*i.qty*100)/100})),
        subtotal:t.gross,discount:t.disc,total:t.total,gstAmount:t.gst,taxable:t.taxable,customer:cust,customerId,payment:pay,status:"completed",
        soldBy:S.user.uid,soldByName:S.profile.name,dateKey:dkey(),createdAt:serverTimestamp()});
    });
    S.cart=[];S.cartDiscount=0;S.cust=null;S.posQ="";
    toast("Sale "+inv+" saved");render();
    printReceipt({invoiceNo:inv,items:cart,subtotal:t.gross,discount:t.disc,total:t.total,gstAmount:t.gst,customer:cust,payment:pay,soldByName:S.profile.name,createdAt:{seconds:Date.now()/1000}});
  }catch(e){toast(e.message||"Couldn't save — are you online?",1);btn.disabled=false;btn.textContent="Complete sale"}
}

/* ---------- One invoice, in full ----------
   Totals work exactly like the counter does: the discount is spread across the lines in
   proportion to their value, and GST is taken as already included in the price. */
function sumItems(items,disc){
  const gross=r2(items.reduce((a,i)=>a+num(i.price)*num(i.qty),0));
  const d=Math.min(gross,Math.max(0,r2(disc)));
  const total=r2(gross-d);
  let gst=0;items.forEach(i=>{const share=gross?num(i.price)*num(i.qty)/gross:0;const line=num(i.price)*num(i.qty)-d*share;gst+=line-line/(1+num(i.gst)/100)});
  gst=r2(gst);
  return{gross,disc:d,total,gst,taxable:r2(total-gst)};
}

/* An admin can correct a saved bill. Changing a quantity moves the stock by the difference, so
   the shelf still matches the bill. A bill raised against a booking keeps its items — those
   belong to the booking — and only the money collected on delivery can be corrected. */
window.openSaleEdit=function(id){
  if(!isAdmin())return toast("Only an admin can correct a saved bill",1);
  const s=S.sales.find(x=>x.id===id);
  if(!s)return toast("That bill no longer exists",1);
  if(s.status==="void")return toast("This bill is void — there is nothing to correct",1);
  const linked=!!s.bookingId;
  S.es={id,linked,items:s.items.map(i=>({...i})),disc:num(s.discount),pay:s.payment||"",q:"",
        collect:r2(num(s.balancePaid??(num(s.total)-num(s.advance))))};
  const draw=()=>{
    const E=S.es,t=sumItems(E.items,E.disc);
    const q=dimNorm(E.q).toLowerCase();
    const hits=q?S.products.filter(p=>dimNorm(`${p.name} ${p.sku} ${p.barcode||""} ${dimText(p)}`).toLowerCase().includes(q)).slice(0,8):[];

     ${E.items.map((i,ix)=>`<tr><td>${esc(i.name)}<br><span class="small mute">${esc(i.sku)}${i.takenFrom?" · from "+esc(i.takenFrom):""}</span></td>
       <td class="n">${linked?i.qty:`<input type="number" min="0" step="1" value="${i.qty}" style="width:70px" onchange="esSet(${ix},'qty',this.value)">`}</td>
       <td class="n">${linked?inr(i.price):`<input type="number" min="0" step="0.01" value="${i.price}" style="width:95px" onchange="esSet(${ix},'price',this.value)">`}</td>
       <td class="n">${inr(num(i.price)*num(i.qty))}</td>

     ${q?`<div class="items" style="max-height:160px;margin-top:6px">${hits.map(p=>`<button class="item" onclick="esAdd('${p.id}')"><span class="row" style="flex-wrap:nowrap">${thumb(p,30)}<b>${esc(p.name)}</b></span><b>${inr(p.price)}</b><span class="small mute">${esc(p.sku)}${dimText(p)?" · "+esc(dimText(p)):""}</span><span class="small mute">${avail(p)} available</span></button>`).join("")||`<p class="mute small">No product matches.</p>`}</div>`:""}`}
     <div class="f" style="margin-top:10px">
      ${linked?`<div><label>Collected on this bill (₹)</label><input id="es-collect" type="number" min="0" step="0.01" value="${E.collect||""}"></div>`
        :`<div><label>Discount (₹)</label><input id="es-disc" type="number" min="0" step="0.01" value="${E.disc||""}"></div>`}
      <div><label>Payment mode</label><select id="es-pay">${withCur(S.lists.payModes,E.pay).map(m=>`<option ${E.pay===m?"selected":""}>${esc(m)}</option>`).join("")}</select></div>

     <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
      <div class="row" style="justify-content:space-between"><span class="mute">Subtotal</span><span>${inr(t.gross)}</span></div>

async function saveSaleEdit(){
  const E=S.es,s=S.sales.find(x=>x.id===E.id),btn=$("#es-go");
  if(!s)return toast("That bill no longer exists",1);
  const why=($("#es-why")?.value||"").trim();
  const stamp=w=>[...(s.editLog||[]),{t:Date.now(),by:S.profile.name,what:w,why}];
  btn.disabled=true;btn.textContent="Saving…";
  const fail=e=>{toast(emsg(e),1);btn.disabled=false;btn.textContent="Save changes"};
  try{
    if(E.linked){
      const collect=r2(num($("#es-collect").value)),adv=num(s.advance);
      if(collect<0)throw new Error("That can't be a negative amount");
      if(r2(adv+collect)>num(s.total))throw new Error(`That is more than the order value — at most ${inr(r2(num(s.total)-adv))} is still due`);
      const b=writeBatch(db);
      b.update(doc(db,"sales",E.id),{payment:$("#es-pay").value,balancePaid:collect,
        editLog:stamp(`Collected on delivery changed from ${inr(num(s.balancePaid??0))} to ${inr(collect)}`),
        editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid});
      if(s.bookingId)b.update(doc(db,"bookings",s.bookingId),{collectedOnDelivery:collect,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      await b.commit();
      closeModal();toast("Invoice corrected");render();return;
    }
    const items=E.items.filter(i=>Math.floor(num(i.qty))>0).map(i=>({...i,qty:Math.floor(num(i.qty)),price:r2(num(i.price)),
      lineTotal:r2(Math.floor(num(i.qty))*r2(num(i.price)))}));
    if(!items.length)throw new Error("A bill needs at least one item — void it instead of emptying it");
    const t=sumItems(items,num($("#es-disc").value));
    if(t.total<=0)throw new Error("The bill total has to be more than zero");
    const was={},now={},locOf={};
    s.items.forEach(i=>{was[i.pid]=(was[i.pid]||0)+Math.floor(num(i.qty));locOf[i.pid]=i.takenFrom||locOf[i.pid]||""});
    items.forEach(i=>{now[i.pid]=(now[i.pid]||0)+i.qty;locOf[i.pid]=i.takenFrom||locOf[i.pid]||""});
    const delta=[...new Set([...Object.keys(was),...Object.keys(now)])]
      .map(pid=>({pid,d:(now[pid]||0)-(was[pid]||0),loc:locOf[pid]||""})).filter(x=>x.d!==0);
    await runTransaction(db,async tx=>{
      const sr=doc(db,"sales",E.id),sd=await tx.get(sr);
      if(!sd.exists())throw new Error("That bill no longer exists");
      if(sd.data().status==="void")throw new Error("This bill has just been voided by someone else");
      const refs=delta.map(x=>doc(db,"products",x.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((p,ix)=>{const x=delta[ix];
        if(!p.exists())throw new Error("A product on this bill no longer exists");
        const d=p.data(),cur=+d.qty||0;
        if(x.d>0&&cur<x.d&&!S.settings.allowNegative)throw new Error(`Only ${cur} of ${d.name} left in stock`);
        const map=x.d>0?takeAt(locMapOf(d),x.d,x.loc).map:addTo(locMapOf(d),x.loc||primaryLoc(locMapOf(d)),-x.d);
        tx.update(refs[ix],{qty:cur-x.d,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(x.pid,d.name,d.sku,x.d>0?"sale":"return",-x.d,cur,cur-x.d,
          `${s.invoiceNo} corrected by ${S.profile.name}${why?" · "+why:""}`),fromLoc:x.d>0?(x.loc||""):"",toLoc:x.d<0?(x.loc||""):""})});
      tx.update(sr,{items,subtotal:t.gross,discount:t.disc,total:t.total,gstAmount:t.gst,taxable:t.taxable,payment:$("#es-pay").value,
        editLog:stamp(`Bill changed from ${inr(num(s.total))} to ${inr(t.total)}`),
        editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid});
    });
    closeModal();toast("Invoice corrected");render();
  }catch(e){fail(e)}
}

/* A customer statement. Charges are what the shop has billed, Paid is what it has received.
   Running balance = paid - charged, so a pending amount shows as a negative number.
   Goods are charged once, when the booking is raised; the delivery invoice only records the balance paid. */
function custLedger(c){
  const st=custStats(c),ev=[];
  st.bookings.forEach(b=>{
    const adv=num(b.advance),items=b.items.map(i=>`${i.name} ×${i.qty}`).join(", ");
    ev.push({ms:tms(b.createdAt),kind:"booking",ref:b.bookingNo,link:`#booking/${b.id}`,status:b.status,
      what:`Booking ${b.bookingNo}`,
      detail:items+(num(b.discount)?` · ${inr(b.discount)} discount`:"")+(b.status==="booked"&&b.deliveryDate?` · delivery ${b.deliveryDate}`:"")+(adv?` · booking amount ${inr(adv)} received`:""),
      charge:num(b.total),paid:adv});
    if(b.status==="cancelled")ev.push({ms:tms(b.cancelledAt||b.createdAt)+1,kind:"cancel",ref:b.bookingNo,link:`#booking/${b.id}`,
      what:`Booking ${b.bookingNo} cancelled`,detail:adv?"order reversed · booking amount stays as credit until refunded":"order reversed",
      charge:-num(b.total),paid:0});
  });
  st.allSales.forEach(s=>{
    const dead=s.status==="void",linked=!!s.bookingId,adv=num(s.advance);
    const items=s.items.map(i=>`${i.name} ×${i.qty}`).join(", ");
    ev.push({ms:tms(s.createdAt),kind:dead?"void":"sale",ref:s.invoiceNo,sale:s.id,link:`#sale/${s.id}`,
      what:linked?`Invoice ${s.invoiceNo} · ${s.bookingNo} delivered`:`Invoice ${s.invoiceNo}`,
      detail:items+` · ${s.payment}`+(dead?" · voided, no effect on the balance":linked?` · charged on the booking, ${inr(r2(s.balancePaid??(num(s.total)-adv)))} collected on delivery`:isCredit(s.payment)?" · on credit, not yet received":""),
      charge:dead?0:(linked?0:num(s.total)),
      paid:dead?0:(linked?r2(s.balancePaid??(num(s.total)-adv)):(isCredit(s.payment)?0:num(s.total)))});
  });
  S.payments.filter(p=>p.customerId===c.id||(custKey(c.phone)&&custKey(p.customerPhone)===custKey(c.phone))).forEach(p=>{
    ev.push({ms:dayMs(p.date)||tms(p.createdAt),kind:"payment",ref:p.bookingNo||"",link:p.bookingId?`#booking/${p.bookingId}`:"",pay:p.id,
      what:`Payment received${p.bookingNo?` · ${p.bookingNo}`:""}`,
      detail:[p.mode,p.note,p.bookingNo?`against ${p.bookingNo}`:"on account",p.createdByName?`entered by ${p.createdByName}`:""].filter(Boolean).join(" · "),
      charge:0,paid:num(p.amount)});
  });
  ev.sort((a,b)=>a.ms-b.ms);
  let run=0;ev.forEach(e=>{run=r2(run+r2(e.paid)-r2(e.charge));e.bal=run});
  const billed=r2(ev.reduce((a,e)=>a+e.charge,0)),paid=r2(ev.reduce((a,e)=>a+e.paid,0));
  return{rows:ev,billed,paid,balance:r2(paid-billed),pending:Math.max(0,r2(billed-paid)),credit:Math.max(0,r2(paid-billed))};
}

/* ---------- Payments ---------- */
const dayMs=d=>{const t=Date.parse(String(d||"")+"T12:00:00");return isNaN(t)?0:t};
const payFor=bid=>S.payments.filter(p=>p.bookingId===bid);
// everything received against a booking: the amount taken when it was raised, plus later deposits
const bkReceived=b=>r2(num(b.advance)+payFor(b.id).reduce((a,p)=>a+num(p.amount),0));
const bkDue=b=>r2(num(b.total)-bkReceived(b)-(b.status==="delivered"?num(b.collectedOnDelivery):0));

/* A vendor statement, the mirror of the customer one: charges are what the vendor has billed
   us, paid is what we have given them, and the running balance is paid - billed, so a
   negative number is money we still owe. A positive number is an advance lying with them. */
const vendPurchases=v=>S.purchases.filter(p=>p.vendorId===v.id&&p.status!=="void");
const vendPays=v=>S.vpays.filter(p=>p.vendorId===v.id);
function vendorLedger(v){
  const ev=[];
  vendPurchases(v).forEach(p=>ev.push({ms:dayMs(p.date)||tms(p.createdAt),kind:"purchase",ref:p.billNo||"",pid:p.id,link:`#purchase/${p.id}`,
    what:`Purchase${p.billNo?" · bill "+p.billNo:""}`,
    detail:[(p.items||[]).map(i=>`${i.name} ×${i.qty}`).join(", "),(p.charges||[]).length?(p.charges||[]).map(c=>`${c.label} ${inr(c.amount)}`).join(", "):(num(p.other)?`other charges ${inr(p.other)}`:""),p.addedStock?"stock added to inventory":"",p.notes,p.createdByName?`entered by ${p.createdByName}`:""].filter(Boolean).join(" · "),
    charge:num(p.total),paid:0}));
  vendPays(v).forEach(p=>ev.push({ms:dayMs(p.date)||tms(p.createdAt),kind:"payment",ref:p.ref||"",payid:p.id,
    what:p.kind==="advance"?"Advance paid":"Payment made",
    detail:[p.mode,p.ref,p.notes,p.createdByName?`entered by ${p.createdByName}`:""].filter(Boolean).join(" · "),
    charge:0,paid:num(p.amount)}));
  ev.sort((a,b)=>a.ms-b.ms);
  let run=0;ev.forEach(e=>{run=r2(run+r2(e.paid)-r2(e.charge));e.bal=run});
  const billed=r2(ev.reduce((a,e)=>a+e.charge,0)),paid=r2(ev.reduce((a,e)=>a+e.paid,0));
  return{rows:ev,billed,paid,balance:r2(paid-billed),payable:Math.max(0,r2(billed-paid)),advance:Math.max(0,r2(paid-billed))};
}

        });

/* Correcting a saved purchase. Whatever the bill says now is compared with what it said
   before; if the pieces had been put into stock, the difference is added or taken back out so
   the shelf and the bill stay in step. Removing the bill altogether is still a separate action. */
async function savePurchaseEdit(ex,d){
  const was={},now={};
  if(ex.addedStock)(ex.items||[]).forEach(i=>{was[i.pid]=(was[i.pid]||0)+Math.floor(num(i.qty))});
  if(d.addStock)d.items.forEach(i=>{now[i.pid]=(now[i.pid]||0)+Math.floor(num(i.qty))});
  const delta=[...new Set([...Object.keys(was),...Object.keys(now)])]
    .map(pid=>({pid,q:(now[pid]||0)-(was[pid]||0)})).filter(x=>x.q!==0);
  const oldLoc=ex.loc||"";
  const rec={billNo:d.billNo,date:d.date,items:d.items,charges:d.charges,subtotal:r2(d.total-d.other),other:r2(d.other),
    total:d.total,notes:d.notes,addedStock:!!d.addStock,loc:d.addStock&&d.items.length?d.loc:"",
    editLog:[...(ex.editLog||[]),{t:Date.now(),by:S.profile.name,
      what:num(ex.total)===d.total?"Bill details changed":`Bill total changed from ${inr(ex.total)} to ${inr(d.total)}`}],
    editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid};
  const btn=$("#pu-go");
  try{
    if(delta.length){
      await runTransaction(db,async tx=>{
        const pr=doc(db,"purchases",ex.id),ps=await tx.get(pr);
        if(!ps.exists())throw new Error("That purchase no longer exists");
        const refs=delta.map(x=>doc(db,"products",x.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
        snaps.forEach((s,ix)=>{const x=delta[ix];
          if(!s.exists())throw new Error("A product on this bill no longer exists");
          const p=s.data(),cur=+p.qty||0;
          if(x.q<0&&cur< -x.q&&!S.settings.allowNegative)
            throw new Error(`Only ${cur} of ${p.name} is in stock — ${-x.q} would have to come back out of this bill`);
          const map=x.q>0?addTo(locMapOf(p),d.loc,x.q):takeAt(locMapOf(p),-x.q,oldLoc||primaryLoc(locMapOf(p))).map;
          tx.update(refs[ix],{qty:cur+x.q,locQty:map,location:primaryLoc(map)||p.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
          tx.set(doc(collection(db,"movements")),{...mv(x.pid,p.name,p.sku,x.q>0?"in":"out",x.q,cur,cur+x.q,
            `Purchase${ex.billNo?" bill "+ex.billNo:""} corrected by ${S.profile.name}`),toLoc:x.q>0?d.loc:"",fromLoc:x.q<0?(oldLoc||""):""})});
        tx.update(pr,rec);
      });
    }
    else await updateDoc(doc(db,"purchases",ex.id),rec);
    closeModal();toast(`Bill updated to ${inr(d.total)}`);render();
  }catch(e){toast(emsg(e),1);if(btn){btn.disabled=false;btn.textContent="Save changes"}}
}
window.puAdd=id=>{const p=S.products.find(x=>x.id===id);if(!p)return;

/* ---------- Correction requests ---------- */
/* Nobody but an admin can change a saved entry. A manager or sales executive asks instead:
   the request is stored, an admin sees it under Approvals and approving applies the change. */
const pendingReqs=()=>S.requests.filter(r=>r.status==="pending"&&(isAdmin()||r.requestedBy===S.user.uid));
const myReqFor=(kind,id)=>pendingReqs().find(r=>r.kind===kind&&r.targetId===id);
const RQ={
  "booking.edit":{title:"Change booking details",fields:[["advance","Booking amount received (₹)","number"],["deliveryDate","Tentative delivery date","date"],["notes","Notes","text"]]},
  "booking.cancel":{title:"Cancel this booking",fields:[]},
  "payment.edit":{title:"Correct this payment",fields:[["amount","Amount (₹)","number"],["date","Date received","date"],["note","Reference / note","text"]]},
  "payment.remove":{title:"Remove this payment",fields:[]},
  "sale.void":{title:"Void this bill",fields:[]},
  "stock.set":{title:"Correct the stock count",fields:[["qty","Counted quantity","number"]]}
};
window.askCorrection=function(kind,targetId,label,current){
  if(isAdmin())return toast("You are an admin — change it directly",1);
  const def=RQ[kind];if(!def)return;
  const ex=myReqFor(kind,targetId);
  if(ex)return toast("A request for this is already waiting for approval",1);
  const cur=current||{};
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:500px"><h3>${esc(def.title)}</h3>
  <p class="mute small">${esc(label)} — an admin has to approve this before anything changes.</p>
  <div class="grid" style="margin-top:10px">
   ${def.fields.map(f=>`<div><label>${esc(f[1])}</label><input id="rq-${f[0]}" type="${f[2]}" value="${esc(cur[f[0]]??"")}"></div>`).join("")}
   <div><label>Reason *</label><textarea id="rq-why" rows="2" placeholder="Why does this need changing?"></textarea></div></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="rq-go">Send for approval</button></div></div></div>`;
  $("#rq-go").onclick=async()=>{
    const why=$("#rq-why").value.trim();
    if(!why)return toast("Please say why",1);
    const changes={};def.fields.forEach(f=>{const el=$("#rq-"+f[0]);if(el)changes[f[0]]=f[2]==="number"?num(el.value):el.value});
    const btn=$("#rq-go");btn.disabled=true;
    try{
      await setDoc(doc(collection(db,"requests")),{kind,targetId,label,changes,before:cur,reason:why,status:"pending",
        requestedBy:S.user.uid,requestedByName:S.profile.name,requestedRole:ROLE(),createdAt:serverTimestamp()});
      closeModal();toast("Sent to the admin for approval");
    }catch(e){toast(emsg(e),1);btn.disabled=false}
  };
};
const rqBtn=(kind,id,label,cur)=>{
  if(isAdmin())return "";
  const ex=myReqFor(kind,id);
  return ex?`<span class="tag low">awaiting approval</span>`
    :`<button class="btn sm sec" onclick='askCorrection(${JSON.stringify(kind)},${JSON.stringify(id)},${JSON.stringify(label)},${JSON.stringify(cur||{})})'>Ask admin</button>`;
};
window.decideRequest=async(id,ok)=>{
  if(!isAdmin())return;
  const r=S.requests.find(x=>x.id===id);if(!r||r.status!=="pending")return;
  const note=ok?"":(prompt("Reason for rejecting (optional):")||"");
  if(ok&&!confirm(`Approve: ${RQ[r.kind]?.title||r.kind}\n${r.label}\n\nRequested by ${r.requestedByName}.`))return;
  try{
    if(ok)await applyRequest(r);
    await updateDoc(doc(db,"requests",id),{status:ok?"approved":"rejected",decidedBy:S.user.uid,decidedByName:S.profile.name,decidedAt:serverTimestamp(),decisionNote:note});
    toast(ok?"Approved and applied":"Request rejected");
  }catch(e){toast(emsg(e),1)}
};
async function applyRequest(r){
  const c=r.changes||{};
  if(r.kind==="booking.edit"){
    const b=S.bookings.find(x=>x.id===r.targetId);if(!b)throw new Error("That booking no longer exists");
    const adv=num(c.advance);
    if(adv>num(b.total))throw new Error("The booking amount is more than the order value");
    await updateDoc(doc(db,"bookings",r.targetId),{advance:adv,balance:r2(num(b.total)-adv),deliveryDate:c.deliveryDate||"",notes:c.notes||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  }
  else if(r.kind==="booking.cancel")await doCancelBooking(r.targetId);
  else if(r.kind==="payment.edit")await updateDoc(doc(db,"payments",r.targetId),{amount:num(c.amount),date:c.date||dkey(),note:c.note||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  else if(r.kind==="payment.remove")await deleteDoc(doc(db,"payments",r.targetId));
  else if(r.kind==="sale.void")await doVoidSale(r.targetId);
  else if(r.kind==="stock.set"){
    const q=Math.max(0,Math.floor(num(c.qty)));
    await runTransaction(db,async tx=>{
      const ref=doc(db,"products",r.targetId),s=await tx.get(ref);
      if(!s.exists())throw new Error("That product no longer exists");
      const d=s.data(),cur=+d.qty||0,m=locMapOf(d),k=primaryLoc(m)||d.location||UNLOC;
      const others=Object.entries(m).filter(([kk])=>kk!==k).reduce((a,[,v])=>a+(+v||0),0);
      if(q<others)throw new Error(`The other places already hold ${others} pieces — set the count per place from the Stock window instead`);
      const map={...m,[k]:q-others};
      Object.keys(map).forEach(x=>{if(!map[x])delete map[x]});

async function createBooking(){

  if(custKey(phone).length<6||!name)return toast("Customer name and phone are required",1);
  const adv=num($("#bk-adv").value),date=$("#bk-date").value,notes=$("#bk-notes").value.trim();
  const t=bkTotals(S.bcart,S.bdisc,S.bdiscType);
  if(t.total<=0)return toast("The order value has to be more than zero",1);
  if(adv>t.total)return toast("Booking amount is more than the order value",1);
  btn.disabled=true;btn.textContent="Saving…";
  const cart=S.bcart.map(i=>({...i}));
  try{
    let customerId=S.bcustId||findCustByPhone(phone)?.id||"";
    if(!customerId){const r=doc(collection(db,"customers"));await setDoc(r,{name,phone,email:"",address:"",notes:"",createdAt:serverTimestamp(),createdBy:S.user.uid});customerId=r.id}
    else if(isAdmin()){const ex=S.customers.find(c=>c.id===customerId);if(ex&&name&&name!==ex.name)await updateDoc(doc(db,"customers",customerId),{name,updatedAt:serverTimestamp()}).catch(()=>{})}
    let bno="";

      const cr=doc(db,"counters","booking"),cs=await tx.get(cr);
      const refs=cart.map(i=>doc(db,"products",i.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(cart[ix].name+" no longer exists");
        const d=s.data(),av=(+d.qty||0)-Math.max(0,+d.booked||0);
        if(av<cart[ix].qty&&!S.settings.allowNegative)throw new Error(`Only ${av} of ${cart[ix].name} available`)});
      const n=(cs.exists()?cs.data().n:0)+1;bno="BK-"+String(n).padStart(5,"0");tx.set(cr,{n});
      snaps.forEach((s,ix)=>tx.update(refs[ix],{booked:Math.max(0,+s.data().booked||0)+cart[ix].qty,updatedAt:serverTimestamp(),updatedBy:S.user.uid}));
      tx.set(doc(collection(db,"bookings")),{bookingNo:bno,customerId,customerName:name,customerPhone:phone,
        items:cart.map(i=>({pid:i.pid,sku:i.sku,name:i.name,price:i.price,qty:i.qty,gst:i.gst,cost:i.cost,lineTotal:Math.round(i.price*i.qty*100)/100})),
        subtotal:t.gross,discount:t.disc,total:t.total,gstAmount:t.gst,advance:adv,balance:r2(t.total-adv),deliveryDate:date||"",notes,status:"booked",
        createdBy:S.user.uid,createdByName:S.profile.name,dateKey:dkey(),createdAt:serverTimestamp()});
    });
    S.bcart=[];S.badv=0;S.bdisc=0;S.bdiscType="amt";S.bnotes="";S.bdate="";S.bphone="";S.bname="";S.bcustId="";
    toast("Booking "+bno+" saved");setView("bookings");
  }catch(e){toast(e.message||"Couldn't save — are you online?",1);btn.disabled=false;btn.textContent="Confirm booking"}
}

async function doCancelBooking(id){

  if(!b)throw new Error("That booking no longer exists");
  {
    await runTransaction(db,async tx=>{
      const br=doc(db,"bookings",id),bs=await tx.get(br);

async function doDeliver(id,collect,mode,recd,picks){
  const b=S.bookings.find(x=>x.id===id);if(!b)return;
  const btn=$("#dv-go");if(btn){btn.disabled=true;btn.textContent="Saving…"}
  try{
    let inv="";
    await runTransaction(db,async tx=>{
      const br=doc(db,"bookings",id),bs=await tx.get(br);
      if(bs.data().status!=="booked")throw new Error("This booking is no longer open");
      const cr=doc(db,"counters","invoice"),cs=await tx.get(cr);
      const refs=b.items.map(i=>doc(db,"products",i.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(b.items[ix].name+" no longer exists");
        if((+s.data().qty||0)<b.items[ix].qty&&!S.settings.allowNegative)throw new Error(`Not enough stock for ${b.items[ix].name} (only ${s.data().qty})`)});
      const n=(cs.exists()?cs.data().n:0)+1;inv=(S.settings.invoicePrefix||"INV")+"-"+String(n).padStart(5,"0");tx.set(cr,{n});
      const sr=doc(collection(db,"sales"));
      snaps.forEach((s,ix)=>{const i=b.items[ix],d=s.data(),cur=+d.qty||0,t=takeAt(locMapOf(d),i.qty,(picks||{})[ix]);
        tx.update(refs[ix],{qty:cur-i.qty,locQty:t.map,location:primaryLoc(t.map)||d.location||"",booked:Math.max(0,(+d.booked||0)-i.qty),updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(i.pid,i.name,i.sku,"sale",-i.qty,cur,cur-i.qty,inv+" (booking "+b.bookingNo+") · from "+t.used.map(u=>`${u[0]} (${u[1]})`).join(", ")),fromLoc:t.used.map(u=>u[0]).join(", "),toLoc:""})});
      tx.set(sr,{invoiceNo:inv,items:b.items,subtotal:num(b.subtotal??b.total),discount:num(b.discount),total:num(b.total),gstAmount:num(b.gstAmount),
        taxable:r2(num(b.total)-num(b.gstAmount)),customer:{name:b.customerName,phone:b.customerPhone},customerId:b.customerId||"",
        payment:mode||"Booking balance",status:"completed",advance:r2(recd),balancePaid:r2(collect),bookingId:id,bookingNo:b.bookingNo,
        soldBy:S.user.uid,soldByName:S.profile.name,dateKey:dkey(),createdAt:serverTimestamp()});
      tx.update(br,{status:"delivered",deliveredAt:serverTimestamp(),deliveredBy:S.profile.name,saleId:sr.id,invoiceNo:inv,collectedOnDelivery:r2(collect)});
    });
    closeModal();
    const left=r2(num(b.total)-recd-collect);
    toast(`Delivered — invoice ${inv}${left>0?` · ${inr(left)} still pending`:""}`);
    printReceipt({invoiceNo:inv,items:b.items,subtotal:num(b.subtotal??b.total),discount:num(b.discount),total:num(b.total),gstAmount:num(b.gstAmount),
      customer:{name:b.customerName,phone:b.customerPhone},payment:mode||"Booking balance",advance:r2(recd),balanceLeft:left,bookingNo:b.bookingNo,
      soldByName:S.profile.name,createdAt:{seconds:Date.now()/1000}});
  }catch(e){toast(emsg(e),1);const g=$("#dv-go");if(g){g.disabled=false;g.textContent="Deliver & bill"}}
}

const slugify=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"");
const kebab=s=>String(s).toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function uniq(base,taken){let x=base||"item",i=2;while(taken.has(x))x=(base||"item")+i++;return x}
function takenIdsSlugs(){const ids=new Set(),slugs=new Set();TAXONOMY.forEach(c=>{ids.add(c.id);slugs.add(c.slug);c.subcategories.forEach(s=>{ids.add(s.id);slugs.add(s.slug);s.subcategories.forEach(t=>{ids.add(t.id);slugs.add(t.slug)})})});return{ids,slugs}}
window.taxAct=async(ev,op,cid,sid,tid)=>{
  ev.preventDefault();ev.stopPropagation();if(!isAdmin())return;
  const tree=JSON.parse(JSON.stringify(TAXONOMY));
  const c=tree.find(x=>x.id===cid),s=c?.subcategories.find(x=>x.id===sid),t=s?.subcategories.find(x=>x.id===tid);
  const target=t||s||c;
  try{
    let renamed=null;
    if(op==="add"){
      const parent=s||c||null,lvl=s?2:c?1:0;
      const name=(prompt(`New ${["category","sub-category","type"][lvl]} name${parent?` under "${parent.name}"`:""}:`)||"").trim();if(!name)return;
      const sibs=parent?parent.subcategories:tree;
      if(sibs.some(x=>norm(x.name)===norm(name)))return toast(`"${name}" already exists here`,1);
      const{ids,slugs}=takenIdsSlugs();
      sibs.push({id:uniq(kebab(name),ids),name,slug:uniq((parent?parent.slug+"-":"")+slugify(name),slugs),subcategories:[]});
    }else if(op==="ren"){
      const name=(prompt("New name:",target.name)||"").trim();if(!name||name===target.name)return;
      const parent=t?s:s?c:null,sibs=parent?parent.subcategories:tree;
      if(sibs.some(x=>x!==target&&norm(x.name)===norm(name)))return toast(`"${name}" already exists here`,1);
      target.name=name;renamed={lvl:t?2:s?1:0,id:target.id,name};
    }else if(op==="del"){
      const key=t?"typeId":s?"subcategoryId":"categoryId",used=S.products.filter(p=>p[key]===target.id).length;
      if(used)return toast(`${used} product${used>1?"s":""} still use "${target.name}". Move or delete them first.`,1);
      if(!confirm(`Delete "${target.name}"${target.subcategories.length?" and everything inside it":""}?`))return;
      const parent=t?s:s?c:null,sibs=parent?parent.subcategories:tree;sibs.splice(sibs.indexOf(target),1);
    }
    await setDoc(doc(db,"settings","taxonomy"),{json:JSON.stringify(tree),updatedAt:serverTimestamp(),updatedBy:S.user.uid});
    if(renamed){ // keep product records in step with the new name (slugs stay stable)
      const[ik,nk]=[["categoryId","categoryName"],["subcategoryId","subcategoryName"],["typeId","typeName"]][renamed.lvl];
      const aff=S.products.filter(p=>p[ik]===renamed.id);
      for(let i=0;i<aff.length;i+=400){const b=writeBatch(db);aff.slice(i,i+400).forEach(p=>b.update(doc(db,"products",p.id),{[nk]:renamed.name}));await b.commit()}
    }
    toast("Saved");
  }catch(e){toast(emsg(e),1)}
};

};

const norm=s=>String(s??"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
function resolveCategory(r){
  const cn=norm(r.category),sn=norm(r.subcategory),tn=norm(r.type);
  if(cn||sn||tn){
    if(!cn)return{err:"Category is blank"};
    const c=TAXONOMY.find(x=>norm(x.name)===cn);
    if(!c)return{err:`Unknown category "${r.category}"`};
    if(!sn)return{cat:c};
    const s=c.subcategories.find(x=>norm(x.name)===sn);
    if(!s)return{err:`"${r.subcategory}" is not a sub-category of ${c.name}`};
    if(!tn)return{cat:c,sub:s};
    const t=s.subcategories.find(x=>norm(x.name)===tn);
    if(!t)return{err:`"${r.type}" is not a type under ${s.name}`};
    return{cat:c,sub:s,type:t};
  }
  const m=bySlug[String(r.categorySlug||"").trim()];
  return m?{cat:m.cat,sub:m.sub,type:m.type}:{err:"Category is blank"};
}

async function buildWorkbook(EJ,sheets){

  for(const sh of sheets){

    const hr=ws.getRow(1);

    hr.alignment={horizontal:"center",vertical:"middle"};hr.height=22;

    sh.rows.forEach(r=>{const row=ws.addRow(r);row.font={name:"Arial",size:10};row.alignment={vertical:"middle"}});
    if(sh.images)for(const k in sh.images){
      const rn=2+(+k);if(rn>ws.rowCount+1)continue;

/* ---------- Barcodes & labels ---------- */
const ean13check=b12=>{let s=0;for(let i=0;i<12;i++)s+=(+b12[i])*(i%2?3:1);return(10-s%10)%10};
const isEAN13=c=>/^\d{13}$/.test(c)&&ean13check(c.slice(0,12))===+c[12];
// In-store EAN-13 codes (prefix 200 is reserved by GS1 for internal use). One shared counter, so staff never get the same code twice.
async function nextBarcodes(n){
  const used=new Set(S.products.map(p=>String(p.barcode||"")));const out=[];
  await runTransaction(db,async tx=>{
    const r=doc(db,"counters","barcode"),s=await tx.get(r);let seq=s.exists()?s.data().n:0;out.length=0;
    while(out.length<n){seq++;const body="200"+String(seq).padStart(9,"0"),code=body+ean13check(body);if(!used.has(code))out.push(code)}
    tx.set(r,{n:seq});
  });
  return out;
}
const loadJsBarcode=()=>window.JsBarcode?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js";s.onload=ok;s.onerror=()=>no(new Error("Couldn't load the barcode generator — check your internet"));document.head.appendChild(s)});
const _bcMemo=new Map();
function barcodeSVG(code){
  if(_bcMemo.has(code))return _bcMemo.get(code);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  JsBarcode(svg,code,{format:isEAN13(code)?"EAN13":"CODE128",displayValue:false,margin:0,height:60,width:2});
  svg.setAttribute("preserveAspectRatio","none");svg.removeAttribute("style");
  const s=svg.outerHTML;_bcMemo.set(code,s);return s;
}
function labelsHTML(items,o,svgFn){
  const roll=o.layout==="roll";
  const css=`@page{size:${roll?"50mm 25mm":"A4"};margin:${roll?"0":"10mm 7mm"}}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#000}
.sheet{display:grid;${roll?"":"grid-template-columns:repeat(3,64mm);grid-auto-rows:34mm;"}}
.lb{padding:${roll?"1.5mm 2.5mm":"2mm 3mm"};overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid;page-break-inside:avoid;${roll?"width:50mm;height:25mm;page-break-after:always;":""}${o.border&&!roll?"outline:.2mm dashed #999;outline-offset:-.2mm;":""}}
.nm{font-size:${roll?"6.5pt":"8pt"};line-height:1.15;max-height:${roll&&o.price?"1.2em":"2.3em"};overflow:hidden;font-weight:600}
.sk{font-size:${roll?"7.5pt":"9.5pt"};font-weight:700;display:flex;justify-content:space-between;gap:4px}
.pz{font-size:${roll?"6.5pt":"8.5pt"};display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.pz b{font-size:${roll?"8pt":"10.5pt"}}
.bc svg{display:block;width:100%;height:${roll?(o.price?"7mm":"8mm"):"11mm"}}
.dm{font-size:${roll?"6.5pt":"8pt"};font-weight:600}
.no{font-size:${roll?"7pt":"8.5pt"};letter-spacing:.8px;text-align:center}`;
  const body=items.map(p=>`<div class="lb"><div class="nm">${esc(p.name)}</div>
   <div class="sk"><span>${esc(p.sku)}</span>${dimText(p)?`<span class="dm">${esc(dimText(p))}</span>`:""}</div>
   ${o.price?`<div class="pz"><span>MRP ${inr(p.mrp??p.price)}</span><b>${inr(p.price)}</b></div>`:""}
   <div class="bc">${svgFn(p.barcode)}</div><div class="no">${esc(p.barcode)}</div></div>`).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><title>Barcode labels</title><style>${css}</style></head><body><div class="sheet">${body}</div>${o.noprint?"":"<script>onload=()=>setTimeout(()=>print(),500)<\/script>"}</body></html>`;
}
window.openLabels=function(){
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:560px"><h3>Barcode labels</h3>
  <p class="mute small">Print labels with the SKU, the MRP, the selling price and a scannable barcode to stick on products in the showroom. A scanner works in Sell, Stock and the product search.</p>
  <div class="grid">
   <div><label>Which products</label><select id="lb-scope"><option value="shown">Products currently shown in the list</option><option value="all">All products</option></select></div>
   <div class="f"><div><label>Copies</label><select id="lb-copies"><option value="1">1 label per product</option><option value="qty">1 label per unit in stock</option></select></div>
   <div><label>Layout</label><select id="lb-layout"><option value="a4">A4 sheet — 24 labels (3 × 8)</option><option value="roll">Label roll — 50 × 25 mm</option></select></div></div>
   <div class="row"><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="lb-price" checked style="width:auto"> Show MRP and selling price</label>
    <label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="lb-border" checked style="width:auto"> Cut lines (A4)</label></div>
   <div id="lb-info" class="small"></div></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn sec hide" id="lb-gen">Generate missing barcodes</button>
   <span class="row" style="margin-left:auto"><button class="btn sec" onclick="closeModal()">Close</button><button class="btn sec" id="lb-xlsx">Download list (Excel)</button><button class="btn" id="lb-print">Print / Save as PDF</button></span></div></div></div>`;
  const list=()=>($("#lb-scope").value==="all"?S.products:filteredProducts()).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const info=()=>{const L=list(),miss=L.filter(p=>!p.barcode).length;
    $("#lb-info").innerHTML=`${L.length-miss} of ${L.length} products have a barcode`+(miss?` · <span style="color:var(--warn)">${miss} without a barcode (not printed)</span>`:"");
    $("#lb-gen").classList.toggle("hide",!(miss&&isAdmin()))};
  $("#lb-scope").onchange=info;info();
  $("#lb-gen").onclick=async()=>{
    const miss=list().filter(p=>!p.barcode);if(!miss.length)return;
    if(!confirm(`Create barcodes for ${miss.length} products? Once assigned, a barcode stays with that SKU.`))return;
    const btn=$("#lb-gen");btn.disabled=true;btn.textContent="Generating…";
    try{
      const codes=await nextBarcodes(miss.length);
      for(let i=0;i<miss.length;i+=400){const b=writeBatch(db);miss.slice(i,i+400).forEach((p,j)=>b.update(doc(db,"products",p.id),{barcode:codes[i+j],updatedAt:serverTimestamp(),updatedBy:S.user.uid}));await b.commit()}
      miss.forEach((p,i)=>p.barcode=codes[i]);toast(`${miss.length} barcodes created`);
    }catch(e){toast(emsg(e),1)}
    btn.disabled=false;btn.textContent="Generate missing barcodes";info();
  };
  $("#lb-xlsx").onclick=async()=>{
    const L=list().filter(p=>p.barcode);if(!L.length)return toast("No products with a barcode in this selection",1);
    try{
      const{images,EJ}=await photoMap(L);
      dlx("barcode-list-"+dkey()+".xlsx",await buildWorkbook(EJ,[{name:"Barcodes",freeze:3,images,
        cols:[["photo",11],["sku",14,"@"],["name",34],["dimension",14],["dim_unit",11],["barcode",18,"@"],["category",30],["location",18],["mrp",12,MONEY],["price",12,MONEY],["qty",7]],
        rows:L.map(p=>({sku:p.sku,name:p.name,dimension:dimOf(p),dim_unit:dimUnitOf(p),barcode:String(p.barcode),category:[p.categoryName,p.subcategoryName,p.typeName].filter(Boolean).join(" > "),
          location:p.location||"",mrp:num(p.mrp??p.price),price:num(p.price),qty:+p.qty||0}))}]));
    }catch(e){toast(emsg(e),1)}
  };
  $("#lb-print").onclick=async()=>{
    const L=list().filter(p=>p.barcode);if(!L.length)return toast("No products with a barcode in this selection",1);
    const perUnit=$("#lb-copies").value==="qty",items=[];
    L.forEach(p=>{const n=perUnit?Math.max(1,Math.floor(+p.qty||0)):1;for(let i=0;i<n;i++)items.push(p)});
    if(items.length>2000)return toast(`That would be ${items.length} labels — narrow the selection (max 2000)`,1);
    const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print",1);
    try{await loadJsBarcode();
      w.document.write(labelsHTML(items,{layout:$("#lb-layout").value,price:$("#lb-price").checked,border:$("#lb-border").checked},barcodeSVG));w.document.close();
    }catch(e){w.close();toast(emsg(e),1)}
  };
};
window.dl=dl;

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
