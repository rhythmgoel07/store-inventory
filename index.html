/* ---------- Payments ---------- */
const dayMs=d=>{const t=Date.parse(String(d||"")+"T12:00:00");return isNaN(t)?0:t};
const payFor=bid=>S.payments.filter(p=>p.bookingId===bid);
// everything received against a booking: the amount taken when it was raised, plus later deposits
const bkReceived=b=>r2(num(b.advance)+payFor(b.id).reduce((a,p)=>a+num(p.amount),0));
const advReceiptsOf=b=>{const rs=Array.isArray(b.advanceReceipts)?b.advanceReceipts.filter(r=>num(r.amount)>0):[];
  return rs.length&&r2(rs.reduce((a,r)=>a+num(r.amount),0))===r2(num(b.advance))?rs:[]};
const settleAmt=b=>r2(num(b.settleAmount)||bkReceived(b));
/* Delivered on a bill that has since been voided: the goods are back on the shelf, so the
   booking is not really delivered — it is waiting to be reopened or cancelled. */
const bkStuck=b=>{if(!b||b.status!=="delivered"||!b.saleId)return false;const s=S.sales.find(x=>x.id===b.saleId);return !!s&&s.status==="void"};
const bkStatus=b=>bkStuck(b)?"bill void":b.status;
const bkTag=b=>`<span class="tag ${b.status==="booked"?"low":b.status==="delivered"&&!bkStuck(b)?"ok":"out"}">${esc(bkStatus(b))}</span>`;
const bkDue=b=>r2(num(b.total)-bkReceived(b)-(b.status==="delivered"?num(b.collectedOnDelivery):0));
/* A ledger correction an admin makes by hand: a credit reduces what the customer owes, a
   charge increases it. Kept with the payments so it sits in the same date-wise ledger, and
   never tied to a booking, so booking balances are left alone. */
window.openAdjust=function(custId,existing){
  if(!isAdmin())return toast("Only an admin can adjust a ledger",1);
  const c=S.customers.find(x=>x.id===custId);if(!c)return;
  const L=custLedger(c),ex=existing?S.payments.find(p=>p.id===existing):null;
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:520px"><h3>${ex?"Edit adjustment":"Adjust the ledger"}</h3>
  <p class="mute small">${esc(c.name)} · ${esc(c.phone)} — ${L.balance<0?`${inr(L.pending)} pending from the customer`:L.balance>0?`${inr(L.credit)} credit with the shop`:"the account is settled"} right now.</p>
  <div class="f" style="margin-top:10px">
   <div class="full"><label>This adjustment</label><select id="aj-dir">
    <option value="credit" ${ex&&ex.adjust!=="charge"?"selected":""}>Credits the customer — reduces what they owe (refund paid, discount given, write-off)</option>
    <option value="charge" ${ex&&ex.adjust==="charge"?"selected":""}>Charges the customer — increases what they owe (missed charge, delivery fee, retained deposit)</option>
   </select></div>
   <div><label>Amount (₹) *</label><input id="aj-amt" type="number" min="0" step="0.01" value="${ex?Math.abs(num(ex.amount)):""}" autofocus></div>
   <div><label>Date</label><input id="aj-date" type="date" value="${esc(ex?.date||dkey())}"></div>
   <div class="full"><label>Reason *</label><input id="aj-note" value="${esc(ex?.note||"")}" placeholder="Why the ledger is being changed — this shows on the statement"></div></div>
  <p class="small mute" id="aj-hint" style="margin-top:8px"></p>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="aj-go">${ex?"Save changes":"Save adjustment"}</button></div></div></div>`;
  const hint=()=>{const amt=num($("#aj-amt").value),dir=$("#aj-dir").value;
    const after=r2(L.balance+(dir==="charge"?-amt:amt)-(ex?(ex.adjust==="charge"?-num(ex.amount):num(ex.amount)):0));
    $("#aj-hint").innerHTML=amt?`The balance becomes <b>${inr(after)}</b> — ${after<0?`${inr(-after)} pending from the customer`:after>0?`${inr(after)} credit with the shop`:"settled"}.`:"";};
  $("#aj-amt").oninput=hint;$("#aj-dir").onchange=hint;hint();
  $("#aj-go").onclick=async()=>{
    const amt=r2(num($("#aj-amt").value)),note=$("#aj-note").value.trim();
    if(amt<=0)return toast("Enter the amount",1);
    if(!note)return toast("Please say why — a ledger change without a reason is impossible to audit later",1);
    const btn=$("#aj-go");btn.disabled=true;
    const d={customerId:c.id,customerName:c.name,customerPhone:c.phone,bookingId:"",bookingNo:"",
      amount:amt,adjust:$("#aj-dir").value,kind:"adjustment",date:$("#aj-date").value||dkey(),
      mode:"Adjustment",note,updatedAt:serverTimestamp(),updatedBy:S.user.uid};
    try{
      if(ex)await updateDoc(doc(db,"payments",ex.id),d);
      else await setDoc(doc(collection(db,"payments")),{...d,createdBy:S.user.uid,createdByName:S.profile.name,createdAt:serverTimestamp()});
      closeModal();toast(ex?"Adjustment updated":`Adjustment of ${inr(amt)} recorded`);
    }catch(e){toast(emsg(e),1);btn.disabled=false}
  };
};

const vendorOf=p=>S.vendors.find(v=>v.id===p.vendorId)||S.vendors.find(v=>norm(v.name)===norm(vend(p)))||null;
const vendorStats=v=>{
  const items=S.products.filter(p=>p.vendorId===v.id||norm(vend(p))===norm(v.name));
  const units=items.reduce((a,p)=>a+(+p.qty||0),0);
  return{items,units,cost:items.reduce((a,p)=>a+(+p.qty||0)*num(p.cost),0),retail:items.reduce((a,p)=>a+(+p.qty||0)*num(p.price),0),

/* A vendor statement, the mirror of the customer one: charges are what the vendor has billed
   us, paid is what we have given them, and the running balance is paid - billed, so a
   negative number is money we still owe. A positive number is an advance lying with them. */
const vendPurchases=v=>S.purchases.filter(p=>p.vendorId===v.id&&p.status!=="void");
const vendPays=v=>S.vpays.filter(p=>p.vendorId===v.id);
function vendorLedger(v){
  const ev=[];
  vendPurchases(v).forEach(p=>ev.push({ms:dayMs(p.date)||tms(p.createdAt),kind:"purchase",ref:p.billNo||"",pid:p.id,link:`#purchase/${p.id}`,
    what:`Purchase${p.billNo?" · bill "+p.billNo:""}`,
    detail:[(p.items||[]).map(i=>`${i.name} ×${i.qty}`).join(", "),(p.charges||[]).length?(p.charges||[]).map(c=>`${c.label} ${inr(c.amount)}`).join(", "):(num(p.other)?`other charges ${inr(p.other)}`:""),p.addedStock?"stock added to inventory":"",p.notes,p.createdByName?`entered by ${p.createdByName}`:""].filter(Boolean).join(" · "),
    charge:num(p.total),paid:0}));
  vendPays(v).forEach(p=>ev.push({ms:dayMs(p.date)||tms(p.createdAt),kind:"payment",ref:p.ref||"",payid:p.id,
    what:p.kind==="advance"?"Advance paid":"Payment made",
    detail:[p.mode,p.ref,p.notes,p.createdByName?`entered by ${p.createdByName}`:""].filter(Boolean).join(" · "),
    charge:0,paid:num(p.amount)}));
  ev.sort((a,b)=>a.ms-b.ms);
  let run=0;ev.forEach(e=>{run=r2(run+r2(e.paid)-r2(e.charge));e.bal=run});
  const billed=r2(ev.reduce((a,e)=>a+e.charge,0)),paid=r2(ev.reduce((a,e)=>a+e.paid,0));
  return{rows:ev,billed,paid,balance:r2(paid-billed),payable:Math.max(0,r2(billed-paid)),advance:Math.max(0,r2(paid-billed))};
}

            tx.set(doc(collection(db,"movements")),{...mv(i.pid,i.name,i.sku,"in",i.qty,cur,cur+i.qty,`Purchase from ${v.name}${rec.billNo?" · bill "+rec.billNo:""}`),toLoc:loc,fromLoc:""})});
        });

/* Correcting a saved purchase. Whatever the bill says now is compared with what it said
   before; if the pieces had been put into stock, the difference is added or taken back out so
   the shelf and the bill stay in step. Removing the bill altogether is still a separate action. */
async function savePurchaseEdit(ex,d){
  const was={},now={};
  if(ex.addedStock)(ex.items||[]).forEach(i=>{was[i.pid]=(was[i.pid]||0)+Math.floor(num(i.qty))});
  if(d.addStock)d.items.forEach(i=>{now[i.pid]=(now[i.pid]||0)+Math.floor(num(i.qty))});
  const delta=[...new Set([...Object.keys(was),...Object.keys(now)])]
    .map(pid=>({pid,q:(now[pid]||0)-(was[pid]||0)})).filter(x=>x.q!==0);
  const oldLoc=ex.loc||"";
  const rec={billNo:d.billNo,date:d.date,items:d.items,charges:d.charges,subtotal:r2(d.total-d.other),other:r2(d.other),
    total:d.total,notes:d.notes,addedStock:!!d.addStock,loc:d.addStock&&d.items.length?d.loc:"",
    editLog:[...(ex.editLog||[]),{t:Date.now(),by:S.profile.name,
      what:num(ex.total)===d.total?"Bill details changed":`Bill total changed from ${inr(ex.total)} to ${inr(d.total)}`}],
    editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid};
  const btn=$("#pu-go");
  try{
    if(delta.length){
      await runTransaction(db,async tx=>{
        const pr=doc(db,"purchases",ex.id),ps=await tx.get(pr);
        if(!ps.exists())throw new Error("That purchase no longer exists");
        const refs=delta.map(x=>doc(db,"products",x.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
        snaps.forEach((s,ix)=>{const x=delta[ix];
          if(!s.exists())throw new Error("A product on this bill no longer exists");
          const p=s.data(),cur=+p.qty||0;
          if(x.q<0&&cur< -x.q&&!S.settings.allowNegative)
            throw new Error(`Only ${cur} of ${p.name} is in stock — ${-x.q} would have to come back out of this bill`);
          const map=x.q>0?addTo(locMapOf(p),d.loc,x.q):takeAt(locMapOf(p),-x.q,oldLoc||primaryLoc(locMapOf(p))).map;
          tx.update(refs[ix],{qty:cur+x.q,locQty:map,location:primaryLoc(map)||p.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
          tx.set(doc(collection(db,"movements")),{...mv(x.pid,p.name,p.sku,x.q>0?"in":"out",x.q,cur,cur+x.q,
            `Purchase${ex.billNo?" bill "+ex.billNo:""} corrected by ${S.profile.name}`),toLoc:x.q>0?d.loc:"",fromLoc:x.q<0?(oldLoc||""):""})});
        tx.update(pr,rec);
      });
    }
    else await updateDoc(doc(db,"purchases",ex.id),rec);
    closeModal();toast(`Bill updated to ${inr(d.total)}`);render();
  }catch(e){toast(emsg(e),1);if(btn){btn.disabled=false;btn.textContent="Save changes"}}
}

window.decideRequest=async(id,ok)=>{
  if(!isAdmin())return;
  const r=S.requests.find(x=>x.id===id);if(!r||r.status!=="pending")return;
  const note=ok?"":(prompt("Reason for rejecting (optional):")||"");
  if(ok&&!confirm(`Approve: ${RQ[r.kind]?.title||r.kind}\n${r.label}\n\nRequested by ${r.requestedByName}.`))return;
  try{
    if(ok)await applyRequest(r);
    await updateDoc(doc(db,"requests",id),{status:ok?"approved":"rejected",decidedBy:S.user.uid,decidedByName:S.profile.name,decidedAt:serverTimestamp(),decisionNote:note});
    toast(ok?"Approved and applied":"Request rejected");
  }catch(e){toast(emsg(e),1)}
};
async function applyRequest(r){
  const c=r.changes||{};
  if(r.kind==="booking.edit"){
    const b=S.bookings.find(x=>x.id===r.targetId);if(!b)throw new Error("That booking no longer exists");
    const adv=num(c.advance);
    if(adv>num(b.total))throw new Error("The booking amount is more than the order value");
    await updateDoc(doc(db,"bookings",r.targetId),{advance:adv,balance:r2(num(b.total)-adv),deliveryDate:c.deliveryDate||"",notes:c.notes||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  }
  else if(r.kind==="booking.cancel")await doCancelBooking(r.targetId,{mode:c.settle||"credit",amount:num(c.amount)||bkReceived(S.bookings.find(x=>x.id===r.targetId)||{}),note:r.reason||""});
  else if(r.kind==="payment.edit")await updateDoc(doc(db,"payments",r.targetId),{amount:num(c.amount),date:c.date||dkey(),note:c.note||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
  else if(r.kind==="payment.remove")await deleteDoc(doc(db,"payments",r.targetId));
  else if(r.kind==="sale.void")await doVoidSale(r.targetId);
  else if(r.kind==="stock.set"){
    const q=Math.max(0,Math.floor(num(c.qty)));
    await runTransaction(db,async tx=>{
      const ref=doc(db,"products",r.targetId),s=await tx.get(ref);
      if(!s.exists())throw new Error("That product no longer exists");
      const d=s.data(),cur=+d.qty||0,m=locMapOf(d),k=primaryLoc(m)||d.location||UNLOC;
      const others=Object.entries(m).filter(([kk])=>kk!==k).reduce((a,[,v])=>a+(+v||0),0);
      if(q<others)throw new Error(`The other places already hold ${others} pieces — set the count per place from the Stock window instead`);
      const map={...m,[k]:q-others};
      Object.keys(map).forEach(x=>{if(!map[x])delete map[x]});
      tx.update(ref,{qty:q,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      tx.set(doc(collection(db,"movements")),{...mv(r.targetId,d.name,d.sku,"adjust",q-cur,cur,q,`Stock count approved — asked by ${r.requestedByName}: ${r.reason}`),toLoc:k,fromLoc:""});
    });
  }
  else throw new Error("Unknown request type");
}

async function createBooking(){

    :(num($("#bk-adv").value)>0?[{mode:($("#bk-admode")?$("#bk-admode").value:"Cash"),amount:r2(num($("#bk-adv").value))}]:[]);

  const t=bkTotals(S.bcart,S.bdisc,S.bdiscType);
  if(t.total<=0)return toast("The order value has to be more than zero",1);
  if(adv>t.total)return toast("Booking amount is more than the order value",1);
  let dated;
  try{dated=datedAs($("#bk-on")?$("#bk-on").value:"")}catch(e){return toast(e.message,1)}
  btn.disabled=true;btn.textContent="Saving…";
  const cart=onLines(S.bcart).map(i=>({...i}));
  if(!cart.length){btn.disabled=false;btn.textContent="Confirm booking";return toast("Tick at least one item to book",1)}
  try{

    else if(isAdmin()){const ex=S.customers.find(c=>c.id===customerId);if(ex&&name&&name!==ex.name)await updateDoc(doc(db,"customers",customerId),{name,updatedAt:serverTimestamp()}).catch(()=>{})}
    let bno="";

      const cr=doc(db,"counters","booking"),cs=await tx.get(cr);
      const refs=cart.map(i=>doc(db,"products",i.pid)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
      snaps.forEach((s,ix)=>{if(!s.exists())throw new Error(cart[ix].name+" no longer exists");

    const was=qtyByPid(b.items),now=qtyByPid(items),locOf={};

    const delta=[...new Set([...Object.keys(was),...Object.keys(now)])].map(pid=>({pid,d:(now[pid]||0)-(was[pid]||0),loc:locOf[pid]||""})).filter(x=>x.d);

        return x.d>0?`+${x.d} ${n}`:`−${-x.d} ${n}`}).join(", ")].filter(Boolean).join(" · ")||"Items corrected";

        if(!sd||sd.status==="void")throw new Error("Its invoice has just been voided — open the booking again");inv=sd.invoiceNo}

        if(x.d>0&&free<x.d&&!S.settings.allowNegative)throw new Error(`Only ${Math.max(0,free)} of ${d.name} free${held?` (${held} reserved for bookings)`:""}`);
        if(!E.live){tx.update(refs[ix],{booked:Math.max(0,held+x.d),updatedAt:serverTimestamp(),updatedBy:S.user.uid});return}
        const map=x.d>0?takeAt(locMapOf(d),x.d,x.loc).map:addTo(locMapOf(d),x.loc||primaryLoc(locMapOf(d)),-x.d);
        tx.update(refs[ix],{qty:cur-x.d,locQty:map,location:primaryLoc(map)||d.location||"",updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        tx.set(doc(collection(db,"movements")),{...mv(x.pid,d.name,d.sku,x.d>0?"sale":"return",-x.d,cur,cur-x.d,
          `${inv} (booking ${bd.bookingNo}) changed by ${S.profile.name}${why?" · "+why:""}`),fromLoc:x.d>0?(x.loc||""):"",toLoc:x.d<0?(x.loc||""):""})});
      tx.update(br,{items,subtotal:t.gross,itemDiscount:t.itemDisc,discount:t.disc,total:t.total,gstAmount:t.gst,
        balance:r2(t.total-num(bd.advance)),editLog:[...(bd.editLog||[]),entry],updatedAt:serverTimestamp(),updatedBy:S.user.uid});
      if(E.live)tx.update(sr,{items:items.map(i=>({...i,...(locOf[i.pid]?{takenFrom:locOf[i.pid]}:{})})),
        subtotal:t.gross,itemDiscount:t.itemDisc,discount:t.disc,total:t.total,gstAmount:t.gst,taxable:t.taxable,
        editLog:[...(sd.editLog||[]),{...entry,what:`Booking ${bd.bookingNo} modified · ${what}`}],
        editedAt:serverTimestamp(),editedBy:S.profile.name,editedByUid:S.user.uid});
    });

  }catch(e){toast(emsg(e),1);btn.disabled=false;btn.textContent="Save changes"}
}

const slugify=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"");
const kebab=s=>String(s).toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function uniq(base,taken){let x=base||"item",i=2;while(taken.has(x))x=(base||"item")+i++;return x}
function takenIdsSlugs(){const ids=new Set(),slugs=new Set();TAXONOMY.forEach(c=>{ids.add(c.id);slugs.add(c.slug);c.subcategories.forEach(s=>{ids.add(s.id);slugs.add(s.slug);s.subcategories.forEach(t=>{ids.add(t.id);slugs.add(t.slug)})})});return{ids,slugs}}
window.taxAct=async(ev,op,cid,sid,tid)=>{
  ev.preventDefault();ev.stopPropagation();if(!isAdmin())return;
  const tree=JSON.parse(JSON.stringify(TAXONOMY));
  const c=tree.find(x=>x.id===cid),s=c?.subcategories.find(x=>x.id===sid),t=s?.subcategories.find(x=>x.id===tid);
  const target=t||s||c;
  try{
    let renamed=null;
    if(op==="add"){
      const parent=s||c||null,lvl=s?2:c?1:0;
      const name=(prompt(`New ${["category","sub-category","type"][lvl]} name${parent?` under "${parent.name}"`:""}:`)||"").trim();if(!name)return;
      const sibs=parent?parent.subcategories:tree;
      if(sibs.some(x=>norm(x.name)===norm(name)))return toast(`"${name}" already exists here`,1);
      const{ids,slugs}=takenIdsSlugs();
      sibs.push({id:uniq(kebab(name),ids),name,slug:uniq((parent?parent.slug+"-":"")+slugify(name),slugs),subcategories:[]});
    }else if(op==="ren"){
      const name=(prompt("New name:",target.name)||"").trim();if(!name||name===target.name)return;
      const parent=t?s:s?c:null,sibs=parent?parent.subcategories:tree;
      if(sibs.some(x=>x!==target&&norm(x.name)===norm(name)))return toast(`"${name}" already exists here`,1);
      target.name=name;renamed={lvl:t?2:s?1:0,id:target.id,name};
    }else if(op==="del"){
      const key=t?"typeId":s?"subcategoryId":"categoryId",used=S.products.filter(p=>p[key]===target.id).length;
      if(used)return toast(`${used} product${used>1?"s":""} still use "${target.name}". Move or delete them first.`,1);
      if(!confirm(`Delete "${target.name}"${target.subcategories.length?" and everything inside it":""}?`))return;
      const parent=t?s:s?c:null,sibs=parent?parent.subcategories:tree;sibs.splice(sibs.indexOf(target),1);
    }
    await setDoc(doc(db,"settings","taxonomy"),{json:JSON.stringify(tree),updatedAt:serverTimestamp(),updatedBy:S.user.uid});
    if(renamed){ // keep product records in step with the new name (slugs stay stable)
      const[ik,nk]=[["categoryId","categoryName"],["subcategoryId","subcategoryName"],["typeId","typeName"]][renamed.lvl];
      const aff=S.products.filter(p=>p[ik]===renamed.id);
      for(let i=0;i<aff.length;i+=400){const b=writeBatch(db);aff.slice(i,i+400).forEach(p=>b.update(doc(db,"products",p.id),{[nk]:renamed.name}));await b.commit()}
    }
    toast("Saved");
  }catch(e){toast(emsg(e),1)}
};

window.scanInto=(k,v)=>{
  const q=String(v||"").trim();if(!q)return;

  const exact=S.products.find(p=>(p.barcode&&String(p.barcode).toLowerCase()===lc)||String(p.sku||"").toLowerCase()===lc);
  const hits=exact?[exact]:S.products.filter(p=>`${p.name} ${p.sku} ${p.barcode||""}`.toLowerCase().includes(lc));
  if(hits.length===1){window[SHOP[k].add](hits[0].id);toast(`${hits[0].name} added`);return true}
  if(!hits.length){toast("Nothing matches "+q,1);return false}
  S.pf={...S.pf,q,cat:"",sub:"",type:"",dim:"",loc:"",vendor:"",stock:"all",limit:100};
  shopStart(k);

};

async function applyBulkLocation(ids,to,mode){
  const dest=String(to||"").trim();
  if(!dest)return toast("Pick a location first",1);
  const btn=$("#bl-go");btn.disabled=true;btn.textContent="Applying…";
  let done=0;
  try{
    for(let i=0;i<ids.length;i+=150){            // a batch holds 500 writes; 150 products is 300
      const b=writeBatch(db);
      for(const id of ids.slice(i,i+150)){
        const p=S.products.find(x=>x.id===id);if(!p)continue;
        const qty=+p.qty||0,at=locEntries(p).map(([k])=>k),from=at.join(", ")||p.location||"";
        const already=at.length===1&&at[0]===dest;
        if(mode==="move"&&qty>0&&!already){
          b.update(doc(db,"products",id),{locQty:{[dest]:qty},location:dest,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
          b.set(doc(collection(db,"movements")),{...mv(id,p.name,p.sku,"transfer",0,qty,qty,
            `${from||"unassigned"} → ${dest} · moved with ${ids.length} products`),fromLoc:from,toLoc:dest});
        }else if(p.location!==dest||(mode==="move"&&qty>0&&!already)){
          b.update(doc(db,"products",id),{location:dest,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        }else{continue}
        done++;
      }
      await b.commit();
    }
    closeModal();S.sel=null;
    const skipped=ids.length-done;
    toast(!done?`Nothing to change — all ${skipped} ${skipped===1?"is":"are"} already at ${dest}`
      :(mode==="move"?`${done} product${done===1?"":"s"} moved to ${dest}`:`Rack label set to ${dest} on ${done} product${done===1?"":"s"}`)
       +(skipped?` · ${skipped} already there`:""));
    render();
  }catch(e){toast(emsg(e),1);if(btn){btn.disabled=false;btn.textContent="Apply"}}
}

const norm=s=>String(s??"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
function resolveCategory(r){
  const cn=norm(r.category),sn=norm(r.subcategory),tn=norm(r.type);
  if(cn||sn||tn){
    if(!cn)return{err:"Category is blank"};
    const c=TAXONOMY.find(x=>norm(x.name)===cn);
    if(!c)return{err:`Unknown category "${r.category}"`};
    if(!sn)return{cat:c};
    const s=c.subcategories.find(x=>norm(x.name)===sn);
    if(!s)return{err:`"${r.subcategory}" is not a sub-category of ${c.name}`};
    if(!tn)return{cat:c,sub:s};
    const t=s.subcategories.find(x=>norm(x.name)===tn);
    if(!t)return{err:`"${r.type}" is not a type under ${s.name}`};
    return{cat:c,sub:s,type:t};
  }
  const m=bySlug[String(r.categorySlug||"").trim()];
  return m?{cat:m.cat,sub:m.sub,type:m.type}:{err:"Category is blank"};
}
const HMAP={sku:"sku",name:"name",productname:"name",vendor:"vendor",brand:"brandName",brandname:"brandName",supplier:"vendor",suppliername:"vendor",vendorname:"vendor",barcode:"barcode",category:"category",subcategory:"subcategory",subcat:"subcategory",type:"type",categoryslug:"categorySlug",imageurl:"imageUrl",image:"imageUrl",mrp:"mrp",price:"price",sellingprice:"price",cost:"cost",costprice:"cost",gst:"gst",qty:"qty",stock:"qty",reorder:"reorder",unit:"unit",location:"location",description:"description",dimension:"dimension",size:"dimension",dimensions:"dimension",measurement:"dimension",dimunit:"dimUnit",dimensionunit:"dimUnit",sizeunit:"dimUnit",unitofmeasurement:"dimUnit",uom:"dimUnit",phone:"phone",mobile:"phone",phoneno:"phone",phonenumber:"phone",mobileno:"phone",contact:"phone",contactno:"phone",customername:"name",email:"email",emailid:"email",address:"address",notes:"notes"};
function toObjs(all,key="sku"){
  const hi=all.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()===key));
  if(hi<0)throw new Error(`Could not find a header row with a "${key}" column`);
  const keys=all[hi].map(c=>HMAP[String(c).toLowerCase().replace(/[^a-z]/g,"")]||null);
  const out=[];
  all.slice(hi+1).forEach((r,i)=>{const o={_row:hi+i+2};let any=false;keys.forEach((k,j)=>{if(!k)return;const v=r[j]===undefined||r[j]===null?"":String(r[j]).trim();if(v!=="")any=true;o[k]=v});if(any)out.push(o)});
  return out;
}
async function loadXLSX(){
  if(window.XLSX)return window.XLSX;
  await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("Couldn't load the Excel reader — check your internet"));document.head.appendChild(s)});

async function readFileRows(file,key="sku",prefer="products"){
  if(/\.csv$/i.test(file.name))return toObjs(parseCSV(await file.text()),key);
  const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});
  const hasKey=n=>((X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""})[0])||[]).some(c=>String(c).trim().toLowerCase()===key);
  const name=wb.SheetNames.find(n=>n.toLowerCase()===prefer&&hasKey(n))||wb.SheetNames.find(hasKey);
  if(!name)throw new Error(`No sheet with a "${key}" column found`);
  return toObjs(X.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""}),key);
}

const thumbJpeg=(src,max=220)=>new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));

const XH="FF1F3A34";
// One writer for every file the app produces, so they all look and read the same.
async function buildWorkbook(EJ,sheets){
  const wb=new EJ.Workbook();wb.creator=S.settings.storeName||"Store Inventory";wb.created=new Date();
  for(const sh of sheets){
    const ws=wb.addWorksheet(sh.name);
    ws.columns=sh.cols.map(c=>({header:c[0],key:c[0],width:c[1]}));
    const hr=ws.getRow(1);
    hr.font={name:"Arial",bold:true,color:{argb:"FFFFFFFF"}};
    hr.fill={type:"pattern",pattern:"solid",fgColor:{argb:XH}};
    hr.alignment={horizontal:"center",vertical:"middle"};hr.height=22;
    sh.cols.forEach(c=>{if(c[2])ws.getColumn(c[0]).numFmt=c[2]});
    sh.rows.forEach(r=>{const row=ws.addRow(r);row.font={name:"Arial",size:10};row.alignment={vertical:"middle"}});
    if(sh.images)for(const k in sh.images){
      const rn=2+(+k);if(rn>ws.rowCount+1)continue;
      ws.getRow(rn).height=48;
      const im=wb.addImage({base64:sh.images[k],extension:"jpeg"});
      ws.addImage(im,{tl:{col:0.08,row:rn-1+0.08},ext:{width:60,height:60}});
    }
    ws.views=[{state:"frozen",ySplit:1,xSplit:sh.freeze||0}];
    if(sh.rows.length)ws.autoFilter={from:{row:1,column:1},to:{row:1,column:sh.cols.length}};
  }
  return wb.xlsx.writeBuffer();
}
function dlx(name,buf){

  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));

async function photoMap(list){

  const need=list.filter(p=>p&&p.hasImage&&!IMG.cache.get(p.id));
  for(let i=0;i<need.length;i+=20)await Promise.all(need.slice(i,i+20).map(async p=>{
    try{const s=await getDoc(doc(db,"productImages",p.id));if(s.exists())IMG.cache.set(p.id,s.data().data)}catch(e){}}));
  const images={};let failed=0;
  for(let i=0;i<list.length;i+=8)await Promise.all(list.slice(i,i+8).map(async(p,j)=>{
    if(!p)return;
    let d=p.imageUrl?await thumbJpeg(p.imageUrl):null;
    if(!d&&IMG.cache.get(p.id))d=await thumbJpeg(IMG.cache.get(p.id));
    if(d)images[i+j]=d;else if(p.imageUrl||p.hasImage)failed++;
  }));
  return{images,failed,EJ};
}

        const grip=ev.target.classList.contains("dzgrip"),sx=ev.clientX,sy=ev.clientY,s={...DZ[key]};
        try{el.setPointerCapture(ev.pointerId)}catch(e){}
        const mv=e=>{const dx=(e.clientX-sx)/k,dy=(e.clientY-sy)/k;
          const nb=grip?{x:s.x,y:s.y,w:r1(clamp(s.w+dx,1,o.w-s.x)),h:r1(clamp(s.h+dy,1,o.h-s.y))}
            :{x:r1(clamp(s.x+dx,0,o.w-s.w)),y:r1(clamp(s.y+dy,0,o.h-s.h)),w:s.w,h:s.h};
          DZ[key]={...DZ[key],...nb};place(DZ[key])};
        const up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
          designOn=true;dzEdited=true;draw()};
        el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
      });
    });
  };
  const dzDraw=o=>{
    const st=!designOn?"Automatic layout":tpl&&!dzEdited?`Saved layout · ${tpl.rec.name||""}`:dzEdited?"Adjusted for this print":"Default positions for this size";
    $("#pl-tpl").textContent=st;
    $("#pl-dz").innerHTML=dzPanel(o);
    document.querySelectorAll(".dz").forEach(i=>i.onchange=()=>{const k=i.dataset.k,pn=i.dataset.p;DZ[k]={...DZ[k],[pn]:+i.value||0};designOn=true;dzEdited=true;draw()});
    $("#pl-dzreset").onclick=()=>{DZ=defaultDesign(o.w,o.h);designOn=true;dzEdited=false;tpl=null;draw()};
    if($("#pl-savetpl"))$("#pl-savetpl").onclick=async()=>{
      const kind=$("#pl-scope").value,sc=scopes.find(x=>x[0]===kind),key=scopeKey(kind,o.w,o.h),b=$("#pl-savetpl");
      const rec={name:`${sc[2]}: ${sc[3]||""}`.trim(),layout:{...DZ},updatedAt:serverTimestamp(),updatedBy:S.user.uid};
      b.disabled=true;
      try{await setDoc(doc(db,"settings","labelLayouts"),{[key]:rec},{merge:true});
        S.labelLayouts={...S.labelLayouts,[key]:rec};tpl={key,rec};dzEdited=false;
        toast(`Layout saved for ${sc[2].toLowerCase()} ${sc[3]||""} at ${o.w} × ${o.h} mm`);draw();
      }catch(e){b.disabled=false;toast(emsg(e),1)}
    };
  };
  $("#pl-dzt").onclick=()=>{designOn=true;$("#pl-dz").classList.toggle("hide");draw()};
  const nobar=()=>{
    $("#pl-nobar").innerHTML=p.barcode?""
      :`<span style="color:var(--warn)">This product has no barcode yet.</span>${can("editProducts")?` <button class="btn sm sec" id="pl-gen" type="button">Generate barcode</button>`:" Ask an admin to generate one."}`;
    $("#pl-gen")&&($("#pl-gen").onclick=async()=>{const b=$("#pl-gen");b.disabled=true;b.textContent="Generating…";
      try{const [c]=await nextBarcodes(1);
        await updateDoc(doc(db,"products",p.id),{barcode:c,updatedAt:serverTimestamp(),updatedBy:S.user.uid});
        p.barcode=c;const cb=document.querySelector('.pl-f[data-k="barcode"]');cb.disabled=false;cb.checked=true;
        toast("Barcode "+c+" assigned");nobar();draw();
      }catch(e){b.disabled=false;b.textContent="Generate barcode";toast(emsg(e),1)}});
  };
  const draw=async()=>{
    $("#pl-custom").classList.toggle("hide",$("#pl-size").value!=="custom");
    const on=k=>{const c=document.querySelector(`.pl-f[data-k="${k}"]`);return !!(c&&c.checked&&!c.disabled)};
    const dc=document.querySelector('.pl-f[data-k="disc"]');if(dc)dc.disabled=!(on("mrp")&&on("price"));
    const tc=document.querySelector('.pl-f[data-k="tax"]');if(tc)tc.disabled=!(on("mrp")||on("price"));
    const o=opts(),any=Object.entries(o.fields).some(([k,v])=>v&&k!=="logo"&&k!=="disc"&&k!=="tax");
    dzDraw(o);
    $("#pl-print").disabled=!any;if($("#pl-direct"))$("#pl-direct").disabled=!any;
    if(!any){$("#pl-prev").innerHTML=`<span class="small mute" style="padding:30px 0">Tick at least one thing to print.</span>`;$("#pl-note").textContent="";return}
    if(o.fields.barcode)try{await loadQR()}catch(e){$("#pl-prev").innerHTML=`<span class="small mute">${esc(emsg(e))}</span>`;return}
    const lg=await logoFor(o.logoId,o);
    drawLabelPreview($("#pl-prev"),"pl-frame",labelsHTML([p],{...o,logo:lg,noprint:true},qrSVG),o.w,o.h,true);
    dzOverlay(o);
    const lname={store:"store logo",online:"online store logo"}[o.logoId]||(br?`${br.name} logo`:"logo");
    let note=`Actual size <b>${o.w} × ${o.h} mm</b>, shown enlarged. In the print dialog pick the label printer, paper size ${o.w} × ${o.h} mm, margins none, scale 100%.`
      +(o.logoId&&!lg?`<br><span style="color:var(--warn)">No ${esc(lname)} has been uploaded yet, so its corner prints blank.</span>${isAdmin()?" Add it in Settings.":" An admin can add it in Settings."}`:"");
    if(o.fields.barcode&&p.barcode&&!o.design){
      const m=+((/data-m="(\d+)"/.exec(qrSVG(String(p.barcode)))||[])[1]||0);
      if(m&&qrDots(o.w,o.h,m)<2)note+=`<br><span style="color:var(--warn)">This code is too small to print dependably on a ${o.w} × ${o.h} mm label — use a larger roll, or leave out some fields.</span>`;
    }
    $("#pl-note").innerHTML=note;
  };
  document.querySelectorAll(".pl-f").forEach(c=>c.onchange=draw);
  $("#pl-size").onchange=draw;$("#pl-logo").onchange=draw;["#pl-w","#pl-h"].forEach(i=>$(i).oninput=draw);
  $("#pl-print").onclick=async()=>{
    const o=opts();if(!Object.entries(o.fields).some(([k,v])=>v&&k!=="logo"&&k!=="disc"&&k!=="tax"))return toast("Tick at least one thing to print",1);
    const n=Math.min(500,Math.max(1,Math.floor(+$("#pl-copies").value||1)));
    const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print",1);
    try{if(o.fields.barcode)await loadQR();const lg=await logoFor(o.logoId,o);
      w.document.write(labelsHTML(Array.from({length:n},()=>p),{...o,logo:lg},qrSVG));w.document.close();
    }catch(e){w.close();toast(emsg(e),1)}
  };
  if($("#pl-direct"))$("#pl-direct").onclick=async()=>{
    const o=opts();if(!Object.entries(o.fields).some(([k,v])=>v&&k!=="logo"&&k!=="disc"&&k!=="tax"))return toast("Tick at least one thing to print",1);
    const n=Math.min(500,Math.max(1,Math.floor(+$("#pl-copies").value||1)));
    const fit=readFit("pl");
    let lg;const logoOf=async()=>lg!==undefined?lg:(lg=await logoFor(o.logoId,o));
    await seznikLabels(Array.from({length:n},()=>p),{...o,...fit},logoOf,$("#pl-direct"));
  };
  nobar();draw();
};
/* The preview is the print — the same HTML in a frame, enlarged — so what is seen is what
   comes out. */
function drawLabelPreview(box,frameId,html,W,H,rounded){
  const MM=96/25.4,room=Math.max(140,(box.clientWidth||420)-28),k=Math.min(3,room/(W*MM),260/(H*MM));
  box.innerHTML=`<div style="width:${(W*MM*k).toFixed(1)}px;height:${(H*MM*k).toFixed(1)}px;background:#fff;border-radius:${rounded?6:0}px;box-shadow:0 1px 6px rgba(0,0,0,.25);overflow:hidden;flex:none">
      <iframe id="${frameId}" title="Label preview" scrolling="no" style="border:0;width:${W}mm;height:${H}mm;transform:scale(${k.toFixed(4)});transform-origin:0 0;background:#fff;pointer-events:none"></iframe></div>`;
  box.querySelector("iframe").srcdoc=html;
}
window.openLabels=function(){
  $("#modal").innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:560px"><h3>Barcode labels</h3>
  <p class="mute small">Print labels with the SKU, the MRP, the selling price and a scannable barcode to stick on products in the showroom. A scanner works in Sell, Stock and the product search.</p>
  <div class="grid">
   <div><label>Which products</label><select id="lb-scope"><option value="shown">Products currently shown in the list</option><option value="all">All products</option></select></div>
   <div class="f"><div><label>Copies</label><select id="lb-copies"><option value="1">1 label per product</option><option value="qty">1 label per unit in stock</option></select></div>
   <div><label>Layout</label><select id="lb-layout"><option value="roll">Label roll (thermal printer)</option><option value="a4">A4 sheet — 24 labels (3 × 8)</option></select></div></div>
   <div class="f" id="lb-logorow"><div><label>Logo</label><select id="lb-logo"><option value="store">Store logo</option><option value="online">Online store logo</option>
     <option value="brand">Each product's brand logo (store logo if it has none)</option><option value="">No logo</option></select></div><div></div></div>
   <div class="f" id="lb-rollrow"><div><label>Label size on the roll</label><select id="lb-size">${LABEL_SIZES.map(([w,h2])=>`<option value="${w}x${h2}">${w} × ${h2} mm</option>`).join("")}<option value="custom">Another size…</option></select></div>
    <div id="lb-custom" class="f hide"><div><label>Width (mm)</label><input id="lb-w" type="number" min="20" max="110" step="1" value="50"></div><div><label>Height (mm)</label><input id="lb-h" type="number" min="12" max="150" step="1" value="30"></div></div></div>
   <div class="row"><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="lb-price" checked style="width:auto"> Show MRP and selling price</label>
    <label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="lb-border" checked style="width:auto"> Cut lines (A4)</label></div>
   <div id="lb-info" class="small"></div>
   <div id="lb-prevbox"><label>Preview</label><div id="lb-prev" style="background:#e9e9ec;border-radius:10px;padding:14px;display:flex;justify-content:center;overflow:hidden"></div>
    <div id="lb-prevnote" class="small mute" style="margin-top:6px"></div></div></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn sec hide" id="lb-gen">Generate missing barcodes</button>
   <span class="row" style="margin-left:auto"><button class="btn sec" onclick="closeModal()">Close</button><button class="btn sec" id="lb-xlsx">Download list (Excel)</button><button class="btn sec" id="lb-print">Print / Save as PDF</button>${directCan()?`<button class="btn" id="lb-direct">Print on Seznik</button>`:""}</span></div>
  ${directCan()?`<div id="lb-directnote" style="margin-top:10px"><div class="f">${FIT_FIELDS("lb")}</div><div class="small mute" style="margin-top:8px">${DIRECT_NOTE}</div></div>`:""}</div></div>`;
  const list=()=>($("#lb-scope").value==="all"?S.products:filteredProducts()).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const info=()=>{const L=list(),miss=L.filter(p=>!p.barcode).length;
    $("#lb-info").innerHTML=`${L.length-miss} of ${L.length} products have a barcode`+(miss?` · <span style="color:var(--warn)">${miss} without a barcode (not printed)</span>`:"");
    $("#lb-gen").classList.toggle("hide",!(miss&&isAdmin()))};
  /* What the dialog is set to, in the shape labelsHTML takes. */
  const opts=()=>{const sz=$("#lb-size").value;let w,h2;
    if(sz==="custom"){w=+$("#lb-w").value||50;h2=+$("#lb-h").value||30}else[w,h2]=sz.split("x").map(Number);
    return {layout:$("#lb-layout").value,w,h:h2,price:$("#lb-price").checked,border:$("#lb-border").checked,
      logoMode:$("#lb-logo").value,fields:{logo:!!$("#lb-logo").value}}};
  /* Fetch every logo this selection could use, then hand the label a lookup. */
  const fetchedL=new Set();
  const logoFn=async(mode,L,o)=>{
    if(!mode)return "";
    const ids=new Set(mode==="brand"?["store",...L.map(brandOf).filter(b=>b&&b.hasLogo).map(b=>"brand-"+b.id)]:[mode]);
    const box=labelGeom(o).box,fit={};
    await Promise.all([...ids].map(async id=>{const v=await getLogo(id,!fetchedL.has(id));fetchedL.add(id);fit[id]=await fitLogo(v,box)}));
    return mode==="brand"?(p=>{const b=brandOf(p);return (b&&fit["brand-"+b.id])||fit.store||""}):(fit[mode]||"");
  };
  /* The preview is the print — the same HTML in a frame, enlarged — so what is seen is what
     comes out. It shows the longest name in the selection, since that is the label that breaks. */
  const preview=async()=>{
    const o=opts(),roll=o.layout==="roll";
    $("#lb-rollrow").classList.toggle("hide",!roll);$("#lb-logorow").classList.toggle("hide",!roll);
    $("#lb-custom").classList.toggle("hide",$("#lb-size").value!=="custom");
    $("#lb-border").closest("label").classList.toggle("hide",roll);
    if($("#lb-direct")){$("#lb-direct").classList.toggle("hide",!roll);$("#lb-directnote").classList.toggle("hide",!roll)}
    saveLabelPrefs({...labelPrefs(),layout:o.layout,size:$("#lb-size").value,w:o.w,h:o.h,price:o.price});
    const L=list(),bar=L.filter(p=>p.barcode);
    const pick=(bar.length?bar:L).slice().sort((a,b)=>String(b.name||"").length-String(a.name||"").length)[0];
    if(!pick){$("#lb-prevbox").classList.add("hide");return}
    $("#lb-prevbox").classList.remove("hide");
    try{await loadQR()}catch(e){$("#lb-prev").innerHTML=`<span class="small mute">${esc(emsg(e))}</span>`;return}
    const W=roll?Math.min(110,Math.max(20,o.w)):64,H=roll?Math.min(150,Math.max(12,o.h)):34;
    const lg=roll?await logoFn(o.logoMode,[pick],o):"";
    drawLabelPreview($("#lb-prev"),"lb-frame",labelsHTML([{...pick,barcode:pick.barcode||"2000000000015"}],{...o,logo:lg,border:false,noprint:true},qrSVG),W,H,roll);
    $("#lb-prevnote").innerHTML=(roll?`Actual size <b>${W} × ${H} mm</b>, shown enlarged. One label per page — in the print dialog pick the label printer, paper size ${W} × ${H} mm, margins none, scale 100%.`
        :`One of 24 on the A4 sheet, 64 × 34 mm, shown enlarged.`)
      +(pick.barcode?` Showing <b>${esc(pick.sku||"")}</b>, the longest name in this selection.`:` This product has no barcode yet, so the bars are a sample.`);
    if(roll){ // a code too small to print dependably on this roll: the products are named
      const small=bar.filter(p=>{const m=+((/data-m="(\d+)"/.exec(qrSVG(String(p.barcode)))||[])[1]||0);return m&&qrDots(W,H,m)<2});
      if(small.length)$("#lb-prevnote").innerHTML+=`<br><span style="color:var(--warn)">${small.length} code${small.length===1?" is":"s are"} too small to print dependably on a ${W} × ${H} mm label (${esc(small.slice(0,3).map(p=>p.sku).join(", "))}${small.length>3?"…":""}) — use a larger roll for ${small.length===1?"it":"those"}.</span>`;
    }
  };
  { // open on what was used last time; a new device starts on the roll
    const pf=labelPrefs();
    if(pf.layout==="a4"||pf.layout==="roll")$("#lb-layout").value=pf.layout;
    if(pf.size&&[...$("#lb-size").options].some(x=>x.value===pf.size))$("#lb-size").value=pf.size;
    if(pf.w)$("#lb-w").value=pf.w;if(pf.h)$("#lb-h").value=pf.h;
    if(pf.price===false)$("#lb-price").checked=false;
  }
  ["#lb-layout","#lb-size","#lb-price","#lb-border","#lb-logo"].forEach(i=>$(i).onchange=preview);
  ["#lb-w","#lb-h"].forEach(i=>$(i).oninput=preview);
  $("#lb-scope").onchange=()=>{info();preview()};info();preview();
  $("#lb-gen").onclick=async()=>{
    const miss=list().filter(p=>!p.barcode);if(!miss.length)return;
    if(!confirm(`Create barcodes for ${miss.length} products? Once assigned, a barcode stays with that SKU.`))return;
    const btn=$("#lb-gen");btn.disabled=true;btn.textContent="Generating…";
    try{
      const codes=await nextBarcodes(miss.length);
      for(let i=0;i<miss.length;i+=400){const b=writeBatch(db);miss.slice(i,i+400).forEach((p,j)=>b.update(doc(db,"products",p.id),{barcode:codes[i+j],updatedAt:serverTimestamp(),updatedBy:S.user.uid}));await b.commit()}
      miss.forEach((p,i)=>p.barcode=codes[i]);toast(`${miss.length} barcodes created`);
    }catch(e){toast(emsg(e),1)}
    btn.disabled=false;btn.textContent="Generate missing barcodes";info();preview();
  };
  $("#lb-xlsx").onclick=async()=>{
    const L=list().filter(p=>p.barcode);if(!L.length)return toast("No products with a barcode in this selection",1);
    try{
      const{images,EJ}=await photoMap(L);
      dlx("barcode-list-"+dkey()+".xlsx",await buildWorkbook(EJ,[{name:"Barcodes",freeze:3,images,
        cols:[["photo",11],["sku",14,"@"],["name",34],["dimension",14],["dim_unit",11],["barcode",18,"@"],["category",30],["location",18],["mrp",12,MONEY],["price",12,MONEY],["qty",7]],
        rows:L.map(p=>({sku:p.sku,name:p.name,dimension:dimOf(p),dim_unit:dimUnitOf(p),barcode:String(p.barcode),category:[p.categoryName,p.subcategoryName,p.typeName].filter(Boolean).join(" > "),
          location:p.location||"",mrp:num(p.mrp??p.price),price:num(p.price),qty:+p.qty||0}))}]));
    }catch(e){toast(emsg(e),1)}
  };
  if($("#lb-direct"))$("#lb-direct").onclick=async()=>{
    const L=list().filter(p=>p.barcode);if(!L.length)return toast("No products with a barcode in this selection",1);
    const perUnit=$("#lb-copies").value==="qty",items=[];
    L.forEach(p=>{const n=perUnit?Math.max(1,Math.floor(+p.qty||0)):1;for(let i=0;i<n;i++)items.push(p)});
    if(items.length>300)return toast(`That would be ${items.length} labels — over Bluetooth, print at most 300 at a time`,1);
    if(items.length>20&&!confirm(`Print ${items.length} labels on the Seznik printer?`))return;
    const o=opts(),fit=readFit("lb");let fn;
    const logoOf=async p=>{if(fn===undefined)fn=await logoFn(o.logoMode,L,o);return typeof fn==="function"?fn(p):fn};
    await seznikLabels(items,{...o,layout:"roll",...fit},logoOf,$("#lb-direct"));
  };
  $("#lb-print").onclick=async()=>{
    const L=list().filter(p=>p.barcode);if(!L.length)return toast("No products with a barcode in this selection",1);
    const perUnit=$("#lb-copies").value==="qty",items=[];
    L.forEach(p=>{const n=perUnit?Math.max(1,Math.floor(+p.qty||0)):1;for(let i=0;i<n;i++)items.push(p)});
    if(items.length>2000)return toast(`That would be ${items.length} labels — narrow the selection (max 2000)`,1);
    const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print",1);
    try{await loadQR();
      const o=opts();w.document.write(labelsHTML(items,{...o,logo:o.layout==="roll"?await logoFn(o.logoMode,L,o):""},qrSVG));w.document.close();
    }catch(e){w.close();toast(emsg(e),1)}
  };
};
window.dl=dl;

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v="+encodeURIComponent(BUILD)).catch(()=>{});
/* Is there a newer build on the server than the one this screen is running? version.txt holds
   nothing but the stamp, so asking costs a few bytes and can be done while the app sits open on
   the counter all day. The page is never reloaded underneath someone halfway through a bill —
   it offers, and they choose when. */
async function checkForNewBuild(){
  if(BUILD==="dev"||!navigator.onLine||$("#upd"))return;
  try{
    const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const live=(await r.text()).trim();
    if(live&&live!==BUILD)showUpdateBar(live);
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkForNewBuild()});
window.addEventListener("online",checkForNewBuild);
setInterval(checkForNewBuild,20*60*1000);
setTimeout(checkForNewBuild,8000);
</script>
